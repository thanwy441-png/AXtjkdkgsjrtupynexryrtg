<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - يلا كيمياء</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --bg-body: #f8f7fc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f5f3ff;
            --bg-input: #f8f7fc;
            --bg-hover: #f0edf7;
            --text-primary: #1a1025;
            --text-secondary: #6b5f7a;
            --text-muted: #9a8da8;
            --border-color: #e8e4f0;
            --shadow: 0 2px 12px rgba(106, 76, 147, 0.08);
            --shadow-hover: 0 6px 24px rgba(106, 76, 147, 0.12);
            --radius: 1rem;
            --radius-sm: 0.6rem;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 260px;
            --navbar-height: 64px;
            --primary: #7C3AED;
            --primary-light: #8B5CF6;
            --primary-dark: #6D28D9;
            --primary-bg: rgba(124, 58, 237, 0.08);
            --success: #10B981;
            --success-bg: rgba(16, 185, 129, 0.08);
            --danger: #EF4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --warning: #F59E0B;
            --warning-bg: rgba(245, 158, 11, 0.08);
            --info: #3B82F6;
            --info-bg: rgba(59, 130, 246, 0.08);
            --gradient-primary: linear-gradient(135deg, #7C3AED, #8B5CF6);
            --gradient-success: linear-gradient(135deg, #10B981, #34D399);
            --gradient-danger: linear-gradient(135deg, #EF4444, #F87171);
            --gradient-warning: linear-gradient(135deg, #F59E0B, #FBBF24);
        }

        [data-theme="dark"] {
            --bg-body: #0f0a1a;
            --bg-sidebar: #1a1128;
            --bg-card: #1f1635;
            --bg-card-hover: #2a1f42;
            --bg-input: #2a1f42;
            --bg-hover: #2a1f42;
            --text-primary: #f1edf7;
            --text-secondary: #b8adc9;
            --text-muted: #7a6d8d;
            --border-color: #2f2347;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 6px 24px rgba(0, 0, 0, 0.4);
            --primary-bg: rgba(124, 58, 237, 0.15);
            --success-bg: rgba(16, 185, 129, 0.15);
            --danger-bg: rgba(239, 68, 68, 0.15);
            --warning-bg: rgba(245, 158, 11, 0.15);
            --info-bg: rgba(59, 130, 246, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            transition: var(--transition);
            overflow-y: auto;
            padding: 0.5rem 0;
            box-shadow: var(--shadow);
        }

        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .sidebar .logo {
            padding: 0.8rem 1.2rem 1.2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0.5rem;
        }

        .sidebar .logo img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            margin-bottom: 0.3rem;
        }

        .sidebar .logo h2 {
            font-size: 1.1rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar .logo .sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
        }

        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.6rem 1.2rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border-right: 3px solid transparent;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 0 8px 8px 0;
            margin: 0.1rem 0.5rem 0.1rem 0;
        }

        .sidebar .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar .nav-item.active {
            color: var(--primary);
            border-right-color: var(--primary);
            background: var(--primary-bg);
        }

        .sidebar .nav-item i { width: 20px; text-align: center; font-size: 0.9rem; }

        .sidebar .nav-item .badge {
            margin-right: auto;
            padding: 0.05rem 0.5rem;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 700;
            background: var(--primary);
            color: #fff;
        }

        .sidebar .nav-item .badge.success { background: var(--success); }
        .sidebar .nav-item .badge.warning { background: var(--warning); }
        .sidebar .nav-item .badge.danger { background: var(--danger); }

        .sidebar .nav-divider {
            height: 1px;
            background: var(--border-color);
            margin: 0.3rem 1.2rem;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            margin-right: var(--sidebar-width);
            min-height: 100vh;
            padding: 0;
        }

        /* ============================================================
           ADMIN NAVBAR
           ============================================================ */
        .admin-navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0 1.5rem;
            height: var(--navbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 999;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
        }

        .admin-navbar .left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .admin-navbar .left .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .admin-navbar .left .menu-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .admin-navbar .left .page-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .admin-navbar .right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .admin-navbar .right .online-counter {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            background: var(--success-bg);
            border: 1px solid var(--success);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--success);
        }

        .admin-navbar .right .online-counter .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .admin-navbar .right .theme-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .admin-navbar .right .theme-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .admin-navbar .right .admin-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .admin-navbar .right .admin-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: #fff;
        }

        .admin-navbar .right .logout-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            padding: 0.3rem 0.8rem;
            border-radius: var(--radius-sm);
        }

        .admin-navbar .right .logout-btn:hover {
            color: var(--danger);
            background: var(--danger-bg);
        }

        /* ============================================================
           PAGE CONTENT
           ============================================================ */
        .page-content {
            padding: 1.5rem;
        }

        /* ============================================================
           STATS GRID
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1rem 1rem 0.8rem;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .stat-card .icon { font-size: 1.2rem; margin-bottom: 0.1rem; }
        .stat-card .number {
            font-size: 1.3rem;
            font-weight: 900;
            display: block;
            font-family: 'Tajawal', sans-serif;
        }
        .stat-card .number.primary { color: var(--primary); }
        .stat-card .number.success { color: var(--success); }
        .stat-card .number.warning { color: var(--warning); }
        .stat-card .number.danger { color: var(--danger); }
        .stat-card .number.info { color: var(--info); }
        .stat-card .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stat-card .change {
            font-size: 0.6rem;
            font-weight: 600;
            margin-top: 0.1rem;
        }
        .stat-card .change.up { color: var(--success); }
        .stat-card .change.down { color: var(--danger); }

        /* ============================================================
           ONLINE USERS CARD
           ============================================================ */
        .online-users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .online-user-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .online-user-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .online-user-card .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
            background: var(--gradient-primary);
            color: #fff;
            overflow: hidden;
        }

        .online-user-card .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .online-user-card .info {
            flex: 1;
            min-width: 0;
        }

        .online-user-card .info .name {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .online-user-card .info .details {
            font-size: 0.65rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.6rem;
        }

        .online-user-card .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .online-user-card .status-dot.online {
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }

        .online-user-card .status-dot.offline {
            background: var(--text-muted);
        }

        .online-user-card .time {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-align: left;
            flex-shrink: 0;
        }

        /* ============================================================
           CHARTS
           ============================================================ */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1rem 1rem 1.2rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .chart-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .chart-card .chart-header {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
        }

        .chart-bar-container {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .chart-bar-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chart-bar-item .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            min-width: 70px;
            text-align: right;
        }

        .chart-bar-item .bar-track {
            flex: 1;
            height: 20px;
            background: var(--bg-body);
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
        }

        .chart-bar-item .bar-track .bar-fill {
            height: 100%;
            border-radius: var(--radius-sm);
            transition: width 1s ease;
            background: var(--primary);
        }

        .chart-bar-item .bar-track .bar-fill.success { background: var(--success); }
        .chart-bar-item .bar-track .bar-fill.warning { background: var(--warning); }
        .chart-bar-item .bar-track .bar-fill.danger { background: var(--danger); }
        .chart-bar-item .bar-track .bar-fill.info { background: var(--info); }

        .chart-bar-item .value {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-primary);
            min-width: 35px;
            text-align: left;
        }

        /* ============================================================
           CARDS
           ============================================================ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .card .card-header h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card .card-header .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 700px;
        }

        table thead th {
            padding: 0.5rem 0.8rem;
            text-align: right;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        table tbody td {
            padding: 0.5rem 0.8rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: middle;
        }

        table tbody tr:hover {
            background: var(--bg-hover);
        }

        .status-badge {
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-badge.active { background: var(--success-bg); color: var(--success); }
        .status-badge.banned { background: var(--danger-bg); color: var(--danger); }
        .status-badge.pending { background: var(--warning-bg); color: var(--warning); }
        .status-badge.online { background: var(--success-bg); color: var(--success); }
        .status-badge.offline { background: var(--bg-hover); color: var(--text-muted); }
        .status-badge.available { background: var(--success-bg); color: var(--success); }
        .status-badge.used { background: var(--bg-hover); color: var(--text-muted); }
        .status-badge.disabled { background: var(--danger-bg); color: var(--danger); }
        .status-badge.expired { background: var(--warning-bg); color: var(--warning); }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-sm {
            padding: 0.25rem 0.8rem;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-sm.primary { background: var(--gradient-primary); color: #fff; }
        .btn-sm.primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
        .btn-sm.success { background: var(--gradient-success); color: #fff; }
        .btn-sm.success:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-sm.danger { background: var(--gradient-danger); color: #fff; }
        .btn-sm.danger:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .btn-sm.warning { background: var(--gradient-warning); color: #fff; }
        .btn-sm.warning:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
        .btn-sm.info { background: var(--info); color: #fff; }
        .btn-sm.info:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .btn-sm.outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .btn-sm.outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg);
        }
        .btn-sm.icon-only {
            padding: 0.25rem 0.4rem;
            min-width: 28px;
            justify-content: center;
        }

        /* ============================================================
           SEARCH / FILTER
           ============================================================ */
        .search-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-bar input,
        .search-bar select {
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.8rem;
            outline: none;
            transition: var(--transition);
            min-height: 36px;
        }

        .search-bar input:focus,
        .search-bar select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-bar select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination {
            display: flex;
            gap: 0.3rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.75rem;
            min-width: 32px;
        }

        .pagination button:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg);
        }

        .pagination button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem 2rem 2rem;
            max-width: 850px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
            box-shadow: var(--shadow-hover);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-box .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* ============================================================

        .timeline-item .icon.primary { background: var(--primary-bg); color: var(--primary); }
        .timeline-item .icon.success { background: var(--success-bg); color: var(--success); }
        .timeline-item .icon.danger { background: var(--danger-bg); color: var(--danger); }

</head>

    <!-- ===== FIREBASE ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBOBu3wp3GcA-VjwtqIt1PAYYpo_HXFhtU",
            authDomain: "yalla-kimya.firebaseapp.com",
            databaseURL: "https://yalla-kimya-default-rtdb.firebaseio.com",
            projectId: "yalla-kimya",
            storageBucket: "yalla-kimya.firebasestorage.app",
            messagingSenderId: "1052374689829",
            appId: "1:1052374689829:web:fbb815ab42d753e63377cc",
            measurementId: "G-B3SJFF8R1R"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ============================================================
        // THEME
        // ============================================================
        function getTheme() {
            return localStorage.getItem('adminTheme') || 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('adminTheme', theme);
            const icon = document.querySelector('#themeToggle i');
            if (icon) {
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        function toggleTheme() {
            const current = getTheme();
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        }

        applyTheme(getTheme());

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let currentAdmin = null;
        let isAdmin = false;
        let allUsers = [];
        let allCourses = [];
        let allLessons = [];
        let allExams = [];
        let allQuizzes = [];
        let allAssignments = [];
        let allSubscriptions = [];
        let allLogs = [];
        let allActivationCodes = [];
        let onlineSessions = {};
        let currentPage = 'dashboard';
        let isLoading = false;
        let usersPage = 1;
        const USERS_PAGE_SIZE = 20;
        let usersFilter = 'all';
        let usersSearch = '';
        let usersSort = 'newest';

        // Real-time listeners
        let onlineListener = null;
        let usersListener = null;
        let coursesListener = null;
        let subscriptionsListener = null;
        let codesListener = null;
        let logsListener = null;

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const el = document.createElement('div');
            el.className = 'toast toast-' + type;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 4000);
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(title, bodyHTML) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        // ============================================================
        // SIDEBAR
        // ============================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        // ============================================================
        // CHECK ADMIN
        // ============================================================
        async function checkAdmin(uid) {
            try {
                const snap1 = await db.ref('admins/' + uid).once('value');
                if (snap1.exists() && snap1.val() === true) return true;
                const snap2 = await db.ref('users/' + uid).once('value');
                if (snap2.exists()) {
                    const data = snap2.val();
                    if (data.isAdmin === true || data.role === 'admin' || data.role === true) return true;
                }
                return false;
            } catch (e) {
                console.error('Admin check error:', e);
                return false;
            }
        }

        // ============================================================
        // AUTH & ADMIN CHECK
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const isAdminUser = await checkAdmin(user.uid);
            if (!isAdminUser) {
                showToast('⛔ غير مصرح لك بالدخول إلى لوحة التحكم', 'error');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                return;
            }

            isAdmin = true;
            currentUser = user;
            document.getElementById('adminName').textContent = user.displayName || 'Admin';
            document.getElementById('adminAvatar').textContent = (user.displayName || 'A')[0];

            db.ref('users/' + user.uid).once('value').then(snap => {
                if (snap.exists()) {
                    currentAdmin = snap.val();
                    document.getElementById('adminName').textContent = currentAdmin.name || 'Admin';
                    document.getElementById('adminAvatar').textContent = (currentAdmin.name || 'A')[0];
                }
            });

            // ✅ Start all real-time listeners
            startRealTimeListeners();

            await loadAllData();
            loadPage('dashboard');
            showToast('👋 مرحباً بك في لوحة التحكم', 'info');
        });

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout() {
            // Clean up listeners
            stopRealTimeListeners();
            auth.signOut().then(() => { window.location.href = 'login.html'; });
        }

        // ============================================================
        // REAL-TIME LISTENERS
        // ============================================================
        function startRealTimeListeners() {
            // ✅ Online Sessions (المسار الصحيح: onlineSessions)
            if (onlineListener) {
                db.ref('onlineSessions').off('value', onlineListener);
            }
            onlineListener = db.ref('onlineSessions').on('value', (snapshot) => {
                if (snapshot.exists()) {
                    onlineSessions = snapshot.val();
                } else {
                    onlineSessions = {};
                }
                updateOnlineCounter();
                if (currentPage === 'online') renderOnlineUsers();
                if (currentPage === 'dashboard') renderDashboard();
            });

            // ✅ Users
            if (usersListener) {
                db.ref('users').off('value', usersListener);
            }
            usersListener = db.ref('users').on('value', (snapshot) => {
                allUsers = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const data = child.val();
                        if (data.isAdmin === true || data.role === 'admin') return;
                        allUsers.push({
                            id: child.key,
                            ...data,
                            atoms: data.atoms || 0,
                            name: data.name || 'مستخدم',
                            phone: data.phone || '',
                            email: data.email || '',
                            grade: data.grade || 'تالتة ثانوي',
                            section: data.section || '',
                            studyType: data.studyType || 'عام',
                            howFound: data.howFound || 'أخرى',
                            gender: data.gender || 'غير محدد',
                            createdAt: data.createdAt || Date.now(),
                            banned: data.banned === true || data.isBanned === true,
                            status: data.banned === true || data.isBanned === true ? 'banned' : 'active',
                            active: data.active !== false,
                            loginCount: data.loginCount || 0,
                            lastLogin: data.lastLogin || null,
                            rank: data.rank || '--',
                            progress: data.progress || {},
                            photoURL: data.photoURL || '',
                            code: data.code || '',
                            premiumCourses: data.premiumCourses || {},
                            errorBank: data.errorBank || [],
                            results: data.results || [],
                            subscriptions: data.subscriptions || {},
                            frozen: data.frozen || false
                        });
                    });
                }
                document.getElementById('usersCountBadge').textContent = allUsers.length;
                if (currentPage === 'users') renderUsers();
                if (currentPage === 'dashboard') renderDashboard();
            });

            // ✅ Courses
            if (coursesListener) {
                db.ref('courses').off('value', coursesListener);
            }
            coursesListener = db.ref('courses').on('value', (snapshot) => {
                allCourses = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const data = child.val();
                        allCourses.push({
                            id: child.key,
                            ...data,
                            isFree: data.isFree !== false,
                            subscribers: data.subscribers || {},
                            subscriberCount: data.subscribers ? Object.keys(data.subscribers).length : 0,
                            pageViews: data.pageViews || 0,
                            revenue: data.revenue || 0
                        });
                    });
                }
                if (currentPage === 'courses') renderCourses();
                if (currentPage === 'dashboard') renderDashboard();
            });

            // ✅ Subscriptions (المسار الصحيح: subscriptions)
            if (subscriptionsListener) {
                db.ref('subscriptions').off('value', subscriptionsListener);
            }
            subscriptionsListener = db.ref('subscriptions').on('value', (snapshot) => {
                allSubscriptions = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        allSubscriptions.push({ id: child.key, ...child.val() });
                    });
                }
                if (currentPage === 'subscriptions') renderSubscriptions();
                if (currentPage === 'dashboard') renderDashboard();
            });

            // ✅ Activation Codes (المسار الصحيح: activationCodes)
            if (codesListener) {
                db.ref('activationCodes').off('value', codesListener);
            }
            codesListener = db.ref('activationCodes').on('value', (snapshot) => {
                allActivationCodes = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        allActivationCodes.push({ id: child.key, ...child.val() });
                    });
                }
                document.getElementById('codesCountBadge').textContent = allActivationCodes.length;
                if (currentPage === 'codes') renderActivationCodes();
                if (currentPage === 'dashboard') renderDashboard();
            });

            // ✅ Admin Logs (المسار الصحيح: adminLogs)
            if (logsListener) {
                db.ref('adminLogs').off('value', logsListener);
            }
            logsListener = db.ref('adminLogs').orderByChild('timestamp').limitToLast(100).on('value', (snapshot) => {
                allLogs = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        allLogs.push({ id: child.key, ...child.val() });
                    });
                    allLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                }
                if (currentPage === 'dashboard') renderDashboard();
            });
        }

        function stopRealTimeListeners() {
            if (onlineListener) { db.ref('onlineSessions').off('value', onlineListener);
                onlineListener = null; }
            if (usersListener) { db.ref('users').off('value', usersListener);
                usersListener = null; }
            if (coursesListener) { db.ref('courses').off('value', coursesListener);
                coursesListener = null; }
            if (subscriptionsListener) { db.ref('subscriptions').off('value', subscriptionsListener);
                subscriptionsListener = null; }
            if (codesListener) { db.ref('activationCodes').off('value', codesListener);
                codesListener = null; }
            if (logsListener) { db.ref('adminLogs').off('value', logsListener);
                logsListener = null; }

        // ============================================================
        // PAGE LOADER
        // ============================================================
        function loadPage(page) {
            if (isLoading) return;
            isLoading = true;

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');

            const titles = {
                dashboard: 'الرئيسية',
                online: 'المتصلون الآن',
                users: 'الطلاب',
                courses: 'الكورسات',
                subscriptions: 'الاشتراكات',
                codes: 'أكواد التفعيل',
                settings: 'الإعدادات'
            };
            document.getElementById('pageTitle').textContent = titles[page] || page;
            currentPage = page;

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('open');
            }

            const content = document.getElementById('pageContent');

            switch (page) {
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'online':
                    renderOnlineUsers();
                    break;
                case 'users':
                    renderUsers();
                    break;
                case 'courses':
                    renderCourses();
                    break;
                case 'subscriptions':
                    renderSubscriptions();
                    break;
                case 'codes':
                    renderActivationCodes();
                    break;
                case 'settings':
                    renderSettings();
                    break;
                default:
                    content.innerHTML =
                    '<div class="empty-state"><div class="icon">🚧</div><h4>صفحة قيد التطوير</h4></div>';
            }

            setTimeout(() => { isLoading = false; }, 300);
        }

                        <div class="change up">تحديث فوري</div>

                </div>

                <div class="online-users-grid" id="onlineUsersGrid">
                    ${Object.keys(onlineSessions).length === 0 ? `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <div class="icon">🟢</div>
                            <h4>لا يوجد متصلون الآن</h4>
                            <p>سيظهر هنا جميع الطلاب المتصلين</p>
                        </div>
                    ` : Object.entries(onlineSessions).map(([sessionId, session]) => {
                        const user = allUsers.find(u => u.id === session.uid);
                        const name = user?.name || session.name || 'مستخدم';
                        const photo = user?.photoURL || session.photoURL || '';
                        const device = session.deviceType || 'Desktop';
                        const os = session.operatingSystem || '—';
                        const browser = session.browser || '—';
                        const page = session.currentPage || '—';
                        const courseId = session.currentCourseId || '—';
                        const course = allCourses.find(c => c.id === courseId);
                        const courseName = course?.title || courseId;
                        const loginTime = session.loginAt ? new Date(session.loginAt).toLocaleTimeString('ar') : '—';
                        const duration = session.loginAt ? Math.floor((Date.now() - new Date(session.loginAt).getTime()) / 60000) : 0;

                        const deviceIcon = device === 'Desktop' ? '🖥️' : device === 'Mobile' ? '📱' : '📟';
                        const osIcon = os === 'Windows' ? '🪟' : os === 'macOS' ? '🍎' : os === 'Android' ? '🤖' : os === 'iOS' ? '🍏' : '💻';

                                        <span>${browser}</span>

                                        ${courseName && courseName !== '—' ? `<span>📚 ${courseName}</span>` : ''}
                                    </div>
                                </div>
                                <div class="time">
                                    <div><span class="status-dot online"></span> ${duration}m</div>
                                    <div style="font-size:0.5rem;color:var(--text-muted);">🕐 ${loginTime}</div>
                                </div>
                            </div>

                </div>

                <div class="card" style="margin-top:1rem;">
                    <div class="card-header">
                        <h4>📊 تفاصيل الجلسات</h4>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr><th>الطالب</th><th>الجلسة</th><th>الدخول</th><th>المدة</th><th>الجهاز</th><th>المتصفح</th><th>نظام التشغيل</th><th>الصفحة</th></tr>
                            </thead>
                            <tbody>
                                ${Object.keys(onlineSessions).length === 0 ? `
                                    <tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:1rem;">لا توجد جلسات نشطة</td></tr>
                                ` : Object.entries(onlineSessions).slice(0, 30).map(([sessionId, session]) => {
                                    const user = allUsers.find(u => u.id === session.uid);
                                    const name = user?.name || session.name || 'مستخدم';
                                    const loginTime = session.loginAt ? new Date(session.loginAt).toLocaleString('ar') : '—';
                                    const duration = session.loginAt ? Math.floor((Date.now() - new Date(session.loginAt).getTime()) / 60000) : 0;
                                    const durationDisplay = duration > 0 ? `${duration}m` : '—';
                                    return `
                                        <tr>
                                            <td>${name}</td>
                                            <td style="font-family:monospace;font-size:0.6rem;">${sessionId.substring(0, 12)}...</td>
                                            <td>${loginTime}</td>
                                            <td>${durationDisplay}</td>
                                            <td>${session.deviceType || '—'}</td>
                                            <td>${session.browser || '—'}</td>
                                            <td>${session.operatingSystem || '—'}</td>
                                            <td>${session.currentPage || '—'}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            // Update online counter badge
            document.getElementById('onlineCountBadge').textContent = onlineCount;
        }

        // ============================================================
        // USERS - FULL MANAGEMENT
        // ============================================================
        function renderUsers() {
            const content = document.getElementById('pageContent');

            let filtered = [...allUsers];

            if (usersSearch) {
                const s = usersSearch.toLowerCase();
                filtered = filtered.filter(u =>
                    (u.name || '').toLowerCase().includes(s) ||
                    (u.phone || '').includes(s) ||
                    (u.email || '').toLowerCase().includes(s) ||
                    (u.code || '').toLowerCase().includes(s) ||
                    (u.id || '').toLowerCase().includes(s)
                );
            }

            if (usersFilter === 'banned') filtered = filtered.filter(u => u.banned);
            else if (usersFilter === 'active') filtered = filtered.filter(u => !u.banned && !u.frozen);
            else if (usersFilter === 'frozen') filtered = filtered.filter(u => u.frozen);
            else if (usersFilter === 'subscribed') {
                const subUserIds = allSubscriptions.filter(s => s.status === 'active').map(s => s.userId);
                filtered = filtered.filter(u => subUserIds.includes(u.id));
            } else if (usersFilter === 'male') filtered = filtered.filter(u => u.gender === 'ذكر');
            else if (usersFilter === 'female') filtered = filtered.filter(u => u.gender === 'أنثى');
            else if (usersFilter === 'online') {
                const onlineIds = Object.values(onlineSessions).map(s => s.uid);
                filtered = filtered.filter(u => onlineIds.includes(u.id));
            }

            if (usersSort === 'newest') filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            else if (usersSort === 'oldest') filtered.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
            else if (usersSort === 'name') filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            else if (usersSort === 'most_atoms') filtered.sort((a, b) => (b.atoms || 0) - (a.atoms || 0));
            else if (usersSort === 'most_active') filtered.sort((a, b) => (b.lastLogin || 0) - (a.lastLogin || 0));

            const totalPages = Math.ceil(filtered.length / USERS_PAGE_SIZE);
            const start = (usersPage - 1) * USERS_PAGE_SIZE;
            const pageItems = filtered.slice(start, start + USERS_PAGE_SIZE);

            content.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h4>👥 إدارة الطلاب (${filtered.length})</h4>
                        <div class="actions">
                            <button class="btn-sm primary" onclick="exportUsersCSV()">📥 تصدير CSV</button>
                        </div>
                    </div>

                    <div class="search-bar">
                        <input type="text" placeholder="🔍 بحث بالاسم أو الرقم أو البريد أو الكود..." value="${usersSearch}" oninput="usersSearch=this.value;usersPage=1;renderUsers();" style="flex:1;min-width:150px;">
                        <select onchange="usersFilter=this.value;usersPage=1;renderUsers();">
                            <option value="all" ${usersFilter==='all'?'selected':''}>كل الطلاب</option>
                            <option value="active" ${usersFilter==='active'?'selected':''}>نشطون</option>
                            <option value="online" ${usersFilter==='online'?'selected':''}>🟢 متصلون</option>
                            <option value="banned" ${usersFilter==='banned'?'selected':''}>محظورون</option>
                            <option value="frozen" ${usersFilter==='frozen'?'selected':''}>مجمدون</option>
                            <option value="subscribed" ${usersFilter==='subscribed'?'selected':''}>لديهم اشتراك</option>
                            <option value="male" ${usersFilter==='male'?'selected':''}>ذكور</option>
                            <option value="female" ${usersFilter==='female'?'selected':''}>إناث</option>
                        </select>
                        <select onchange="usersSort=this.value;renderUsers();">
                            <option value="newest" ${usersSort==='newest'?'selected':''}>الأحدث</option>
                            <option value="oldest" ${usersSort==='oldest'?'selected':''}>الأقدم</option>
                            <option value="name" ${usersSort==='name'?'selected':''}>الاسم</option>
                            <option value="most_atoms" ${usersSort==='most_atoms'?'selected':''}>الأكثر نقاط</option>
                            <option value="most_active" ${usersSort==='most_active'?'selected':''}>الأكثر نشاط</option>
                        </select>
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>الطالب</th>
                                    <th>الهاتف</th>
                                    <th>الصف</th>
                                    <th>النقاط</th>
                                    <th>الاشتراك</th>
                                    <th>الحالة</th>
                                    <th>إجراءات</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${pageItems.length === 0 ? `
                                    <tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:1.5rem;">لا يوجد طلاب</td></tr>
                                ` : pageItems.map(u => {
                                    const isOnline = Object.values(onlineSessions).some(s => s.uid === u.id);
                                    const userSubs = allSubscriptions.filter(s => s.userId === u.id && s.status === 'active');
                                    const subTypes = userSubs.map(s => s.type === 'free' || s.type === 'free_subscription' ? 'مجاني' : 'مدفوع');
                                    const subDisplay = userSubs.length > 0 ? (subTypes.includes('مدفوع') ? '💳 مدفوع' : '🆓 مجاني') : '—';
                                    const genderIcon = u.gender === 'ذكر' ? '👨' : u.gender === 'أنثى' ? '👩' : '👤';
                                    const onlineStatus = isOnline ? '<span class="status-badge online">🟢 متصل</span>' : '<span class="status-badge offline">⚫ غير متصل</span>';
                                    return `
                                    <tr>
                                        <td>
                                            <div style="display:flex;align-items:center;gap:0.5rem;">
                                                <span class="avatar-sm">${u.photoURL ? `<img src="${u.photoURL}">` : (u.name ? u.name[0] : 'U')}</span>
                                                <div>
                                                    <div style="font-weight:600;">${u.name}</div>
                                                    <div style="font-size:0.6rem;color:var(--text-muted);">${u.code || ''}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td>${u.phone || '—'}</td>
                                        <td>${u.grade || '—'}</td>
                                        <td><strong style="color:var(--primary);">${u.atoms||0}</strong></td>
                                        <td>${subDisplay}</td>
                                        <td>
                                            ${onlineStatus}
                                            <span class="status-badge ${u.banned ? 'banned' : u.frozen ? 'pending' : 'active'}">
                                                ${u.banned ? 'محظور' : u.frozen ? 'مجمد' : 'نشط'}
                                            </span>
                                        </td>
                                        <td>
                                            <button class="btn-sm primary icon-only" onclick="viewUser('${u.id}')" title="عرض"><i class="fas fa-eye"></i></button>
                                            <button class="btn-sm ${u.banned ? 'success' : 'danger'} icon-only" onclick="toggleBan('${u.id}')" title="${u.banned ? 'فك الحظر' : 'حظر'}">
                                                <i class="fas ${u.banned ? 'fa-unlock' : 'fa-ban'}"></i>
                                            </button>
                                            <button class="btn-sm warning icon-only" onclick="addPointsModal('${u.id}')" title="إضافة نقاط"><i class="fas fa-plus"></i></button>
                                            <button class="btn-sm danger icon-only" onclick="deleteUser('${u.id}')" title="حذف نهائي"><i class="fas fa-user-minus"></i></button>
                                        </td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination">
                        <button onclick="usersPage=1;renderUsers();" ${usersPage===1?'disabled':''}>⏮</button>
                        <button onclick="usersPage=Math.max(1,usersPage-1);renderUsers();" ${usersPage===1?'disabled':''}>◀</button>
                        <span style="color:var(--text-muted);font-size:0.8rem;">${usersPage} / ${totalPages || 1}</span>
                        <button onclick="usersPage=Math.min(${totalPages},usersPage+1);renderUsers();" ${usersPage>=totalPages?'disabled':''}>▶</button>
                        <button onclick="usersPage=${totalPages};renderUsers();" ${usersPage>=totalPages?'disabled':''}>⏭</button>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // USER ACTIONS
        // ============================================================
        function toggleBan(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }
            const newStatus = !user.banned;
            const action = newStatus ? 'حظر' : 'فك الحظر';
            if (newStatus && !confirm(`⚠️ هل أنت متأكد من حظر الطالب "${user.name}"؟`)) return;

            db.ref('users/' + userId + '/banned').set(newStatus);
            db.ref('users/' + userId + '/isBanned').set(newStatus);
            db.ref('adminLogs').push({
                action: newStatus ? 'ban_user' : 'unban_user',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                timestamp: new Date().toISOString(),
                details: `${action} الطالب ${user.name}`
            });
            showToast(`✅ تم ${action} الطالب`, 'success');
        }

        function addPointsModal(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const html = `
                <div class="form-group">
                    <label>الطالب</label>
                    <input type="text" value="${user.name}" disabled style="opacity:0.6;">
                </div>
                <div class="form-group">
                    <label>النقاط الحالية</label>
                    <input type="text" value="${user.atoms || 0}" disabled style="opacity:0.6;">
                </div>
                <div class="form-group">
                    <label>عدد النقاط</label>
                    <input type="number" id="pointsAmount" value="10" min="1">
                </div>
                <div class="form-group">
                    <label>السبب</label>
                    <input type="text" id="pointsReason" placeholder="مثال: مكافأة على التفوق">
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button class="btn-submit" onclick="addPoints('${userId}')">⭐ إضافة</button>
                </div>
            `;
            openModal('⭐ إضافة نقاط', html);
        }

        function addPoints(userId) {
            const amount = parseInt(document.getElementById('pointsAmount').value) || 0;
            const reason = document.getElementById('pointsReason').value || 'بدون سبب';
            if (amount <= 0) { showToast('يجب إدخال عدد نقاط صحيح', 'error'); return; }

            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            db.ref('users/' + userId + '/atoms').transaction(current => (current || 0) + amount);
            db.ref('adminLogs').push({
                action: 'add_points',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                amount: amount,
                reason: reason,
                timestamp: new Date().toISOString(),
                details: `إضافة ${amount} نقطة للطالب ${user.name} (${reason})`
            });
            showToast(`✅ تم إضافة ${amount} نقطة`, 'success');
            closeModal();
        }

        function viewUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const subs = allSubscriptions.filter(s => s.userId === userId && s.status === 'active');
            const userLessons = Object.keys(user.progress || {}).filter(k => user.progress[k] && user.progress[k].watched);
            const userExams = Object.keys(user.progress || {}).filter(k => user.progress[k] && user.progress[k].type ===
                'exam' && user.progress[k].completed);
            const userQuizzes = Object.keys(user.progress || {}).filter(k => user.progress[k] && user.progress[k].type ===
                'quiz' && user.progress[k].completed);
            const isOnline = Object.values(onlineSessions).some(s => s.uid === userId);

            // Get user sessions
            const userSessions = Object.entries(onlineSessions).filter(([id, s]) => s.uid === userId);

            let html = `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1rem;">
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">الاسم</label><div style="font-weight:700;font-size:1rem;">${user.name}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">UID</label><div style="font-family:monospace;font-size:0.75rem;color:var(--text-muted);">${user.id}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">رقم الهاتف</label><div>${user.phone || '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">البريد</label><div>${user.email || '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">النوع</label><div>${user.gender || '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">الصف</label><div>${user.grade || '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">الشعبة</label><div>${user.section || '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">النقاط</label><div style="font-weight:700;color:var(--primary);font-size:1.2rem;">${user.atoms||0}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">الترتيب</label><div>${user.rank || '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">كود الطالب</label><div style="font-weight:700;color:var(--primary);">${user.code || '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">مصدر المعرفة</label><div>${user.howFound || '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">نوع التعليم</label><div>${user.studyType || '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">تاريخ التسجيل</label><div>${user.createdAt ? new Date(user.createdAt).toLocaleDateString('ar') : '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">آخر ظهور</label><div>${user.lastLogin ? new Date(user.lastLogin).toLocaleString('ar') : '—'}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">الحالة</label><div>
                        ${isOnline ? '<span class="status-badge online">🟢 متصل</span>' : '<span class="status-badge offline">⚫ غير متصل</span>'}
                        <span class="status-badge ${user.banned ? 'banned' : user.frozen ? 'pending' : 'active'}">
                            ${user.banned ? 'محظور' : user.frozen ? 'مجمد' : 'نشط'}
                        </span>
                    </div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">الجلسات النشطة</label><div>${userSessions.length}</div></div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0.5rem;margin-bottom:1rem;background:var(--bg-input);padding:0.8rem;border-radius:var(--radius-sm);">
                    <div style="text-align:center;"><div style="font-weight:700;color:var(--primary);">${userLessons.length}</div><div style="font-size:0.7rem;color:var(--text-muted);">حصص مكتملة</div></div>
                    <div style="text-align:center;"><div style="font-weight:700;color:var(--warning);">${userExams.length}</div><div style="font-size:0.7rem;color:var(--text-muted);">امتحانات</div></div>
                    <div style="text-align:center;"><div style="font-weight:700;color:var(--success);">${userQuizzes.length}</div><div style="font-size:0.7rem;color:var(--text-muted);">كويزات</div></div>
                    <div style="text-align:center;"><div style="font-weight:700;color:var(--info);">${subs.length}</div><div style="font-size:0.7rem;color:var(--text-muted);">اشتراكات</div></div>
                </div>

                <div style="margin-bottom:0.8rem;">
                    <label style="font-size:0.7rem;color:var(--text-muted);">📚 الكورسات المشترك فيها (${subs.length})</label>
                    <div style="display:flex;flex-wrap:wrap;gap:0.3rem;margin-top:0.2rem;">
                        ${subs.length > 0 ? subs.map(s => {
                            const course = allCourses.find(c => c.id === s.courseId);
                            const isFree = s.type === 'free' || s.type === 'free_subscription' || course?.isFree === true;
                            return `<span style="background:var(--bg-input);padding:0.15rem 0.6rem;border-radius:50px;font-size:0.7rem;border:1px solid ${isFree ? 'var(--success)' : 'var(--primary)'};color:${isFree ? 'var(--success)' : 'var(--primary)'};">${course ? course.title : s.courseId} ${isFree ? '🆓' : '💳'}</span>`;
                        }).join('') : '<span style="color:var(--text-muted);font-size:0.8rem;">لا يوجد اشتراكات</span>'}
                    </div>
                </div>

                ${userSessions.length > 0 ? `
                <div style="margin-bottom:0.8rem;">
                    <label style="font-size:0.7rem;color:var(--text-muted);">🟢 الجلسات النشطة (${userSessions.length})</label>
                    ${userSessions.map(([id, s]) => {
                        const duration = s.loginAt ? Math.floor((Date.now() - new Date(s.loginAt).getTime()) / 60000) : 0;
                        return `
                            <div style="background:var(--bg-input);padding:0.3rem 0.8rem;border-radius:var(--radius-sm);margin-top:0.2rem;border:1px solid var(--success);font-size:0.7rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;">
                                <span>🕐 ${s.loginAt ? new Date(s.loginAt).toLocaleTimeString('ar') : '—'}</span>
                                <span>⏱ ${duration}m</span>
                                <span>${s.deviceType || '—'} • ${s.browser || '—'}</span>
                                <span>📄 ${s.currentPage || '—'}</span>
                            </div>
                        `;
                    }).join('')}
                </div>

                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                    <button class="btn-sm ${user.banned ? 'success' : 'danger'}" onclick="toggleBan('${user.id}');closeModal();">${user.banned ? '✅ فك الحظر' : '🚫 حظر'}</button>
                    <button class="btn-sm warning" onclick="addPointsModal('${user.id}');closeModal();">⭐ إضافة نقاط</button>

        function deleteUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }
            if (!confirm(`⚠️ هل أنت متأكد من حذف الطالب "${user.name}" نهائياً؟`)) return;
            if (!confirm(`⚠️ تأكيد نهائي: اكتب "حذف" للمتابعة`)) return;

            showToast('⏳ جاري الحذف...', 'info');
            const promises = [
                db.ref('users/' + userId).remove(),
                db.ref('users/' + userId + '/progress').remove(),
                db.ref('users/' + userId + '/results').remove(),
                db.ref('users/' + userId + '/errorBank').remove(),
                db.ref('users/' + userId + '/notifications').remove(),
                db.ref('users/' + userId + '/submissions').remove(),
                db.ref('users/' + userId + '/attempts').remove()
            ];

            // Remove from onlineSessions
            Object.keys(onlineSessions).forEach(sessionId => {
                if (onlineSessions[sessionId].uid === userId) {
                    promises.push(db.ref('onlineSessions/' + sessionId).remove());
                }
            });

            const userSubs = allSubscriptions.filter(s => s.userId === userId);
            userSubs.forEach(s => {
                if (s.id) promises.push(db.ref('subscriptions/' + s.id).remove());
                if (s.courseId) {
                    promises.push(db.ref('courses/' + s.courseId + '/subscribers/' + userId).remove());
                    promises.push(db.ref('users/' + userId + '/premiumCourses/' + s.courseId).remove());
                }
            });

            promises.push(db.ref('adminLogs').push({
                action: 'delete_user',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                timestamp: new Date().toISOString(),
                details: `حذف الطالب "${user.name}" نهائياً`
            }));

            Promise.all(promises).then(() => {
                showToast(`✅ تم حذف الطالب "${user.name}"`, 'success');
            }).catch(() => { showToast('❌ حدث خطأ أثناء الحذف', 'error'); });
        }

        function exportUsersCSV() {
            if (allUsers.length === 0) { showToast('لا يوجد طلاب للتصدير', 'warning'); return; }
            let csv =
                'الاسم,الهاتف,البريد,الكود,النقاط,الحالة,الصف,الشعبة,النوع,مصدر المعرفة,نوع التعليم,تاريخ التسجيل,آخر ظهور\n';
            allUsers.forEach(u => {
                csv +=
                    `${u.name},${u.phone||''},${u.email||''},${u.code||''},${u.atoms||0},${u.banned?'محظور':'نشط'},${u.grade||''},${u.section||''},${u.gender||''},${u.howFound||''},${u.studyType||''},${u.createdAt?new Date(u.createdAt).toLocaleDateString('ar'):''},${u.lastLogin?new Date(u.lastLogin).toLocaleDateString('ar'):''}\n`;
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });

            link.download = `طلاب_يلا_كيمياء_${new Date().toISOString().slice(0,10)}.csv`;

        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 11; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return 'CH' + code;
        }

        function saveCode() {
            let code = document.getElementById('codeInput').value.trim().toUpperCase();
            const courseId = document.getElementById('codeCourse').value;

            if (!courseId) { showToast('يرجى اختيار الكورس', 'error'); return; }
            if (!code) code = generateRandomCode();

            if (allActivationCodes.some(c => c.code === code)) {
                showToast('⚠️ هذا الكود موجود بالفعل', 'error');
                return;
            }

            const course = allCourses.find(c => c.id === courseId);
            if (!course) { showToast('الكورس غير موجود', 'error'); return; }

            db.ref('activationCodes').push({
                code: code,
                courseId: courseId,
                courseName: course.title,
                status: 'available',
                used: false,
                usedBy: null,
                usedByName: null,
                usedAt: null,
                createdAt: new Date().toISOString(),
                createdBy: currentUser.uid,
                createdByName: currentAdmin?.name || 'Admin'
            }).then(() => {
                db.ref('adminLogs').push({
                    action: 'create_activation_code',

                    courseId: courseId,
                    courseName: course.title,
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',

                    details: `إنشاء كود تفعيل "${code}" لكورس "${course.title}"`

                closeModal();
            });
