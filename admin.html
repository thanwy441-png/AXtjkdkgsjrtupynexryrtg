                                        <td>
                                            ${c.status === 'available' ? `<button class="btn-sm warning icon-only" onclick="disableCode('${c.id}','${c.code}')" title="تعطيل"><i class="fas fa-pause"></i></button>` : ''}
                                            ${c.status === 'disabled' ? `<button class="btn-sm success icon-only" onclick="enableCode('${c.id}','${c.code}')" title="تفعيل"><i class="fas fa-play"></i></button>` : ''}
                                            ${c.status === 'available' || c.status === 'disabled' ? `<button class="btn-sm danger icon-only" onclick="deleteCode('${c.id}','${c.code}')" title="حذف"><i class="fas fa-trash"></i></button>` : ''}
                                        </td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 11; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return 'CH' + code;
        }

        function showAddCodeModal() {
            const courseOptions = allCourses.map(c =>
                `<option value="${c.id}">${c.title}</option>`
            ).join('');

            const html = `
                <div class="form-group">
                    <label>الكود (اتركه فارغاً للتوليد التلقائي)</label>
                    <div style="display:flex;gap:0.5rem;">
                        <input type="text" id="codeInput" placeholder="CHEM7X29AB" style="font-family:monospace;text-transform:uppercase;direction:ltr;text-align:left;flex:1;">
                        <button class="btn-sm outline" onclick="document.getElementById('codeInput').value=generateRandomCode();" style="white-space:nowrap;">🎲 توليد</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>الكورس *</label>
                    <select id="codeCourse">${courseOptions}</select>
                </div>
                <div class="form-group">
                    <label>حالة الكود</label>
                    <select id="codeStatus">
                        <option value="available">🟢 متاح</option>
                        <option value="disabled">🟠 معطل</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button class="btn-submit" onclick="saveCode()">💾 حفظ</button>
                </div>
            `;
            openModal('🔐 إنشاء كود تفعيل', html);
        }

        function saveCode() {
            let code = document.getElementById('codeInput').value.trim().toUpperCase();
            const courseId = document.getElementById('codeCourse').value;
            const status = document.getElementById('codeStatus').value;

            if (!courseId) { showToast('يرجى اختيار الكورس', 'error'); return; }
            if (!code) code = generateRandomCode();

            if (allActivationCodes.some(c => c.code === code)) {
                showToast('⚠️ هذا الكود موجود بالفعل', 'error');
                return;
            }

            const course = allCourses.find(c => c.id === courseId);
            if (!course) { showToast('الكورس غير موجود', 'error'); return; }

            db.ref('activationCodes').push({
                code: code,
                courseId: courseId,
                courseName: course.title,
                status: status,
                used: false,
                usedBy: null,
                usedByName: null,
                usedAt: null,
                createdAt: new Date().toISOString(),
                createdBy: currentUser.uid,
                createdByName: currentAdmin?.name || 'Admin'
            }).then(() => {
                db.ref('adminLogs').push({
                    action: 'create_activation_code',
                    code: code,
                    courseId: courseId,
                    courseName: course.title,
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    timestamp: new Date().toISOString(),
                    details: `إنشاء كود تفعيل "${code}" لكورس "${course.title}"`
                });
                showToast(`✅ تم إنشاء الكود: ${code}`, 'success');
                closeModal();
                loadActivationCodes();
            });
        }

        function disableCode(codeId, code) {
            if (!confirm(`⚠️ هل أنت متأكد من تعطيل الكود "${code}"؟`)) return;
            db.ref('activationCodes/' + codeId).update({ status: 'disabled' }).then(() => {
                showToast(`✅ تم تعطيل الكود ${code}`, 'success');
                loadActivationCodes();
            });
        }

        function enableCode(codeId, code) {
            if (!confirm(`⚠️ هل أنت متأكد من تفعيل الكود "${code}"؟`)) return;
            db.ref('activationCodes/' + codeId).update({ status: 'available' }).then(() => {
                showToast(`✅ تم تفعيل الكود ${code}`, 'success');
                loadActivationCodes();
            });
        }

        function deleteCode(codeId, code) {
            if (!confirm(`⚠️ هل أنت متأكد من حذف الكود "${code}"؟`)) return;
            db.ref('activationCodes/' + codeId).remove().then(() => {
                showToast(`✅ تم حذف الكود ${code}`, 'success');
                loadActivationCodes();
            });
        }

        function loadActivationCodes() {
            db.ref('activationCodes').once('value').then(snap => {
                allActivationCodes = [];
                snap.forEach(child => {
                    allActivationCodes.push({
                        id: child.key,
                        ...child.val()
                    });
                });
                document.getElementById('codesCountBadge').textContent = allActivationCodes.length;
                if (currentPage === 'codes') renderActivationCodes();
            });
        }

            loadAdminsList();
        }

        function loadAdminsList() {
            db.ref('admins').once('value').then(snap => {
                const container = document.getElementById('adminsList');
                if (!container) return;
                const admins = [];
                snap.forEach(child => {
                    if (child.val() === true) admins.push(child.key);
                });
                if (admins.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;">لا يوجد مسؤولين</p>';
                    return;
                }
                container.innerHTML = admins.map(uid =>
                    `<div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-card);padding:0.3rem 0.8rem;border-radius:var(--radius-sm);margin-bottom:0.2rem;border:1px solid var(--border-color);">
                        <span style="font-size:0.8rem;font-family:monospace;">${uid}</span>
                        ${uid !== currentUser.uid ? `<button class="btn-sm danger icon-only" onclick="removeAdmin('${uid}')" title="إزالة"><i class="fas fa-times"></i></button>` : '<span style="font-size:0.7rem;color:var(--text-muted);">(أنت)</span>'}
                    </div>`
                ).join('');
            });
        }

        function addAdmin() {
            const uid = document.getElementById('adminUidInput').value.trim();
            if (!uid) { showToast('يرجى إدخال UID المستخدم', 'error'); return; }
            db.ref('admins/' + uid).set(true).then(() => {
                showToast('✅ تم إضافة المسؤول', 'success');
                document.getElementById('adminUidInput').value = '';
                loadAdminsList();
            });
        }

        function removeAdmin(uid) {
            if (!confirm(`⚠️ هل أنت متأكد من إزالة هذا المسؤول؟`)) return;
            db.ref('admins/' + uid).remove().then(() => {
                showToast('✅ تم إزالة المسؤول', 'success');
                loadAdminsList();
            });
        }

        function clearAllData() {
            if (!confirm('⚠️ ⚠️ ⚠️ تحذير شديد! هذا الإجراء سيمسح جميع بيانات المنصة. هل أنت متأكد تماماً؟')) return;
            if (!confirm('⚠️ تأكيد نهائي: اكتب "نعم" للمتابعة')) return;

            showToast('⏳ جاري مسح البيانات...', 'info');
            Promise.all([
                db.ref('users').remove(),
                db.ref('courses').remove(),
                db.ref('lessons').remove(),
                db.ref('exams').remove(),
                db.ref('questions').remove(),
                db.ref('quizzes').remove(),
                db.ref('assignments').remove(),
                db.ref('subscriptions').remove(),
                db.ref('online').remove(),
                db.ref('activationCodes').remove(),
                db.ref('adminLogs').remove()
            ]).then(() => {
                showToast('✅ تم مسح جميع البيانات', 'success');
                loadAllData();
            });
        }

        function resetAtoms() {
            if (!confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع النقاط إلى 0؟')) return;
            const updates = {};
            allUsers.forEach(u => {
                updates['users/' + u.id + '/atoms'] = 0;
            });
            db.ref().update(updates).then(() => {
                showToast('✅ تم إعادة تعيين النقاط', 'success');
                loadAllUsers();
            });
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {});

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        console.log('🚀 Admin Panel v7.0 - يلا كيمياء');
        console.log('👥 Total users:', allUsers.length);
        console.log('📚 Total courses:', allCourses.length);
        console.log('🧪 Total quizzes:', allQuizzes.length);
        console.log('📝 Total exams:', allExams.length);
        console.log('✅ All features are REAL and working with Firebase');
    </script>

</body>
</html>
