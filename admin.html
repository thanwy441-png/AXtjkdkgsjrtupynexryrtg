<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - يلا كيمياء</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --bg-body: #f8f7fc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f5f3ff;
            --bg-input: #f8f7fc;
            --bg-hover: #f0edf7;
            --text-primary: #1a1025;
            --text-secondary: #6b5f7a;
            --text-muted: #9a8da8;
            --border-color: #e8e4f0;
            --shadow: 0 2px 12px rgba(106, 76, 147, 0.08);
            --shadow-hover: 0 6px 24px rgba(106, 76, 147, 0.12);
            --radius: 1rem;
            --radius-sm: 0.6rem;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 260px;
            --navbar-height: 64px;
            --primary: #7C3AED;
            --primary-light: #8B5CF6;
            --primary-dark: #6D28D9;
            --primary-bg: rgba(124, 58, 237, 0.08);
            --success: #10B981;
            --success-bg: rgba(16, 185, 129, 0.08);
            --danger: #EF4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --warning: #F59E0B;
            --warning-bg: rgba(245, 158, 11, 0.08);
            --info: #3B82F6;
            --info-bg: rgba(59, 130, 246, 0.08);
            --gradient-primary: linear-gradient(135deg, #7C3AED, #8B5CF6);
            --gradient-success: linear-gradient(135deg, #10B981, #34D399);
            --gradient-danger: linear-gradient(135deg, #EF4444, #F87171);
            --gradient-warning: linear-gradient(135deg, #F59E0B, #FBBF24);
        }

        [data-theme="dark"] {
            --bg-body: #0f0a1a;
            --bg-sidebar: #1a1128;
            --bg-card: #1f1635;
            --bg-card-hover: #2a1f42;
            --bg-input: #2a1f42;
            --bg-hover: #2a1f42;
            --text-primary: #f1edf7;
            --text-secondary: #b8adc9;
            --text-muted: #7a6d8d;
            --border-color: #2f2347;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 6px 24px rgba(0, 0, 0, 0.4);
            --primary-bg: rgba(124, 58, 237, 0.15);
            --success-bg: rgba(16, 185, 129, 0.15);
            --danger-bg: rgba(239, 68, 68, 0.15);
            --warning-bg: rgba(245, 158, 11, 0.15);
            --info-bg: rgba(59, 130, 246, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            transition: var(--transition);
            overflow-y: auto;
            padding: 0.5rem 0;
            box-shadow: var(--shadow);
        }

        .sidebar::-webkit-scrollbar {
            width: 3px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .sidebar .logo {
            padding: 0.8rem 1.2rem 1.2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0.5rem;
        }

        .sidebar .logo img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            margin-bottom: 0.3rem;
        }

        .sidebar .logo h2 {
            font-size: 1.1rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar .logo .sub {
            font-size: 0.65rem;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
        }

        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.6rem 1.2rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border-right: 3px solid transparent;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 0 8px 8px 0;
            margin: 0.1rem 0.5rem 0.1rem 0;
        }

        .sidebar .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar .nav-item.active {
            color: var(--primary);
            border-right-color: var(--primary);
            background: var(--primary-bg);
        }

        .sidebar .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .sidebar .nav-item .badge {
            margin-right: auto;
            padding: 0.05rem 0.5rem;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 700;
            background: var(--primary);
            color: #fff;
        }

        .sidebar .nav-divider {
            height: 1px;
            background: var(--border-color);
            margin: 0.3rem 1.2rem;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            margin-right: var(--sidebar-width);
            min-height: 100vh;
            padding: 0;
        }

        /* ============================================================
           ADMIN NAVBAR
           ============================================================ */
        .admin-navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0 1.5rem;
            height: var(--navbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 999;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
        }

        .admin-navbar .left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .admin-navbar .left .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .admin-navbar .left .menu-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .admin-navbar .left .page-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .admin-navbar .right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .admin-navbar .right .theme-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .admin-navbar .right .theme-toggle:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .admin-navbar .right .admin-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .admin-navbar .right .admin-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: #fff;
        }

        .admin-navbar .right .logout-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            padding: 0.3rem 0.8rem;
            border-radius: var(--radius-sm);
        }

        .admin-navbar .right .logout-btn:hover {
            color: var(--danger);
            background: var(--danger-bg);
        }

        /* ============================================================
           PAGE CONTENT
           ============================================================ */
        .page-content {
            padding: 1.5rem;
        }

        /* ============================================================
           STATS GRID
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1rem 1rem 0.8rem;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .stat-card .icon {
            font-size: 1.2rem;
            margin-bottom: 0.1rem;
        }

        .stat-card .number {
            font-size: 1.3rem;
            font-weight: 900;
            display: block;
            font-family: 'Tajawal', sans-serif;
        }

        .stat-card .number.primary {
            color: var(--primary);
        }
        .stat-card .number.success {
            color: var(--success);
        }
        .stat-card .number.warning {
            color: var(--warning);
        }
        .stat-card .number.danger {
            color: var(--danger);
        }
        .stat-card .number.info {
            color: var(--info);
        }

        .stat-card .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* ============================================================
           CHARTS
           ============================================================ */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1rem 1rem 1.2rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .chart-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .chart-card .chart-header {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
        }

        .chart-bar-container {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .chart-bar-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chart-bar-item .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            min-width: 70px;
            text-align: right;
        }

        .chart-bar-item .bar-track {
            flex: 1;
            height: 20px;
            background: var(--bg-body);
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
        }

        .chart-bar-item .bar-track .bar-fill {
            height: 100%;
            border-radius: var(--radius-sm);
            transition: width 1s ease;
            background: var(--primary);
        }

        .chart-bar-item .bar-track .bar-fill.success {
            background: var(--success);
        }
        .chart-bar-item .bar-track .bar-fill.warning {
            background: var(--warning);
        }
        .chart-bar-item .bar-track .bar-fill.danger {
            background: var(--danger);
        }
        .chart-bar-item .bar-track .bar-fill.info {
            background: var(--info);
        }

        .chart-bar-item .value {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-primary);
            min-width: 35px;
            text-align: left;
        }

        /* ============================================================
           CARDS
           ============================================================ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .card .card-header h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card .card-header .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 700px;
        }

        table thead th {
            padding: 0.5rem 0.8rem;
            text-align: right;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        table tbody td {
            padding: 0.5rem 0.8rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: middle;
        }

        table tbody tr:hover {
            background: var(--bg-hover);
        }

        .status-badge {
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-badge.active {
            background: var(--success-bg);
            color: var(--success);
        }
        .status-badge.banned {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .status-badge.pending {
            background: var(--warning-bg);
            color: var(--warning);
        }
        .status-badge.online {
            background: var(--success-bg);
            color: var(--success);
        }
        .status-badge.offline {
            background: var(--bg-hover);
            color: var(--text-muted);
        }
        .status-badge.available {
            background: var(--success-bg);
            color: var(--success);
        }
        .status-badge.used {
            background: var(--bg-hover);
            color: var(--text-muted);
        }
        .status-badge.disabled {
            background: var(--danger-bg);
            color: var(--danger);
        }
        .status-badge.expired {
            background: var(--warning-bg);
            color: var(--warning);
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-sm {
            padding: 0.25rem 0.8rem;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-sm.primary {
            background: var(--gradient-primary);
            color: #fff;
        }
        .btn-sm.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .btn-sm.success {
            background: var(--gradient-success);
            color: #fff;
        }
        .btn-sm.success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-sm.danger {
            background: var(--gradient-danger);
            color: #fff;
        }
        .btn-sm.danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-sm.warning {
            background: var(--gradient-warning);
            color: #fff;
        }
        .btn-sm.warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-sm.info {
            background: var(--info);
            color: #fff;
        }
        .btn-sm.info:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-sm.outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .btn-sm.outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg);
        }

        .btn-sm.icon-only {
            padding: 0.25rem 0.4rem;
            min-width: 28px;
            justify-content: center;
        }

        /* ============================================================
           SEARCH / FILTER
           ============================================================ */
        .search-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-bar input,
        .search-bar select {
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.8rem;
            outline: none;
            transition: var(--transition);
            min-height: 36px;
        }

        .search-bar input:focus,
        .search-bar select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-bar select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination {
            display: flex;
            gap: 0.3rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.75rem;
            min-width: 32px;
        }

        .pagination button:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg);
        }

        .pagination button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem 2rem 2rem;
            max-width: 850px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
            box-shadow: var(--shadow-hover);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-box .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-box .modal-header .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .modal-box .modal-header .close-btn:hover {
            color: var(--danger);
            background: var(--danger-bg);
        }

        .modal-box .form-group {
            margin-bottom: 0.8rem;
        }

        .modal-box .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 0.2rem;
        }

        .modal-box .form-group input,
        .modal-box .form-group select,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 0.5rem 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
        }

        .modal-box .form-group input:focus,
        .modal-box .form-group select:focus,
        .modal-box .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .modal-box .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-box .form-group .image-preview {
            margin-top: 0.3rem;
            max-width: 100%;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .modal-box .form-group .image-preview img {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .modal-box .form-group .image-preview .error {
            color: var(--danger);
            font-size: 0.8rem;
            padding: 0.5rem;
            background: var(--danger-bg);
            border-radius: var(--radius-sm);
        }

        .modal-box .form-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .modal-box .form-actions button {
            padding: 0.4rem 1.2rem;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
        }

        .modal-box .form-actions .btn-submit {
            background: var(--gradient-primary);
            color: #fff;
        }

        .modal-box .form-actions .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .modal-box .form-actions .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .modal-box .form-actions .btn-cancel:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: var(--danger-bg);
        }

        .modal-box .form-actions .btn-next {
            background: var(--info);
            color: #fff;
        }

        .modal-box .form-actions .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            width: 90%;
            max-width: 500px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 0.7rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            animation: slideUp 0.4s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 0.3rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .toast-success {
            background: var(--gradient-success);
            color: #fff;
        }
        .toast-error {
            background: var(--gradient-danger);
            color: #fff;
        }
        .toast-info {
            background: var(--gradient-primary);
            color: #fff;
        }
        .toast-warning {
            background: var(--gradient-warning);
            color: #fff;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .empty-state h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .empty-state p {
            font-size: 0.85rem;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-right: 0;
            }

            .admin-navbar .left .menu-toggle {
                display: block;
            }

            .admin-navbar .left .page-title {
                font-size: 0.85rem;
            }

            .page-content {
                padding: 1rem;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.5rem;
            }

            .stat-card .number {
                font-size: 1.1rem;
            }

            .modal-box {
                padding: 1rem 1.2rem;
            }

            .admin-navbar .right .admin-info .name {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .card .card-header {
                flex-direction: column;
                align-items: stretch;
            }

            .card .card-header .actions {
                justify-content: stretch;
            }

            .card .card-header .actions .btn-sm {
                flex: 1;
                justify-content: center;
            }
        }

        /* ============================================================
           UTILITY
           ============================================================ */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .mt-1 {
            margin-top: 0.5rem;
        }
        .mb-1 {
            margin-bottom: 0.5rem;
        }
        .flex {
            display: flex;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
        .gap-1 {
            gap: 0.5rem;
        }
        .gap-2 {
            gap: 1rem;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .w-full {
            width: 100%;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
        }

        .online-dot.offline {
            background: var(--text-muted);
            animation: none;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
        }

        .sidebar-overlay.open {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar-overlay.open {
                display: block;
            }
        }

        /* ============================================================
           QUESTION BLOCK STYLES
           ============================================================ */
        .question-block {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin-bottom: 1rem;
            transition: var(--transition);
        }

        .question-block:hover {
            border-color: var(--primary);
        }

        .question-block .question-number {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--bg-card);
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
        }

        .option-item label {
            font-weight: 700;
            color: var(--text-secondary);
            min-width: 18px;
            font-size: 0.8rem;
        }

        .option-item input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 0.2rem;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.85rem;
            min-width: 50px;
        }

        .option-item input[type="text"]:focus {
            outline: none;
            border-bottom: 1px solid var(--primary);
        }

        .option-item .correct-radio {
            margin: 0 0.2rem;
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .option-item .correct-label {
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        .question-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .question-actions .btn-sm {
            font-size: 0.65rem;
        }

        .question-remove-btn {
            color: var(--danger);
            background: var(--danger-bg);
            border: 1px solid var(--danger);
        }

        .question-remove-btn:hover {
            background: var(--danger);
            color: #fff;
        }

        .add-question-btn {
            margin-top: 0.5rem;
            width: 100%;
            justify-content: center;
            padding: 0.5rem;
            border: 2px dashed var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .add-question-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg);
        }
    </style>
</head>
<body>

    <!-- ===== FIREBASE ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBOBu3wp3GcA-VjwtqIt1PAYYpo_HXFhtU",
            authDomain: "yalla-kimya.firebaseapp.com",
            databaseURL: "https://yalla-kimya-default-rtdb.firebaseio.com",
            projectId: "yalla-kimya",
            storageBucket: "yalla-kimya.firebasestorage.app",
            messagingSenderId: "1052374689829",
            appId: "1:1052374689829:web:fbb815ab42d753e63377cc",
            measurementId: "G-B3SJFF8R1R"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ============================================================
        // THEME
        // ============================================================
        function getTheme() {
            return localStorage.getItem('adminTheme') || 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('adminTheme', theme);
            const icon = document.querySelector('#themeToggle i');
            if (icon) {
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        function toggleTheme() {
            const current = getTheme();
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        }

        applyTheme(getTheme());

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let currentAdmin = null;
        let isAdmin = false;
        let allUsers = [];
        let allCourses = [];
        let allLessons = [];
        let allExams = [];
        let allQuizzes = [];
        let allAssignments = [];
        let allSubscriptions = [];
        let allLogs = [];
        let onlineUsers = [];
        let allActivationCodes = [];
        let allQuestions = [];
        let currentPage = 'dashboard';
        let isLoading = false;
        let usersPage = 1;
        const USERS_PAGE_SIZE = 20;
        let usersFilter = 'all';
        let usersSearch = '';
        let usersSort = 'newest';
        let codesPage = 1;
        const CODES_PAGE_SIZE = 20;
        let codesFilter = 'all';
        let codesSearch = '';
        let subscriptionsPage = 1;
        const SUBSCRIPTIONS_PAGE_SIZE = 20;
        let subscriptionsFilter = 'all';
        let subscriptionsSearch = '';
        let errorLogs = [];
        let questionCounter = 0;

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const el = document.createElement('div');
            el.className = 'toast toast-' + type;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 4000);
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(title, bodyHTML) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            document.getElementById('modalOverlay').classList.add('open');
            // Reinitialize question counter if this is a quiz/exam form
            if (title.includes('كويز') || title.includes('امتحان')) {
                questionCounter = document.querySelectorAll('.question-block').length || 0;
            }
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        // ============================================================
        // SIDEBAR
        // ============================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        // ============================================================
        // CHECK ADMIN
        // ============================================================
        async function checkAdmin(uid) {
            try {
                const snap1 = await db.ref('admins/' + uid).once('value');
                if (snap1.exists() && snap1.val() === true) return true;
                const snap2 = await db.ref('users/' + uid).once('value');
                if (snap2.exists()) {
                    const data = snap2.val();
                    if (data.isAdmin === true || data.role === 'admin' || data.role === true) return true;
                }
                return false;
            } catch (e) {
                console.error('Admin check error:', e);
                return false;
            }
        }

        // ============================================================
        // AUTH & ADMIN CHECK
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const isAdminUser = await checkAdmin(user.uid);
            if (!isAdminUser) {
                showToast('⛔ غير مصرح لك بالدخول إلى لوحة التحكم', 'error');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                return;
            }

            isAdmin = true;
            currentUser = user;
            document.getElementById('adminName').textContent = user.displayName || 'Admin';
            document.getElementById('adminAvatar').textContent = (user.displayName || 'A')[0];

            db.ref('users/' + user.uid).once('value').then(snap => {
                if (snap.exists()) {
                    currentAdmin = snap.val();
                    document.getElementById('adminName').textContent = currentAdmin.name || 'Admin';
                    document.getElementById('adminAvatar').textContent = (currentAdmin.name || 'A')[0];
                }
            });

            await loadAllData();
            loadPage('dashboard');
            showToast('👋 مرحباً بك في لوحة التحكم', 'info');
        });

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout() {
            auth.signOut().then(() => { window.location.href = 'login.html'; });
        }

        // ============================================================
        // LOAD DATA
        // ============================================================
        function loadAllUsers() {
            return new Promise((resolve) => {
                db.ref('users').once('value').then(snap => {
                    allUsers = [];
                    snap.forEach(child => {
                        const data = child.val();
                        if (data.isAdmin === true || data.role === 'admin') return;
                        allUsers.push({
                            id: child.key,
                            ...data,
                            atoms: data.atoms || 0,
                            name: data.name || 'مستخدم',
                            phone: data.phone || '',
                            email: data.email || '',
                            grade: data.grade || 'تالتة ثانوي',
                            section: data.section || '',
                            gender: data.gender || 'غير محدد',
                            createdAt: data.createdAt || Date.now(),
                            banned: data.banned === true || data.isBanned === true,
                            status: data.banned === true || data.isBanned === true ? 'banned' : 'active',
                            lastLogin: data.lastLogin || null,
                            rank: data.rank || '--',
                            progress: data.progress || {},
                            photoURL: data.photoURL || '',
                            code: data.code || '',
                            premiumCourses: data.premiumCourses || {},
                            errorBank: data.errorBank || [],
                            results: data.results || [],
                            subscriptions: data.subscriptions || {},
                            frozen: data.frozen || false
                        });
                    });
                    document.getElementById('usersCountBadge').textContent = allUsers.length;
                    resolve(allUsers);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllCourses() {
            return new Promise((resolve) => {
                db.ref('courses').once('value').then(snap => {
                    allCourses = [];
                    snap.forEach(child => {
                        const data = child.val();
                        allCourses.push({
                            id: child.key,
                            ...data,
                            isFree: data.isFree !== false,
                            subscribers: data.subscribers || {},
                            subscriberCount: data.subscribers ? Object.keys(data.subscribers).length : 0,
                            pageViews: data.pageViews || 0,
                            revenue: data.revenue || 0
                        });
                    });
                    resolve(allCourses);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllLessons() {
            return new Promise((resolve) => {
                db.ref('lessons').once('value').then(snap => {
                    allLessons = [];
                    snap.forEach(child => {
                        allLessons.push({ id: child.key, ...child.val() });
                    });
                    resolve(allLessons);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllExams() {
            return new Promise((resolve) => {
                db.ref('exams').once('value').then(snap => {
                    allExams = [];
                    snap.forEach(child => {
                        const data = child.val();
                        allExams.push({
                            id: child.key,
                            ...data,
                            questions: data.questions || [],
                            results: data.results || {}
                        });
                    });
                    resolve(allExams);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllQuizzes() {
            return new Promise((resolve) => {
                db.ref('quizzes').once('value').then(snap => {
                    allQuizzes = [];
                    snap.forEach(child => {
                        const data = child.val();
                        allQuizzes.push({
                            id: child.key,
                            ...data,
                            questions: data.questions || [],
                            results: data.results || {}
                        });
                    });
                    resolve(allQuizzes);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllAssignments() {
            return new Promise((resolve) => {
                db.ref('assignments').once('value').then(snap => {
                    allAssignments = [];
                    snap.forEach(child => {
                        allAssignments.push({ id: child.key, ...child.val() });
                    });
                    resolve(allAssignments);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllSubscriptions() {
            return new Promise((resolve) => {
                db.ref('subscriptions').once('value').then(snap => {
                    allSubscriptions = [];
                    snap.forEach(child => {
                        allSubscriptions.push({ id: child.key, ...child.val() });
                    });
                    resolve(allSubscriptions);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllLogs() {
            return new Promise((resolve) => {
                db.ref('adminLogs').orderByChild('timestamp').limitToLast(500).once('value').then(snap => {
                    allLogs = [];
                    snap.forEach(child => {
                        allLogs.push({ id: child.key, ...child.val() });
                    });
                    allLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    resolve(allLogs);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllData() {
            return Promise.all([
                loadAllUsers(),
                loadAllCourses(),
                loadAllLessons(),
                loadAllExams(),
                loadAllQuizzes(),
                loadAllAssignments(),
                loadAllSubscriptions(),
                loadAllLogs()
            ]);
        }

        // ============================================================
        // PAGE LOADER
        // ============================================================
        function loadPage(page) {
            if (isLoading) return;
            isLoading = true;

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');

            const titles = {
                dashboard: 'الرئيسية',
                users: 'الطلاب',
                courses: 'الكورسات',
                lessons: 'الحصص',
                exams: 'الامتحانات',
                quizzes: 'الكويزات',
                assignments: 'الواجبات',
                subscriptions: 'الاشتراكات',
                codes: 'أكواد التفعيل',
                settings: 'الإعدادات'
            };
            document.getElementById('pageTitle').textContent = titles[page] || page;
            currentPage = page;

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('open');
            }

            const content = document.getElementById('pageContent');
            content.innerHTML =
                '<div style="text-align:center;padding:2rem;"><div class="loading-spinner"></div><p style="margin-top:0.5rem;color:var(--text-muted);">جاري التحميل...</p></div>';

            switch (page) {
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'users':
                    renderUsers();
                    break;
                case 'courses':
                    renderCourses();
                    break;
                case 'lessons':
                    renderLessons();
                    break;
                case 'exams':
                    renderExams();
                    break;
                case 'quizzes':
                    renderQuizzes();
                    break;
                case 'assignments':
                    renderAssignments();
                    break;
                case 'subscriptions':
                    renderSubscriptions();
                    break;
                case 'codes':
                    renderActivationCodes();
                    break;
                case 'settings':
                    renderSettings();
                    break;
                default:
                    content.innerHTML =
                    '<div class="empty-state"><div class="icon">🚧</div><h4>صفحة قيد التطوير</h4></div>';
            }

            setTimeout(() => { isLoading = false; }, 300);
        }

                    (u.name || '').toLowerCase().includes(s) ||
                    (u.phone || '').includes(s) ||
                    (u.email || '').toLowerCase().includes(s) ||

            if (usersFilter === 'banned') filtered = filtered.filter(u => u.banned);

        // ============================================================
        // USER ACTIONS
        // ============================================================
        function toggleBan(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }
            const newStatus = !user.banned;
            const action = newStatus ? 'حظر' : 'فك الحظر';
            if (newStatus && !confirm(`⚠️ هل أنت متأكد من حظر الطالب "${user.name}"؟`)) return;

            db.ref('users/' + userId + '/banned').set(newStatus);
            db.ref('users/' + userId + '/isBanned').set(newStatus);
            db.ref('adminLogs').push({
                action: newStatus ? 'ban_user' : 'unban_user',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                timestamp: new Date().toISOString(),
                details: `${action} الطالب ${user.name}`
            });
            showToast(`✅ تم ${action} الطالب`, 'success');
            loadAllUsers().then(() => renderUsers());
        }

        function addPointsModal(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const html = `
                <div class="form-group">
                    <label>الطالب</label>
                    <input type="text" value="${user.name}" disabled style="opacity:0.6;">
                </div>
                <div class="form-group">
                    <label>النقاط الحالية</label>
                    <input type="text" value="${user.atoms || 0}" disabled style="opacity:0.6;">
                </div>
                <div class="form-group">
                    <label>عدد النقاط</label>
                    <input type="number" id="pointsAmount" value="10" min="1">
                </div>
                <div class="form-group">
                    <label>السبب</label>
                    <input type="text" id="pointsReason" placeholder="مثال: مكافأة على التفوق">
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button class="btn-submit" onclick="addPoints('${userId}')">⭐ إضافة</button>
                </div>
            `;
            openModal('⭐ إضافة نقاط', html);
        }

        function addPoints(userId) {
            const amount = parseInt(document.getElementById('pointsAmount').value) || 0;
            const reason = document.getElementById('pointsReason').value || 'بدون سبب';
            if (amount <= 0) { showToast('يجب إدخال عدد نقاط صحيح', 'error'); return; }

            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            db.ref('users/' + userId + '/atoms').transaction(current => (current || 0) + amount);
            db.ref('adminLogs').push({
                action: 'add_points',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                amount: amount,
                reason: reason,
                timestamp: new Date().toISOString(),
                details: `إضافة ${amount} نقطة للطالب ${user.name} (${reason})`
            });
            showToast(`✅ تم إضافة ${amount} نقطة`, 'success');
            closeModal();
            loadAllUsers().then(() => renderUsers());
        }

        function viewUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const subs = allSubscriptions.filter(s => s.userId === userId && s.status === 'active');

            let html = `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1rem;">
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">الاسم</label><div style="font-weight:700;">${user.name}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">النقاط</label><div style="font-weight:700;color:var(--primary);font-size:1.2rem;">${user.atoms||0}</div></div>
                    <div><label style="font-size:0.7rem;color:var(--text-muted);">الهاتف</label><div>${user.phone || '—'}</div></div>

        function deleteUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }
            if (!confirm(`⚠️ هل أنت متأكد من حذف الطالب "${user.name}" نهائياً؟`)) return;
            if (!confirm(`⚠️ تأكيد نهائي: اكتب "حذف" للمتابعة`)) return;

            showToast('⏳ جاري الحذف...', 'info');
            const promises = [
                db.ref('users/' + userId).remove(),
                db.ref('online/' + userId).remove(),
                db.ref('users/' + userId + '/progress').remove(),
                db.ref('users/' + userId + '/results').remove(),
                db.ref('users/' + userId + '/errorBank').remove(),
                db.ref('users/' + userId + '/notifications').remove(),
                db.ref('users/' + userId + '/submissions').remove(),
                db.ref('users/' + userId + '/attempts').remove()
            ];

            const userSubs = allSubscriptions.filter(s => s.userId === userId);
            userSubs.forEach(s => {
                if (s.id) promises.push(db.ref('subscriptions/' + s.id).remove());
                if (s.courseId) {
                    promises.push(db.ref('courses/' + s.courseId + '/subscribers/' + userId).remove());
                    promises.push(db.ref('users/' + userId + '/premiumCourses/' + s.courseId).remove());
                }
            });

            promises.push(db.ref('adminLogs').push({
                action: 'delete_user',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                timestamp: new Date().toISOString(),
                details: `حذف الطالب "${user.name}" نهائياً`
            }));

            Promise.all(promises).then(() => {
                showToast(`✅ تم حذف الطالب "${user.name}"`, 'success');
                loadAllUsers().then(() => renderUsers());
            }).catch(() => { showToast('❌ حدث خطأ أثناء الحذف', 'error'); });
        }

        function exportUsersCSV() {
            if (allUsers.length === 0) { showToast('لا يوجد طلاب للتصدير', 'warning'); return; }
            let csv = 'الاسم,الهاتف,البريد,الكود,النقاط,الحالة,الصف,الشعبة,النوع,تاريخ التسجيل\n';
            allUsers.forEach(u => {
                csv +=
                    `${u.name},${u.phone||''},${u.email||''},${u.code||''},${u.atoms||0},${u.banned?'محظور':'نشط'},${u.grade||''},${u.section||''},${u.gender||''},${u.createdAt?new Date(u.createdAt).toLocaleDateString('ar'):''}\n`;
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `طلاب_يلا_كيمياء_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            showToast('✅ تم تصدير البيانات', 'success');
        }

        function addUserSubscription(userId) {
            const courseId = document.getElementById('subCourseSelect').value;
            if (!courseId) { showToast('يرجى اختيار كورس', 'error'); return; }

            const user = allUsers.find(u => u.id === userId);
            const course = allCourses.find(c => c.id === courseId);
            if (!user || !course) { showToast('البيانات غير موجودة', 'error'); return; }

            db.ref('subscriptions').push({
                userId: userId,
                courseId: courseId,
                status: 'active',
                type: course.isFree ? 'free' : 'paid',
                method: 'manual',
                createdAt: new Date().toISOString(),
                activatedAt: new Date().toISOString(),
                activatedBy: currentUser.uid,
                activatedByName: currentAdmin?.name || 'Admin'
            }).then(() => {
                db.ref('users/' + userId + '/premiumCourses/' + courseId).set(true);
                db.ref('courses/' + courseId + '/subscribers/' + userId).set({
                    type: course.isFree ? 'free' : 'paid',
                    method: 'manual',
                    subscribedAt: new Date().toISOString()
                });
                db.ref('adminLogs').push({
                    action: 'add_subscription',
                    userId: userId,
                    userName: user.name,
                    courseId: courseId,
                    courseName: course.title,
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    timestamp: new Date().toISOString(),
                    details: `تفعيل اشتراك كورس "${course.title}" للطالب ${user.name}`
                });
                showToast(`✅ تم تفعيل الاشتراك في "${course.title}"`, 'success');
                closeModal();
                loadAllSubscriptions().then(() => loadAllUsers());
            });
        }

        function saveCourse(courseId) {
            const title = document.getElementById('courseTitle').value.trim();
            const description = document.getElementById('courseDesc').value.trim();
            const image = document.getElementById('courseImage').value.trim();
            const type = document.getElementById('courseType').value;
            const grade = document.getElementById('courseGrade').value;
            const section = document.getElementById('courseSection').value;

            if (!title) { showToast('يرجى إدخال اسم الكورس', 'error'); return; }

            const data = {
                title: title,
                description: description || '',
                image: image || '',
                isFree: type === 'مجاني',
                grade: grade,
                section: section,
                subscribers: {},
                pageViews: 0,
                revenue: 0,
                updatedAt: new Date().toISOString()
            };

            if (courseId) {
                db.ref('courses/' + courseId).update(data).then(() => {
                    showToast('✅ تم تحديث الكورس', 'success');
                    closeModal();
                    loadAllCourses().then(() => renderCourses());
                });
            } else {
                db.ref('courses').push(data).then(() => {
                    showToast('✅ تم إضافة الكورس', 'success');
                    closeModal();
                    loadAllCourses().then(() => renderCourses());
                });
            }
        }

            const courseLessons = allLessons.filter(l => l.courseId === courseId);
            courseLessons.forEach(l => db.ref('lessons/' + l.id).remove());
            db.ref('courses/' + courseId).remove().then(() => {
                showToast('✅ تم حذف الكورس', 'success');
                loadAllCourses().then(() => renderCourses());
                loadAllLessons();
            });
        }

        function getQuestionBlockHTML(question = null, index = 0) {
            const q = question || {};
            const options = q.options || ['', '', '', ''];
            const correct = q.correctAnswer || 0;

            return `
                <div class="question-block" data-index="${index}">
                    <div class="question-number">سؤال ${index + 1}</div>
                    <div class="form-group">
                        <label>نص السؤال</label>

                        <div class="image-preview q-image-preview" style="${q.image ? '' : 'display:none;'}">

                                <input type="text" class="q-option" placeholder="اختيار ${label}" value="${options[idx] || ''}">
                                <input type="radio" name="correct_${index}" value="${idx}" class="q-correct" ${correct === idx ? 'checked' : ''}>
                                <span class="correct-label">صح</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="question-actions">
                        <button class="btn-sm question-remove-btn" onclick="removeQuestionBlock(this)" ${index === 0 && document.querySelectorAll('.question-block').length === 1 ? 'style="display:none;"' : ''}>

                        </button>
                    </div>
                </div>

        function addQuestionBlock() {
            const container = document.getElementById('questionsContainer');
            if (!container) return;
            const index = document.querySelectorAll('.question-block').length;
            const newBlock = document.createElement('div');
            newBlock.innerHTML = getQuestionBlockHTML(null, index);
            container.appendChild(newBlock.firstElementChild);
            // Re-index radios
            reindexQuestions();

        function removeQuestionBlock(btn) {
            const block = btn.closest('.question-block');
            if (!block) return;
            if (document.querySelectorAll('.question-block').length <= 1) {

                return;
            }
            block.remove();
            reindexQuestions();
        }

        function reindexQuestions() {
            const blocks = document.querySelectorAll('.question-block');
            blocks.forEach((block, idx) => {
                block.dataset.index = idx;
                const numLabel = block.querySelector('.question-number');
                if (numLabel) numLabel.textContent = `سؤال ${idx + 1}`;
                const radios = block.querySelectorAll('.q-correct');
                radios.forEach(radio => {
                    radio.name = `correct_${idx}`;
                });
            });
        }

        function collectQuizQuestions() {
            const blocks = document.querySelectorAll('.question-block');
            const questions = [];

            blocks.forEach((block, idx) => {
                const text = block.querySelector('.q-text')?.value.trim() || '';
                const image = block.querySelector('.q-image')?.value.trim() || '';
                const options = [];
                const optionInputs = block.querySelectorAll('.q-option');
                optionInputs.forEach(inp => options.push(inp.value.trim() || `اختيار ${String.fromCharCode(65 + optionInputs.length)}`));

                const correctRadio = block.querySelector('.q-correct:checked');
                const correctAnswer = correctRadio ? parseInt(correctRadio.value) : 0;

                if (text && options.some(o => o)) {
                    questions.push({
                        id: 'q_' + Date.now() + '_' + idx,
                        question: text,
                        image: image || '',
                        options: options,
                        correctAnswer: Math.min(Math.max(correctAnswer, 0), 3)
                    });
                }
            });

            return questions;
        }

        function editAssignment(assignmentId) {
            const a = allAssignments.find(x => x.id === assignmentId);
            if (!a) return;

            const html = `

                    <label>عنوان الواجب *</label>

            openModal('✏️ تعديل واجب: ' + a.title, html);

        function saveAssignment(assignmentId) {
            const title = document.getElementById('assignmentTitle').value.trim();
            const description = document.getElementById('assignmentDesc').value.trim();
            const fileUrl = document.getElementById('assignmentFile').value.trim();

            if (!title) { showToast('يرجى إدخال عنوان الواجب', 'error'); return; }

            const data = {
                title: title,
                description: description || '',
                fileUrl: fileUrl || '',
                updatedAt: new Date().toISOString()
            };

            if (assignmentId) {
                db.ref('assignments/' + assignmentId).update(data).then(() => {
                    showToast('✅ تم تحديث الواجب', 'success');
                    closeModal();
                    loadAllAssignments().then(() => renderAssignments());
                });
            } else {
                db.ref('assignments').push(data).then((snap) => {
                    const newAssignmentId = snap.key;
                    showToast('✅ تم إضافة الواجب', 'success');
                    closeModal();
                    loadAllAssignments().then(() => renderAssignments());
                    setTimeout(() => {
                        showLinkToLessonModal(newAssignmentId, 'assignment');
                    }, 500);
                });
            }
        }

        function deleteAssignment(assignmentId) {
            if (!confirm('⚠️ هل أنت متأكد من حذف هذا الواجب؟')) return;
            db.ref('assignments/' + assignmentId).remove().then(() => {
                showToast('✅ تم حذف الواجب', 'success');
                loadAllAssignments().then(() => renderAssignments());
            });
        }

        function showLinkToLessonModal(itemId, type) {
            const typeLabels = {
                'quiz': 'كويز',
                'exam': 'امتحان',
                'assignment': 'واجب'
            };

            const lessonOptions = allLessons.map(l => {
                const course = allCourses.find(c => c.id === l.courseId);
                return `<option value="${l.id}">${l.title} (${course ? course.title : 'بدون كورس'})</option>`;
            }).join('');

            if (!lessonOptions) {
                showToast('⚠️ لا توجد حصص لربطها', 'warning');
                return;
            }

            const html = `
                <div style="margin-bottom:1rem;">
                    <p style="color:var(--text-muted);">تم إضافة ${typeLabels[type]} بنجاح. هل تريد ربطه بحصة؟</p>
                </div>
                <div class="form-group">
                    <label>اختر الحصة</label>

                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal();">تخطي</button>
                    <button class="btn-submit" onclick="linkToLesson('${itemId}','${type}')">🔗 ربط بالحصة</button>
                </div>
            `;
            openModal(`🔗 ربط ${typeLabels[type]} بحصة`, html);
        }

        function linkToLesson(itemId, type) {
            const lessonId = document.getElementById('linkLessonSelect').value;
            if (!lessonId) { showToast('يرجى اختيار حصة', 'error'); return; }

            const fieldMap = {
                'quiz': 'quizId',
                'exam': 'examId',
                'assignment': 'assignmentId'
            };

            const updates = {};
            updates['lessons/' + lessonId + '/' + fieldMap[type]] = itemId;
            updates['lessons/' + lessonId + '/has' + type.charAt(0).toUpperCase() + type.slice(1)] = true;

            db.ref().update(updates).then(() => {
                showToast('✅ تم الربط بنجاح', 'success');
                closeModal();
                loadAllLessons();
                if (type === 'quiz') loadAllQuizzes();
                else if (type === 'exam') loadAllExams();
                else if (type === 'assignment') loadAllAssignments();
            });
        }

        function saveSubscription() {
            const userId = document.getElementById('subUser').value;
            const courseId = document.getElementById('subCourse').value;
            const type = document.getElementById('subType').value;

            if (!userId || !courseId) { showToast('يرجى اختيار الطالب والكورس', 'error'); return; }

            const user = allUsers.find(u => u.id === userId);
            const course = allCourses.find(c => c.id === courseId);

            db.ref('subscriptions').push({
                userId: userId,
                courseId: courseId,
                status: 'active',
                type: type,
                method: 'manual',
                createdAt: new Date().toISOString(),
                activatedAt: new Date().toISOString(),
                activatedBy: currentUser.uid,
                activatedByName: currentAdmin?.name || 'Admin'
            }).then(() => {
                db.ref('courses/' + courseId + '/subscribers/' + userId).set({
                    type: type,
                    method: 'manual',
                    subscribedAt: new Date().toISOString()
                });
                db.ref('users/' + userId + '/premiumCourses/' + courseId).set(true);
                db.ref('adminLogs').push({
                    action: 'add_subscription',
                    userId: userId,
                    userName: user?.name || '—',
                    courseId: courseId,
                    courseName: course?.title || '—',
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    timestamp: new Date().toISOString(),
                    details: `تفعيل اشتراك كورس "${course?.title || '—'}" للطالب ${user?.name || '—'}`
                });
                showToast('✅ تم تفعيل الاشتراك', 'success');
                closeModal();
                loadAllSubscriptions().then(() => renderSubscriptions());
                loadAllCourses();
            });
        }

        function cancelSubscription(subId, userId, courseId) {
            if (!confirm('⚠️ هل أنت متأكد من إلغاء هذا الاشتراك؟')) return;

            const user = allUsers.find(u => u.id === userId);
            const course = allCourses.find(c => c.id === courseId);

            db.ref('subscriptions/' + subId).update({ status: 'cancelled', cancelledAt: new Date().toISOString() })
                .then(() => {
                    if (userId && courseId) {
                        db.ref('users/' + userId + '/premiumCourses/' + courseId).remove();
                        db.ref('courses/' + courseId + '/subscribers/' + userId).remove();
                    }
                    db.ref('adminLogs').push({
                        action: 'cancel_subscription',
                        userId: userId,
                        userName: user?.name || '—',
                        courseId: courseId,
                        courseName: course?.title || '—',
                        adminId: currentUser.uid,
                        adminName: currentAdmin?.name || 'Admin',
                        timestamp: new Date().toISOString(),
                        details: `إلغاء اشتراك كورس "${course?.title || '—'}" للطالب ${user?.name || '—'}`
                    });
                    showToast('✅ تم إلغاء الاشتراك', 'success');
                    loadAllSubscriptions().then(() => renderSubscriptions());
                    loadAllCourses();
                });
        }

            content.innerHTML = `

                            <thead>
                                <tr><th>الكود</th><th>الكورس</th><th>الحالة</th><th>المستخدم</th><th>إجراءات</th></tr>
                            </thead>
                            <tbody>
                                ${allActivationCodes.length === 0 ? `
                                    <tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:1.5rem;">لا توجد أكواد</td></tr>
                                ` : allActivationCodes.map(c => {
                                    const user = allUsers.find(u => u.id === c.usedBy);
                                    return `
                                    <tr>
                                        <td><strong style="font-family:monospace;font-size:0.85rem;color:var(--primary);">${c.code}</strong></td>
                                        <td>${c.courseName || '—'}</td>
                                        <td><span class="status-badge ${c.status}">${c.status === 'available' ? '🟢 متاح' : c.status === 'used' ? '🔴 مستخدم' : '🟠 معطل'}</span></td>
