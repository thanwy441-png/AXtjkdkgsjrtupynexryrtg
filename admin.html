        function loadAdminsList() {
            db.ref('admins').once('value').then(snap => {
                const container = document.getElementById('adminsList');
                if (!container) return;
                const admins = [];
                snap.forEach(child => {
                    if (child.val() === true) {
                        admins.push(child.key);
                    }
                });
                if (admins.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;">لا يوجد مسؤولين</p>';
                    return;
                }
                container.innerHTML = admins.map(uid =>

                        </div>`
                ).join('');
            });

        }

        function clearAllData() {
            if (!confirm('⚠️ ⚠️ ⚠️ تحذير شديد! هذا الإجراء سيمسح جميع بيانات المنصة. هل أنت متأكد تماماً؟')) return;
            if (!confirm('⚠️ تأكيد نهائي: اكتب "نعم" للمتابعة')) return;

            showToast('⏳ جاري مسح البيانات...', 'info');
            db.ref('users').remove().then(() => {
                db.ref('courses').remove();
                db.ref('lessons').remove();
                db.ref('exams').remove();
                db.ref('quizzes').remove();
                db.ref('assignments').remove();
                db.ref('subscriptions').remove();
                db.ref('subscriptionRequests').remove();
                db.ref('announcements').remove();
                db.ref('online').remove();
                showToast('✅ تم مسح جميع البيانات', 'success');
                loadAllData();
            });
        }

        function resetAtoms() {
            if (!confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع النقاط إلى 0؟')) return;

            const updates = {};
            allUsers.forEach(u => {
                updates['users/' + u.id + '/atoms'] = 0;
            });
            db.ref().update(updates).then(() => {
                showToast('✅ تم إعادة تعيين النقاط', 'success');
                loadAllUsers();
            });
        }

        // ============================================================
        // EXPORT USERS CSV
        // ============================================================
        function exportUsersCSV() {
            if (allUsers.length === 0) { showToast('لا يوجد طلاب للتصدير', 'warning'); return; }

            let csv =
                'الاسم,رقم الهاتف,ولي الأمر,البريد,الكود,النقاط,الترتيب,الحالة,تاريخ التسجيل,مصدر المعرفة,الصف,الشعبة,نوع التعليم,عدد مرات الدخول,آخر نشاط\n';
            allUsers.forEach(u => {
                csv +=
                    `${u.name},${u.phone||''},${u.parentPhone||''},${u.email||''},${u.code||''},${u.atoms||0},${u.rank||''},${u.banned?'محظور':'نشط'},${u.createdAt?new Date(u.createdAt).toLocaleDateString('ar'):''},${u.howFound||''},${u.grade||''},${u.section||''},${u.studyType||''},${u.loginCount||0},${u.lastLogin?new Date(u.lastLogin).toLocaleDateString('ar'):''}\n`;
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `طلاب_يلا_كيمياء_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            showToast('✅ تم تصدير البيانات', 'success');
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // أي تهيئة إضافية
        });

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        console.log('🚀 Admin Panel v3.0 - يلا كيمياء');
        console.log('📊 All systems ready');
        console.log('👥 Total users loaded:', allUsers.length);
        console.log('📚 Total courses loaded:', allCourses.length);
        console.log('👨‍💼 Admin UID:', currentUser?.uid);
    </script>

</body>
</html>
