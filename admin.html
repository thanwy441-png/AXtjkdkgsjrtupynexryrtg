<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>لوحة التحكم - يلا كيمياء</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --primary: #E52B9C;
            --primary-dark: #c91d84;
            --primary-light: #f05aaf;
            --deep-purple: #1F1235;
            --deep-purple-light: #2d1a4a;
            --bg-dark: #0d0a1a;
            --bg-card: #16102a;
            --bg-card-hover: #1f1640;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(255,255,255,0.06);
            --success: #22C55E;
            --danger: #EF4444;
            --warning: #F59E0B;
            --info: #3B82F6;
            --radius: 1rem;
            --radius-sm: 0.6rem;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 260px;
            --navbar-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, var(--deep-purple) 0%, var(--bg-dark) 100%);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            transition: var(--transition);
            overflow-y: auto;
            padding: 1rem 0;
        }

        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .sidebar .logo {
            padding: 0.8rem 1.5rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .sidebar .logo img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            margin-bottom: 0.3rem;
        }

        .sidebar .logo h2 {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar .logo .sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
        }

        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.7rem 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border-right: 3px solid transparent;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .sidebar .nav-item:hover {
            background: rgba(255,255,255,0.04);
            color: var(--text-light);
        }

        .sidebar .nav-item.active {
            color: var(--primary);
            border-right-color: var(--primary);
            background: rgba(229, 43, 156, 0.08);
        }

        .sidebar .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .sidebar .nav-item .badge {
            margin-right: auto;
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            background: var(--primary);
            color: #fff;
        }

        .sidebar .nav-divider {
            height: 1px;
            background: var(--border-color);
            margin: 0.5rem 1.5rem;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            margin-right: var(--sidebar-width);
            min-height: 100vh;
            padding: 0;
        }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .admin-navbar {
            background: rgba(22, 16, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 1.5rem;
            height: var(--navbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .admin-navbar .left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .admin-navbar .left .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
        }

        .admin-navbar .left h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .admin-navbar .right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .admin-navbar .right .admin-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .admin-navbar .right .admin-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: #fff;
        }

        .admin-navbar .right .logout-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            padding: 0.3rem 0.8rem;
            border-radius: var(--radius-sm);
        }

        .admin-navbar .right .logout-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        /* ============================================================
           PAGE CONTENT
           ============================================================ */
        .page-content {
            padding: 1.5rem;
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.2rem 1.2rem 1rem;
            transition: var(--transition);
        }

        .stat-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .stat-card .icon {
            font-size: 1.4rem;
            margin-bottom: 0.2rem;
        }

        .stat-card .number {
            font-size: 1.5rem;
            font-weight: 900;
            display: block;
            font-family: 'Tajawal', sans-serif;
        }

        .stat-card .number.primary { color: var(--primary); }
        .stat-card .number.success { color: var(--success); }
        .stat-card .number.warning { color: var(--warning); }
        .stat-card .number.danger { color: var(--danger); }
        .stat-card .number.info { color: var(--info); }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stat-card .change {
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 0.2rem;
        }

        .stat-card .change.up { color: var(--success); }
        .stat-card .change.down { color: var(--danger); }

        /* ============================================================
           CARDS / TABLES
           ============================================================ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .card .card-header h4 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .card .card-header .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 600px;
        }

        table thead th {
            padding: 0.6rem 0.8rem;
            text-align: right;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        table tbody td {
            padding: 0.6rem 0.8rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-light);
            vertical-align: middle;
        }

        table tbody tr:hover {
            background: rgba(255,255,255,0.02);
        }

        table tbody td .avatar-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.65rem;
            background: var(--primary);
            color: #fff;
            overflow: hidden;
        }

        table tbody td .avatar-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            padding: 0.15rem 0.7rem;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-badge.active { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .status-badge.banned { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .status-badge.pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .status-badge.online { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .status-badge.offline { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-sm {
            padding: 0.25rem 0.8rem;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-sm.primary { background: var(--primary); color: #fff; }
        .btn-sm.primary:hover { background: var(--primary-dark); transform: scale(1.02); }

        .btn-sm.success { background: var(--success); color: #fff; }
        .btn-sm.success:hover { background: #16A34A; transform: scale(1.02); }

        .btn-sm.danger { background: var(--danger); color: #fff; }
        .btn-sm.danger:hover { background: #DC2626; transform: scale(1.02); }

        .btn-sm.warning { background: var(--warning); color: #fff; }
        .btn-sm.warning:hover { background: #D97706; transform: scale(1.02); }

        .btn-sm.outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }
        .btn-sm.outline:hover { border-color: var(--primary); color: var(--primary); }

        .btn-sm.icon-only {
            padding: 0.25rem 0.4rem;
            min-width: 28px;
            justify-content: center;
        }

        /* ============================================================
           SEARCH / FILTER
           ============================================================ */
        .search-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-bar input,
        .search-bar select {
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-light);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.8rem;
            outline: none;
            transition: var(--transition);
            min-height: 36px;
        }

        .search-bar input:focus,
        .search-bar select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(229, 43, 156, 0.1);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-bar select option {
            background: var(--bg-dark);
            color: var(--text-light);
        }

        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination {
            display: flex;
            gap: 0.3rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.75rem;
            min-width: 32px;
        }

        .pagination button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem 2rem 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-box .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-box .modal-header .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .modal-box .modal-header .close-btn:hover {
            color: var(--danger);
            background: rgba(239,68,68,0.1);
        }

        .modal-box .form-group {
            margin-bottom: 0.8rem;
        }

        .modal-box .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .modal-box .form-group input,
        .modal-box .form-group select,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 0.5rem 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
        }

        .modal-box .form-group input:focus,
        .modal-box .form-group select:focus,
        .modal-box .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(229,43,156,0.1);
        }

        .modal-box .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-box .form-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: flex-end;
        }

        .modal-box .form-actions button {
            padding: 0.4rem 1.2rem;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
        }

        .modal-box .form-actions .btn-submit {
            background: var(--primary);
            color: #fff;
        }

        .modal-box .form-actions .btn-submit:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }

        .modal-box .form-actions .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .modal-box .form-actions .btn-cancel:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            width: 90%;
            max-width: 500px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 0.7rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            animation: slideUp 0.4s ease;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 0.3rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .toast-success { background: var(--success); color: #fff; }
        .toast-error { background: var(--danger); color: #fff; }
        .toast-info { background: var(--primary); color: #fff; }
        .toast-warning { background: var(--warning); color: #fff; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(100%);
                width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-right: 0;
            }

            .admin-navbar .left .menu-toggle {
                display: block;
            }

            .admin-navbar .left h3 {
                font-size: 0.85rem;
            }

            .page-content {
                padding: 1rem;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 0.5rem;
            }

            .stat-card .number {
                font-size: 1.2rem;
            }

            .modal-box {
                padding: 1rem 1.2rem;
            }

            .admin-navbar .right .admin-info .name {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .card .card-header {
                flex-direction: column;
                align-items: stretch;
            }

            .card .card-header .actions {
                justify-content: stretch;
            }

            .card .card-header .actions .btn-sm {
                flex: 1;
                justify-content: center;
            }
        }

        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* ============================================================
           UTILITY
           ============================================================ */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .mt-1 { margin-top: 0.5rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .flex { display: flex; }
        .flex-wrap { flex-wrap: wrap; }
        .gap-1 { gap: 0.5rem; }
        .gap-2 { gap: 1rem; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .w-full { width: 100%; }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .empty-state h4 { font-size: 1rem; font-weight: 700; color: var(--text-light); }
        .empty-state p { font-size: 0.85rem; }

        /* Progress bar for tables */
        .progress-bar-mini {
            width: 60px;
            height: 4px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
        }
        .progress-bar-mini .fill {
            height: 100%;
            border-radius: 4px;
            background: var(--primary);
            transition: width 0.5s;
        }
        .progress-bar-mini .fill.success { background: var(--success); }
        .progress-bar-mini .fill.warning { background: var(--warning); }
        .progress-bar-mini .fill.danger { background: var(--danger); }

        /* Charts placeholder */
        .chart-placeholder {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Sidebar overlay for mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .sidebar-overlay.open {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar-overlay.open {
                display: block;
            }
        }

        /* Tabs inside cards */
        .tab-bar {
            display: flex;
            gap: 0.3rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab-bar .tab {
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
            white-space: nowrap;
        }

        .tab-bar .tab:hover {
            color: var(--text-light);
        }

        .tab-bar .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>

    <!-- ============================================================
    FIREBASE
    ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBOBu3wp3GcA-VjwtqIt1PAYYpo_HXFhtU",
            authDomain: "yalla-kimya.firebaseapp.com",
            databaseURL: "https://yalla-kimya-default-rtdb.firebaseio.com",
            projectId: "yalla-kimya",
            storageBucket: "yalla-kimya.firebasestorage.app",
            messagingSenderId: "1052374689829",
            appId: "1:1052374689829:web:fbb815ab42d753e63377cc",
            measurementId: "G-B3SJFF8R1R"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let currentAdmin = null;
        let isAdmin = false;
        let allUsers = [];
        let allCourses = [];
        let allLessons = [];
        let allExams = [];
        let allQuizzes = [];
        let allAssignments = [];
        let allSubscriptions = [];
        let allLogs = [];
        let onlineUsers = [];
        let currentPage = 'dashboard';
        let selectedUserId = null;
        let isLoading = false;

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const el = document.createElement('div');
            el.className = 'toast toast-' + type;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 4000);
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(title, bodyHTML) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        // ============================================================
        // SIDEBAR
        // ============================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        // ============================================================
        // CHECK ADMIN
        // ============================================================
        function checkAdmin(user) {
            return new Promise((resolve, reject) => {
                if (!user) { resolve(false); return; }
                db.ref('admins/' + user.uid).once('value').then(snap => {
                    if (snap.exists() && snap.val() === true) {
                        resolve(true);
                    } else {
                        resolve(false);
                    }
                }).catch(() => resolve(false));
            });
        }

        // ============================================================
        // AUTH
        // ============================================================
        function logout() {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            });
        }

        // ============================================================
        // LOAD DATA
        // ============================================================
        function loadAllUsers() {
            return new Promise((resolve) => {
                db.ref('users').once('value').then(snap => {
                    allUsers = [];
                    snap.forEach(child => {
                        const data = child.val();
                        allUsers.push({
                            id: child.key,
                            ...data,
                            atoms: data.atoms || 0,
                            name: data.name || 'مستخدم',
                            phone: data.phone || '',
                            parentPhone: data.parentPhone || '',
                            grade: data.grade || 'تالتة ثانوي',
                            section: data.section || '',
                            studyType: data.studyType || 'عام',
                            howFound: data.howFound || 'أخرى',
                            createdAt: data.createdAt || Date.now(),
                            banned: data.banned === true || data.isBanned === true,
                            status: data.banned === true || data.isBanned === true ? 'banned' : 'active',
                            active: data.active !== false,
                            loginCount: data.loginCount || 0,
                            lastLogin: data.lastLogin || null,
                            rank: data.rank || '--'
                        });
                    });
                    // Update badge
                    document.getElementById('usersCountBadge').textContent = allUsers.length;
                    resolve(allUsers);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllCourses() {
            return new Promise((resolve) => {
                db.ref('courses').once('value').then(snap => {
                    allCourses = [];
                    snap.forEach(child => {
                        const data = child.val();
                        allCourses.push({
                            id: child.key,
                            ...data,
                            isFree: data.isFree !== false,
                            lessonsCount: data.lessonsCount || 0
                        });
                    });
                    resolve(allCourses);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllLessons() {
            return new Promise((resolve) => {
                db.ref('lessons').once('value').then(snap => {
                    allLessons = [];
                    snap.forEach(child => {
                        allLessons.push({ id: child.key, ...child.val() });
                    });
                    resolve(allLessons);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllExams() {
            return new Promise((resolve) => {
                db.ref('exams').once('value').then(snap => {
                    allExams = [];
                    snap.forEach(child => {
                        const data = child.val();
                        allExams.push({
                            id: child.key,
                            ...data,
                            questions: data.questions || []
                        });
                    });
                    resolve(allExams);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllQuizzes() {
            return new Promise((resolve) => {
                db.ref('quizzes').once('value').then(snap => {
                    allQuizzes = [];
                    snap.forEach(child => {
                        const data = child.val();
                        allQuizzes.push({
                            id: child.key,
                            ...data,
                            questions: data.questions || []
                        });
                    });
                    resolve(allQuizzes);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllAssignments() {
            return new Promise((resolve) => {
                db.ref('assignments').once('value').then(snap => {
                    allAssignments = [];
                    snap.forEach(child => {
                        allAssignments.push({ id: child.key, ...child.val() });
                    });
                    resolve(allAssignments);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllSubscriptions() {
            return new Promise((resolve) => {
                db.ref('subscriptions').once('value').then(snap => {
                    allSubscriptions = [];
                    snap.forEach(child => {
                        allSubscriptions.push({ id: child.key, ...child.val() });
                    });
                    resolve(allSubscriptions);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllLogs() {
            return new Promise((resolve) => {
                db.ref('adminLogs').orderByChild('timestamp').limitToLast(500).once('value').then(snap => {
                    allLogs = [];
                    snap.forEach(child => {
                        allLogs.push({ id: child.key, ...child.val() });
                    });
                    allLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    resolve(allLogs);
                }).catch(() => { resolve([]); });
            });
        }

        function loadOnlineUsers() {
            return new Promise((resolve) => {
                db.ref('online').once('value').then(snap => {
                    onlineUsers = [];
                    snap.forEach(child => {
                        const data = child.val();
                        onlineUsers.push({
                            id: child.key,
                            ...data,
                            name: data.name || 'مستخدم',
                            online: data.online !== false
                        });
                    });
                    document.getElementById('onlineCountBadge').textContent = onlineUsers.filter(u => u.online)
                        .length;
                    resolve(onlineUsers);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllData() {
            return Promise.all([
                loadAllUsers(),
                loadAllCourses(),
                loadAllLessons(),
                loadAllExams(),
                loadAllQuizzes(),
                loadAllAssignments(),
                loadAllSubscriptions(),
                loadAllLogs(),
                loadOnlineUsers()
            ]);
        }

        // ============================================================
        // PAGE LOADER
        // ============================================================
        function loadPage(page) {
            if (isLoading) return;
            isLoading = true;

            // Update active nav
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');

            const titles = {
                dashboard: 'الرئيسية',
                users: 'الطلاب',
                online: 'المتصلون الآن',
                courses: 'الكورسات',
                lessons: 'الحصص',
                exams: 'الامتحانات',
                quizzes: 'الكويزات',
                assignments: 'الواجبات',
                subscriptions: 'الاشتراكات',
                notifications: 'الإشعارات',
                announcements: 'الإعلانات',
                leaderboard: 'المتصدرين',
                logs: 'سجل العمليات',
                analytics: 'التحليلات',
                settings: 'الإعدادات'
            };
            document.getElementById('pageTitle').textContent = titles[page] || page;

            currentPage = page;

            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('open');
            }

            // Load page content
            const content = document.getElementById('pageContent');
            content.innerHTML = '<div style="text-align:center;padding:2rem;"><div class="loading-spinner"></div><p style="margin-top:0.5rem;color:var(--text-muted);">جاري التحميل...</p></div>';

            switch (page) {
                case 'dashboard': renderDashboard(); break;
                case 'users': renderUsers(); break;
                case 'online': renderOnlineUsers(); break;
                case 'courses': renderCourses(); break;
                case 'lessons': renderLessons(); break;
                case 'exams': renderExams(); break;
                case 'quizzes': renderQuizzes(); break;
                case 'assignments': renderAssignments(); break;
                case 'subscriptions': renderSubscriptions(); break;
                case 'notifications': renderNotifications(); break;
                case 'announcements': renderAnnouncements(); break;
                case 'leaderboard': renderLeaderboard(); break;
                case 'logs': renderLogs(); break;
                case 'analytics': renderAnalytics(); break;
                case 'settings': renderSettings(); break;
                default: content.innerHTML = '<div class="empty-state"><div class="icon">🚧</div><h4>صفحة قيد التطوير</h4></div>';
            }

            setTimeout(() => { isLoading = false; }, 300);
        }

        // ============================================================
        // RENDER DASHBOARD
        // ============================================================
        function renderDashboard() {
            const content = document.getElementById('pageContent');

            // Calculate stats
            const totalUsers = allUsers.length;
            const now = Date.now();
            const today = new Date().toDateString();
            const yesterday = new Date(now - 86400000).toDateString();
            const weekAgo = new Date(now - 7 * 86400000).toDateString();
            const monthAgo = new Date(now - 30 * 86400000).toDateString();

            let newToday = 0,
                newYesterday = 0,
                newWeek = 0,
                newMonth = 0;
            let activeToday = 0,
                activeWeek = 0,
                activeMonth = 0;
            let totalAtoms = 0;
            let maxAtoms = 0;
            let topStudent = null;

            allUsers.forEach(u => {
                const created = new Date(u.createdAt).toDateString();
                if (created === today) newToday++;
                if (created === yesterday || created === today) newYesterday++;
                if (new Date(u.createdAt) >= new Date(now - 7 * 86400000)) newWeek++;
                if (new Date(u.createdAt) >= new Date(now - 30 * 86400000)) newMonth++;

                if (u.lastLogin) {
                    const lastLogin = new Date(u.lastLogin).toDateString();
                    if (lastLogin === today) activeToday++;
                    if (new Date(u.lastLogin) >= new Date(now - 7 * 86400000)) activeWeek++;
                    if (new Date(u.lastLogin) >= new Date(now - 30 * 86400000)) activeMonth++;
                }

                totalAtoms += (u.atoms || 0);
                if ((u.atoms || 0) > maxAtoms) {
                    maxAtoms = u.atoms || 0;
                    topStudent = u;
                }
            });

            const avgAtoms = totalUsers > 0 ? Math.round(totalAtoms / totalUsers) : 0;
            const onlineCount = onlineUsers.filter(u => u.online).length;

            // How found stats
            const howFoundStats = {};
            allUsers.forEach(u => {
                const source = u.howFound || 'أخرى';
                howFoundStats[source] = (howFoundStats[source] || 0) + 1;
            });

            content.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="icon">👥</div>
                        <span class="number primary">${totalUsers}</span>
                        <div class="label">إجمالي الطلاب</div>
                        <div class="change up">+${newToday} اليوم</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">🟢</div>
                        <span class="number success">${onlineCount}</span>
                        <div class="label">متصلون الآن</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">⚛️</div>
                        <span class="number primary">${totalAtoms}</span>
                        <div class="label">إجمالي النقاط</div>
                        <div class="change up">المتوسط: ${avgAtoms}</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">🏆</div>
                        <span class="number warning">${maxAtoms}</span>
                        <div class="label">أعلى نقاط</div>
                        <div class="change up">${topStudent ? topStudent.name : 'لا يوجد'}</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">📊</div>
                        <span class="number info">${newToday}</span>
                        <div class="label">طلاب جدد اليوم</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">📈</div>
                        <span class="number info">${newWeek}</span>
                        <div class="label">طلاب جدد آخر 7 أيام</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">📅</div>
                        <span class="number info">${newMonth}</span>
                        <div class="label">طلاب جدد آخر 30 يوم</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">🔥</div>
                        <span class="number success">${activeToday}</span>
                        <div class="label">نشطون اليوم</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">📚</div>
                        <span class="number primary">${allCourses.length}</span>
                        <div class="label">عدد الكورسات</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">🎥</div>
                        <span class="number info">${allLessons.length}</span>
                        <div class="label">عدد الحصص</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">📝</div>
                        <span class="number warning">${allExams.length}</span>
                        <div class="label">الامتحانات</div>
                    </div>
                    <div class="stat-card">
                        <div class="icon">🧪</div>
                        <span class="number success">${allQuizzes.length}</span>
                        <div class="label">الكويزات</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h4>📊 مصادر معرفة الطلاب بالمنصة</h4>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.5rem;">
                        ${Object.keys(howFoundStats).map(key => `
                            <div style="background:var(--bg-dark);padding:0.5rem 0.8rem;border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center;">
                                <span style="font-size:0.8rem;">${key === 'youtube' ? '📺 يوتيوب' : key === 'facebook' ? '📘 فيسبوك' : key === 'instagram' ? '📸 إنستغرام' : key === 'tiktok' ? '🎵 تيك توك' : key === 'friend' ? '👥 صديق' : key === 'teacher' ? '👨‍🏫 مدرس' : key === 'whatsapp' ? '💬 واتساب' : key === 'telegram' ? '✈️ تيليجرام' : key === 'google' ? '🔍 جوجل' : key}</span>
                                <span style="font-weight:700;color:var(--primary);">${howFoundStats[key]}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h4>🏆 أعلى 10 طلاب نقاطاً</h4>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr><th>#</th><th>الطالب</th><th>النقاط</th><th>الترتيب</th><th>الحالة</th></tr>
                            </thead>
                            <tbody>
                                ${allUsers.sort((a,b) => (b.atoms||0) - (a.atoms||0)).slice(0,10).map((u, i) => `
                                    <tr>
                                        <td>${i+1}</td>
                                        <td><div style="display:flex;align-items:center;gap:0.5rem;">
                                            <span class="avatar-sm">${u.name ? u.name[0] : 'U'}</span>

        // ============================================================
        // RENDER USERS
        // ============================================================
        let usersPage = 1;
        let usersPageSize = 20;
        let usersFilter = 'all';
        let usersSearch = '';

        function renderUsers() {
            const content = document.getElementById('pageContent');

            let filtered = [...allUsers];

            // Search
            if (usersSearch) {
                const s = usersSearch.toLowerCase();
                filtered = filtered.filter(u =>
                    (u.name || '').toLowerCase().includes(s) ||
                    (u.phone || '').includes(s) ||
                    (u.email || '').toLowerCase().includes(s) ||
                    (u.id || '').toLowerCase().includes(s)
                );
            }

            // Filter by status
            if (usersFilter === 'banned') filtered = filtered.filter(u => u.banned);
            else if (usersFilter === 'active') filtered = filtered.filter(u => !u.banned);
            else if (usersFilter === 'online') {
                const onlineIds = onlineUsers.filter(o => o.online).map(o => o.id);
                filtered = filtered.filter(u => onlineIds.includes(u.id));
            }

            // Sort by newest first
            filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            const totalPages = Math.ceil(filtered.length / usersPageSize);
            const start = (usersPage - 1) * usersPageSize;
            const pageItems = filtered.slice(start, start + usersPageSize);

            content.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h4>👥 إدارة الطلاب (${filtered.length})</h4>

                                                <span class="avatar-sm">${u.name ? u.name[0] : 'U'}</span>
                                                <div>
                                                    <div style="font-weight:600;">${u.name}</div>
                                                    <div style="font-size:0.65rem;color:var(--text-muted);">${u.id ? u.id.substring(0,8) : ''}</div>
                                                </div>

                                        <td>${u.parentPhone || '—'}</td>
                                        <td><strong style="color:var(--primary);">${u.atoms||0}</strong></td>

        // ============================================================
        // TOGGLE BAN
        // ============================================================
        function toggleBan(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const newStatus = !user.banned;
            const action = newStatus ? 'حظر' : 'فك الحظر';

            if (newStatus && !confirm(`⚠️ هل أنت متأكد من حظر الطالب "${user.name}"؟`)) return;

            db.ref('users/' + userId + '/banned').set(newStatus);
            db.ref('users/' + userId + '/isBanned').set(newStatus);

            // Log
            db.ref('adminLogs').push({
                action: newStatus ? 'ban_user' : 'unban_user',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                timestamp: new Date().toISOString(),
                details: `${action} الطالب ${user.name}`
            });

            showToast(`✅ تم ${action} الطالب بنجاح`, 'success');
            loadAllUsers().then(() => renderUsers());
        }

        function addPointsModal(userId) {
            const user = allUsers.find(u => u.id === userId);

            const html = `

                </div>

                    <label>السبب</label>

                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إلغاء</button>

                </div>
            `;

            openModal('⭐ إضافة نقاط', html);
        }

        function addPoints(userId) {
            const amount = parseInt(document.getElementById('pointsAmount').value) || 0;
            const reason = document.getElementById('pointsReason').value || 'بدون سبب';

            if (amount <= 0) { showToast('يجب إدخال عدد نقاط صحيح', 'error'); return; }

            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const current = user.atoms || 0;

            db.ref('users/' + userId + '/atoms').set(current + amount);

            // Log
            db.ref('adminLogs').push({
                action: 'add_points',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                amount: amount,
                reason: reason,
                timestamp: new Date().toISOString(),
                details: `إضافة ${amount} نقطة للطالب ${user.name} (${reason})`
            });

            showToast(`✅ تم إضافة ${amount} نقطة بنجاح`, 'success');
            closeModal();
            loadAllUsers().then(() => renderUsers());
        }

        function saveCourse(courseId) {
            const title = document.getElementById('courseTitle').value.trim();
            const description = document.getElementById('courseDesc').value.trim();
            const image = document.getElementById('courseImage').value.trim();
            const type = document.getElementById('courseType').value;
            const price = document.getElementById('coursePrice').value.trim();
            const grade = document.getElementById('courseGrade').value;
            const section = document.getElementById('courseSection').value;

            if (!title) { showToast('يرجى إدخال اسم الكورس', 'error'); return; }

            const data = {
                title: title,
                description: description || '',
                image: image || '',
                isFree: type === 'مجاني',
                price: price || '0',
                grade: grade,
                section: section,
                updatedAt: new Date().toISOString()
            };

            if (courseId) {
                db.ref('courses/' + courseId).update(data).then(() => {
                    showToast('✅ تم تحديث الكورس بنجاح', 'success');
                    closeModal();
                    loadAllCourses().then(() => renderCourses());
                });
            } else {
                db.ref('courses').push(data).then(() => {
                    showToast('✅ تم إضافة الكورس بنجاح', 'success');
                    closeModal();
                    loadAllCourses().then(() => renderCourses());

        function saveExam(examId) {
            const title = document.getElementById('examTitle').value.trim();
            const courseId = document.getElementById('examCourse').value;

            const questions = questionsText.split('\n').filter(line => line.trim()).map(line => {
                const parts = line.split('|').map(s => s.trim());
                if (parts.length >= 6) {
                    const options = parts.slice(1, 5);
                    const correctIndex = parseInt(parts[5]) - 1 || 0;
                    return {
                        id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                        question: parts[0],
                        options: options,
                        correctAnswer: Math.min(Math.max(correctIndex, 0), options.length - 1)
                    };

                return null;
            }).filter(q => q);

            const data = {

                questions: questions,
                updatedAt: new Date().toISOString()

        function saveSubscription() {
            const userId = document.getElementById('subUser').value;
            const courseId = document.getElementById('subCourse').value;
            const type = document.getElementById('subType').value;

            if (!userId || !courseId) { showToast('يرجى اختيار الطالب والكورس', 'error'); return; }

            db.ref('subscriptions').push({
                userId: userId,
                courseId: courseId,
                status: 'active',
                type: type,
                createdAt: new Date().toISOString(),
                activatedAt: new Date().toISOString()
            }).then(() => {
                // Also add to user's premiumCourses
                db.ref('users/' + userId + '/premiumCourses/' + courseId).set(true);
                showToast('✅ تم تفعيل الاشتراك', 'success');
                closeModal();
                loadAllSubscriptions().then(() => renderSubscriptions());
            });

        function deleteSubscription(subId, userId, courseId) {
            if (!confirm('⚠️ هل أنت متأكد من إلغاء هذا الاشتراك؟')) return;

            db.ref('subscriptions/' + subId).remove().then(() => {
                // Remove from user's premiumCourses

                    db.ref('users/' + userId + '/premiumCourses/' + courseId).remove();

        function sendNotification() {
            const title = document.getElementById('notifTitle').value.trim();
            const body = document.getElementById('notifBody').value.trim();
            const target = document.getElementById('notifTarget').value;

            if (!title || !body) { showToast('يرجى إدخال العنوان والرسالة', 'error'); return; }

            let targetUsers = allUsers;
            if (target === 'active') {
                const onlineIds = onlineUsers.filter(o => o.online).map(o => o.id);
                targetUsers = allUsers.filter(u => onlineIds.includes(u.id) || (u.lastLogin && new Date(u.lastLogin) >
                    new Date(Date.now() - 7 * 86400000)));
            }

            if (targetUsers.length === 0) { showToast('لا يوجد مستخدمين مستهدفين', 'warning'); return; }

            const notifData = {
                title: title,
                description: body,
                icon: '📢',
                read: false,
                createdAt: new Date().toISOString(),
                fromAdmin: true,
                adminName: currentAdmin?.name || 'Admin'
            };

            let count = 0;
            const promises = targetUsers.map(u => {
                return db.ref('users/' + u.id + '/notifications').push(notifData).then(() => { count++; });
            });

            Promise.all(promises).then(() => {
                // Log
                db.ref('adminLogs').push({
                    action: 'send_notification',
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    target: target,
                    targetCount: count,
                    title: title,
                    timestamp: new Date().toISOString(),
                    details: `إرسال إشعار "${title}" إلى ${count} طالب`
                });

                showToast(`✅ تم إرسال الإشعار إلى ${count} طالب`, 'success');
                document.getElementById('notifTitle').value = '';
                document.getElementById('notifBody').value = '';
            });
        }

        // ============================================================
        // EXPORT USERS CSV
        // ============================================================
        function exportUsersCSV() {
            if (allUsers.length === 0) { showToast('لا يوجد طلاب للتصدير', 'warning'); return; }

            let csv = 'الاسم,رقم الهاتف,ولي الأمر,البريد,النقاط,الترتيب,الحالة,تاريخ التسجيل,مصدر المعرفة\n';
            allUsers.forEach(u => {
                csv +=
                    `${u.name},${u.phone||''},${u.parentPhone||''},${u.email||''},${u.atoms||0},${u.rank||''},${u.banned?'محظور':'نشط'},${u.createdAt?new Date(u.createdAt).toLocaleDateString('ar'):''},${u.howFound||''}\n`;
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `طلاب_يلا_كيمياء_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            showToast('✅ تم تصدير البيانات', 'success');
        }

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            auth.onAuthStateChanged(user => {
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                currentUser = user;

                // Check if user is admin
                db.ref('admins/' + user.uid).once('value').then(snap => {
                    if (!snap.exists() || snap.val() !== true) {
                        showToast('⛔ غير مصرح لك بالدخول إلى لوحة التحكم', 'error');
                        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                        return;
                    }

                    isAdmin = true;
                    document.getElementById('adminName').textContent = user.displayName || 'Admin';
                    document.getElementById('adminAvatar').textContent = (user.displayName || 'A')[0];

                    // Load admin data
                    db.ref('users/' + user.uid).once('value').then(snap => {
                        if (snap.exists()) {
                            currentAdmin = snap.val();
                            document.getElementById('adminName').textContent = currentAdmin.name ||
                                'Admin';
                            document.getElementById('adminAvatar').textContent = (currentAdmin
                                .name || 'A')[0];
                        }
                    });

                    // Load all data and render dashboard
                    loadAllData().then(() => {
                        loadPage('dashboard');
                        showToast('👋 مرحباً بك في لوحة التحكم', 'info');
                    });
                });
            });
        }

        // ============================================================
        // START
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);

        // Close modal on overlay click
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        console.log('🚀 Admin Panel v1.0 - يلا كيمياء');
        console.log('📊 All systems ready');
    </script>
