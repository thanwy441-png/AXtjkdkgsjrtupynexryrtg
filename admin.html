        // ============================================================
        // COURSE & LESSON MODALS (Simplified)
        // ============================================================
        function showAddCourseModal() {
            const html = `
                <div class="form-group">
                    <label>اسم الكورس *</label>
                    <input type="text" id="courseTitle" placeholder="اسم الكورس">
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="courseDesc" placeholder="وصف الكورس"></textarea>
                </div>
                <div class="form-group">
                    <label>رابط الصورة</label>
                    <input type="text" id="courseImage" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>النوع</label>
                    <select id="courseType">
                        <option value="مجاني">🆓 مجاني</option>
                        <option value="مدفوع">💳 مدفوع</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الصف</label>
                    <select id="courseGrade">
                        <option value="تالتة ثانوي">تالتة ثانوي</option>
                        <option value="تانية ثانوي">تانية ثانوي</option>
                        <option value="أولى ثانوي">أولى ثانوي</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button class="btn-submit" onclick="saveCourse()">💾 حفظ</button>
                </div>
            `;
            openModal('➕ إضافة كورس جديد', html);
            window._editCourseId = null;
        }

        function editCourse(courseId) {
            const c = allCourses.find(c => c.id === courseId);
            if (!c) return;

            const html = `
                <div class="form-group">
                    <label>اسم الكورس *</label>
                    <input type="text" id="courseTitle" value="${c.title || ''}">
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="courseDesc">${c.description || ''}</textarea>
                </div>
                <div class="form-group">
                    <label>رابط الصورة</label>
                    <input type="text" id="courseImage" value="${c.image || ''}">
                </div>
                <div class="form-group">
                    <label>النوع</label>
                    <select id="courseType">
                        <option value="مجاني" ${c.isFree ? 'selected' : ''}>🆓 مجاني</option>
                        <option value="مدفوع" ${!c.isFree ? 'selected' : ''}>💳 مدفوع</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الصف</label>
                    <select id="courseGrade">
                        <option value="تالتة ثانوي" ${c.grade === 'تالتة ثانوي' ? 'selected' : ''}>تالتة ثانوي</option>
                        <option value="تانية ثانوي" ${c.grade === 'تانية ثانوي' ? 'selected' : ''}>تانية ثانوي</option>
                        <option value="أولى ثانوي" ${c.grade === 'أولى ثانوي' ? 'selected' : ''}>أولى ثانوي</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button class="btn-submit" onclick="saveCourse('${courseId}')">💾 تحديث</button>
                </div>
            `;
            openModal('✏️ تعديل كورس: ' + c.title, html);
            window._editCourseId = courseId;
        }

        function saveCourse(courseId) {
            const title = document.getElementById('courseTitle').value.trim();
            const description = document.getElementById('courseDesc').value.trim();
            const image = document.getElementById('courseImage').value.trim();
            const type = document.getElementById('courseType').value;
            const grade = document.getElementById('courseGrade').value;

            if (!title) { showToast('يرجى إدخال اسم الكورس', 'error'); return; }

            const data = {
                title: title,
                description: description || '',
                image: image || '',
                isFree: type === 'مجاني',
                grade: grade,
                subscribers: {},
                pageViews: 0,
                revenue: 0,
                updatedAt: new Date().toISOString()
            };

            if (courseId) {
                db.ref('courses/' + courseId).update(data).then(() => {
                    showToast('✅ تم تحديث الكورس', 'success');
                    closeModal();
                });
            } else {
                db.ref('courses').push(data).then(() => {
                    showToast('✅ تم إضافة الكورس', 'success');
                    closeModal();
                });
            }
        }

        function deleteCourse(courseId) {
            if (!confirm('⚠️ هل أنت متأكد من حذف هذا الكورس؟')) return;
            db.ref('courses/' + courseId).remove().then(() => {
                showToast('✅ تم حذف الكورس', 'success');
            });
        }

        function showAddLessonModal() {
            const courseOptions = allCourses.map(c =>
                `<option value="${c.id}">${c.title}</option>`
            ).join('');

            const html = `
                <div class="form-group">
                    <label>عنوان الحصة *</label>
                    <input type="text" id="lessonTitle" placeholder="عنوان الحصة">
                </div>
                <div class="form-group">
                    <label>الكورس *</label>
                    <select id="lessonCourse">${courseOptions}</select>
                </div>
                <div class="form-group">
                    <label>رابط الفيديو (YouTube)</label>
                    <input type="text" id="lessonVideo" placeholder="https://youtu.be/...">
                </div>
                <div class="form-group">
                    <label>نقاط المشاهدة</label>
                    <input type="number" id="lessonAtoms" value="5">
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button class="btn-submit" onclick="saveLesson()">💾 حفظ</button>
                </div>
            `;
            openModal('➕ إضافة حصة جديدة', html);
            window._editLessonId = null;
        }

        function saveLesson() {
            const title = document.getElementById('lessonTitle').value.trim();
            const courseId = document.getElementById('lessonCourse').value;
            const videoUrl = document.getElementById('lessonVideo').value.trim();
            const atomsReward = parseInt(document.getElementById('lessonAtoms').value) || 5;

            if (!title) { showToast('يرجى إدخال عنوان الحصة', 'error'); return; }
            if (!courseId) { showToast('يرجى اختيار الكورس', 'error'); return; }

            const data = {
                title: title,
                courseId: courseId,
                videoUrl: videoUrl || '',
                atomsReward: atomsReward,
                pdfUrl: '',
                quizId: '',
                examId: '',
                assignmentId: '',
                hasQuiz: false,
                hasExam: false,
                hasAssignment: false,
                updatedAt: new Date().toISOString()
            };

            db.ref('lessons').push(data).then(() => {
                showToast('✅ تم إضافة الحصة', 'success');
                closeModal();
            });
        }

        // ============================================================
        // SETTINGS
        // ============================================================
        function renderSettings() {
            const content = document.getElementById('pageContent');

            content.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h4>⚙️ الإعدادات</h4>
                    </div>
                    <div style="display:grid;gap:1rem;">
                        <div style="background:var(--bg-input);padding:1rem;border-radius:var(--radius-sm);">
                            <h4 style="font-weight:700;margin-bottom:0.5rem;">👥 إدارة المسؤولين</h4>
                            <div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;">
                                <input type="text" id="adminUidInput" placeholder="UID المستخدم" style="flex:1;min-width:200px;padding:0.4rem 0.8rem;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);">
                                <button class="btn-sm primary" onclick="addAdmin()">➕ إضافة مسؤول</button>
                            </div>
                            <div id="adminsList" style="margin-top:0.5rem;">
                                <p style="color:var(--text-muted);font-size:0.8rem;">جاري تحميل قائمة المسؤولين...</p>
                            </div>
                        </div>
                        <div style="background:var(--bg-input);padding:1rem;border-radius:var(--radius-sm);">
                            <h4 style="font-weight:700;margin-bottom:0.5rem;">⚠️ إجراءات خطيرة</h4>
                            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                                <button class="btn-sm danger" onclick="clearAllData()">🗑️ مسح جميع البيانات</button>
                                <button class="btn-sm warning" onclick="resetAtoms()">🔄 إعادة تعيين النقاط</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            loadAdminsList();
        }

        function loadAdminsList() {
            db.ref('admins').once('value').then(snap => {
                const container = document.getElementById('adminsList');
                if (!container) return;
                const admins = [];
                snap.forEach(child => {
                    if (child.val() === true) admins.push(child.key);
                });
                if (admins.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;">لا يوجد مسؤولين</p>';
                    return;
                }
                container.innerHTML = admins.map(uid =>
                    `<div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-card);padding:0.3rem 0.8rem;border-radius:var(--radius-sm);margin-bottom:0.2rem;border:1px solid var(--border-color);">
                        <span style="font-size:0.8rem;font-family:monospace;">${uid}</span>
                        ${uid !== currentUser.uid ? `<button class="btn-sm danger icon-only" onclick="removeAdmin('${uid}')" title="إزالة"><i class="fas fa-times"></i></button>` : '<span style="font-size:0.7rem;color:var(--text-muted);">(أنت)</span>'}
                    </div>`
                ).join('');
            });
        }

        function addAdmin() {
            const uid = document.getElementById('adminUidInput').value.trim();
            if (!uid) { showToast('يرجى إدخال UID المستخدم', 'error'); return; }
            db.ref('admins/' + uid).set(true).then(() => {
                showToast('✅ تم إضافة المسؤول', 'success');
                document.getElementById('adminUidInput').value = '';
                loadAdminsList();
            });
        }

        function removeAdmin(uid) {
            if (!confirm(`⚠️ هل أنت متأكد من إزالة هذا المسؤول؟`)) return;
            db.ref('admins/' + uid).remove().then(() => {
                showToast('✅ تم إزالة المسؤول', 'success');
                loadAdminsList();
            });
        }

        function clearAllData() {
            if (!confirm('⚠️ ⚠️ ⚠️ تحذير شديد! هذا الإجراء سيمسح جميع بيانات المنصة. هل أنت متأكد تماماً؟')) return;
            if (!confirm('⚠️ تأكيد نهائي: اكتب "نعم" للمتابعة')) return;

            showToast('⏳ جاري مسح البيانات...', 'info');
            Promise.all([
                db.ref('users').remove(),
                db.ref('courses').remove(),
                db.ref('lessons').remove(),
                db.ref('exams').remove(),
                db.ref('quizzes').remove(),
                db.ref('assignments').remove(),
                db.ref('subscriptions').remove(),
                db.ref('onlineSessions').remove(),
                db.ref('activationCodes').remove(),
                db.ref('adminLogs').remove()
            ]).then(() => {
                showToast('✅ تم مسح جميع البيانات', 'success');
            });
        }

        function resetAtoms() {
            if (!confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع النقاط إلى 0؟')) return;
            const updates = {};
            allUsers.forEach(u => {
                updates['users/' + u.id + '/atoms'] = 0;
            });
            db.ref().update(updates).then(() => {
                showToast('✅ تم إعادة تعيين النقاط', 'success');
            });
        }

        // ============================================================
        // INIT
        // ============================================================
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        console.log('🚀 Admin Panel v9.0 - يلا كيمياء (Real-Time بالكامل)');
        console.log('📡 Real-time listeners active: Online, Users, Courses, Subscriptions, Codes, Logs');
        console.log('✅ Using correct paths: onlineSessions, adminLogs, activationCodes, subscriptions');
    </script>

</body>
</html>
