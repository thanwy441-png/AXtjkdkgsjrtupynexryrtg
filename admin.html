        // ============================================================
        // SHOW ADD QUESTION MODAL - FULL COMPOSER
        // ============================================================
        let currentQuestionId = null;

        function showAddQuestionModal() {
            currentQuestionId = null;
            const html = getQuestionFormHTML();
            openModal('➕ إضافة سؤال جديد', html);
            setupQuestionForm();
        }

        function editQuestion(questionId) {
            const q = allQuestions.find(q => q.id === questionId);
            if (!q) { showToast('السؤال غير موجود', 'error'); return; }
            currentQuestionId = questionId;
            const html = getQuestionFormHTML(q);
            openModal('✏️ تعديل سؤال', html);
            setupQuestionForm(q);
        }

        function getQuestionFormHTML(q = null) {
            const options = ['A', 'B', 'C', 'D'];
            const optionValues = q ? q.options || ['', '', '', ''] : ['', '', '', ''];
            const correctIndex = q ? q.correctAnswer || 0 : 0;

            return `
                <div class="form-group">
                    <label>السؤال *</label>
                    <textarea id="questionText" style="min-height:80px;" placeholder="أدخل نص السؤال...">${q ? q.question || '' : ''}</textarea>
                </div>

                <div class="form-group">
                    <label>رابط صورة السؤال (اختياري)</label>
                    <input type="text" id="questionImage" placeholder="https://example.com/image.jpg" value="${q ? q.image || '' : ''}" oninput="previewQuestionImage()">
                    <div id="imagePreviewContainer" style="margin-top:0.3rem;">
                        ${q && q.image ? `<div class="image-preview"><img src="${q.image}" onerror="this.parentElement.innerHTML='<div class=\\'error\\'>❌ تعذر تحميل صورة السؤال</div>'"></div>` : ''}
                    </div>
                </div>

                <div style="margin-bottom:0.8rem;">
                    <label style="font-size:0.75rem;font-weight:700;color:var(--text-muted);display:block;margin-bottom:0.2rem;">الاختيارات</label>
                    ${options.map((label, idx) => `
                        <div class="question-option">
                            <span class="option-label">${label}</span>
                            <input type="text" id="option${idx}" placeholder="اختيار ${label}" value="${optionValues[idx] || ''}">
                            <button class="option-correct-btn ${correctIndex === idx ? 'active' : ''}" onclick="setCorrectOption(${idx})" title="تحديد كإجابة صحيحة">
                                <i class="fas fa-check-circle"></i>
                            </button>
                        </div>
                    `).join('')}
                    <div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.2rem;">⚠️ اختر الإجابة الصحيحة بالضغط على علامة الصح</div>
                </div>

                <div class="form-group">
                    <label>الشرح (اختياري)</label>
                    <textarea id="questionExplanation" placeholder="شرح الإجابة..." style="min-height:60px;">${q ? q.explanation || '' : ''}</textarea>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">
                    <div class="form-group">
                        <label>المادة</label>
                        <input type="text" id="questionSubject" placeholder="مثال: كيمياء" value="${q ? q.subject || '' : ''}">
                    </div>
                    <div class="form-group">
                        <label>الباب</label>
                        <input type="text" id="questionChapter" placeholder="الباب" value="${q ? q.chapter || '' : ''}">
                    </div>
                    <div class="form-group">
                        <label>الفصل</label>
                        <input type="text" id="questionSection" placeholder="الفصل" value="${q ? q.section || '' : ''}">
                    </div>
                    <div class="form-group">
                        <label>الدرس</label>
                        <input type="text" id="questionLesson" placeholder="الدرس" value="${q ? q.lesson || '' : ''}">
                    </div>
                </div>

                <div class="form-group">
                    <label>المستوى</label>
                    <select id="questionLevel">
                        <option value="سهل" ${q && q.level === 'سهل' ? 'selected' : ''}>سهل</option>
                        <option value="متوسط" ${q && q.level === 'متوسط' ? 'selected' : ''}>متوسط</option>
                        <option value="صعب" ${q && q.level === 'صعب' ? 'selected' : ''}>صعب</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button class="btn-submit" onclick="saveQuestion()">💾 حفظ</button>
                    <button class="btn-next" onclick="saveQuestionAndNext()">💾 حفظ + سؤال جديد</button>
                </div>
            `;
        }

        function setupQuestionForm(q = null) {
            // Preview image if exists
            if (q && q.image) {
                previewQuestionImage(q.image);
            }
        }

        function previewQuestionImage(url) {
            const container = document.getElementById('imagePreviewContainer');
            if (!container) return;
            const imageUrl = url || document.getElementById('questionImage').value.trim();
            if (imageUrl) {
                container.innerHTML = `<div class="image-preview"><img src="${imageUrl}" onerror="this.parentElement.innerHTML='<div class=\\'error\\'>❌ تعذر تحميل صورة السؤال</div>'"></div>`;
            } else {
                container.innerHTML = '';
            }
        }

        let selectedCorrectOption = 0;

        function setCorrectOption(index) {
            selectedCorrectOption = index;
            document.querySelectorAll('.option-correct-btn').forEach((btn, idx) => {
                if (idx === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function getOptionsFromForm() {
            return ['option0', 'option1', 'option2', 'option3'].map(id => document.getElementById(id).value.trim());
        }

        function getCorrectOptionIndex() {
            // Get from active button
            const activeBtn = document.querySelector('.option-correct-btn.active');
            if (activeBtn) {
                const btns = document.querySelectorAll('.option-correct-btn');
                for (let i = 0; i < btns.length; i++) {
                    if (btns[i] === activeBtn) return i;
                }
            }
            return 0;
        }

        function saveQuestion() {
            const question = collectQuestionData();
            if (!question) return;

            if (currentQuestionId) {
                db.ref('questions/' + currentQuestionId).update(question).then(() => {
                    showToast('✅ تم تحديث السؤال', 'success');
                    closeModal();
                    loadAllQuestions().then(() => renderQuestions());
                });
            } else {
                db.ref('questions').push(question).then(() => {
                    showToast('✅ تم إضافة السؤال', 'success');
                    closeModal();
                    loadAllQuestions().then(() => renderQuestions());
                });
            }
        }

        function saveQuestionAndNext() {
            const question = collectQuestionData();
            if (!question) return;

            if (currentQuestionId) {
                db.ref('questions/' + currentQuestionId).update(question).then(() => {
                    showToast('✅ تم تحديث السؤال', 'success');
                    // Clear form for next
                    clearQuestionForm();
                    loadAllQuestions().then(() => renderQuestions());
                    showToast('📝 جاهز للسؤال التالي', 'info');
                });
            } else {
                db.ref('questions').push(question).then(() => {
                    showToast('✅ تم إضافة السؤال', 'success');
                    // Clear form for next
                    clearQuestionForm();
                    loadAllQuestions().then(() => renderQuestions());
                    showToast('📝 جاهز للسؤال التالي', 'info');
                });
            }
        }

        function collectQuestionData() {
            const question = document.getElementById('questionText').value.trim();
            const image = document.getElementById('questionImage').value.trim();
            const options = getOptionsFromForm();
            const correctAnswer = getCorrectOptionIndex();
            const explanation = document.getElementById('questionExplanation').value.trim();
            const subject = document.getElementById('questionSubject').value.trim();
            const chapter = document.getElementById('questionChapter').value.trim();
            const section = document.getElementById('questionSection').value.trim();
            const lesson = document.getElementById('questionLesson').value.trim();
            const level = document.getElementById('questionLevel').value;

            if (!question) { showToast('يرجى إدخال نص السؤال', 'error'); return null; }
            if (options.some(o => !o)) { showToast('يرجى ملء جميع الاختيارات', 'error'); return null; }

            return {
                question: question,
                image: image || '',
                options: options,
                correctAnswer: correctAnswer,
                explanation: explanation || '',
                subject: subject || '',
                chapter: chapter || '',
                section: section || '',
                lesson: lesson || '',
                level: level || 'متوسط',
                createdAt: currentQuestionId ? undefined : new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
        }

        function clearQuestionForm() {
            document.getElementById('questionText').value = '';
            document.getElementById('questionImage').value = '';
            document.getElementById('imagePreviewContainer').innerHTML = '';
            document.getElementById('option0').value = '';
            document.getElementById('option1').value = '';
            document.getElementById('option2').value = '';
            document.getElementById('option3').value = '';
            document.getElementById('questionExplanation').value = '';
            document.getElementById('questionSubject').value = '';
            document.getElementById('questionChapter').value = '';
            document.getElementById('questionSection').value = '';
            document.getElementById('questionLesson').value = '';
            document.getElementById('questionLevel').value = 'متوسط';
            // Reset correct answer selection
            document.querySelectorAll('.option-correct-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.option-correct-btn')?.classList.add('active');
            currentQuestionId = null;
        }

        // ============================================================
        // VIEW QUESTION
        // ============================================================
        function viewQuestion(questionId) {
            const q = allQuestions.find(q => q.id === questionId);
            if (!q) { showToast('السؤال غير موجود', 'error'); return; }

            const options = ['A', 'B', 'C', 'D'];
            let html = `
                <div style="margin-bottom:1rem;">
                    <div style="background:var(--bg-dark);padding:0.8rem;border-radius:var(--radius-sm);margin-bottom:0.5rem;">
                        <div style="font-size:0.7rem;color:var(--text-muted);">السؤال</div>
                        <div style="font-size:1rem;font-weight:600;margin-top:0.2rem;">${q.question}</div>
                        ${q.image ? `<div style="margin-top:0.5rem;"><img src="${q.image}" style="max-width:100%;max-height:200px;border-radius:var(--radius-sm);border:1px solid var(--border-color);" onerror="this.parentElement.innerHTML='<div class=\\'error\\'>❌ تعذر تحميل صورة السؤال</div>'"></div>` : ''}
                    </div>
                    <div style="display:grid;gap:0.3rem;">
                        ${options.map((label, idx) => `
                            <div style="display:flex;align-items:center;gap:0.5rem;background:${q.correctAnswer === idx ? 'rgba(34,197,94,0.1)' : 'var(--bg-dark)'};padding:0.3rem 0.6rem;border-radius:var(--radius-sm);border:${q.correctAnswer === idx ? '1px solid var(--success)' : '1px solid var(--border-color)'};">
                                <span style="font-weight:700;color:${q.correctAnswer === idx ? 'var(--success)' : 'var(--text-muted)'};">${label}</span>
                                <span>${q.options[idx] || ''}</span>
                                ${q.correctAnswer === idx ? '<span style="color:var(--success);margin-right:auto;">✅ الإجابة الصحيحة</span>' : ''}
                            </div>
                        `).join('')}
                    </div>
                    ${q.explanation ? `
                        <div style="margin-top:0.5rem;background:var(--bg-dark);padding:0.5rem;border-radius:var(--radius-sm);">
                            <div style="font-size:0.7rem;color:var(--text-muted);">الشرح</div>
                            <div style="font-size:0.85rem;">${q.explanation}</div>
                        </div>
                    ` : ''}
                    <div style="margin-top:0.5rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
                        ${q.subject ? `<span class="tag primary">📚 ${q.subject}</span>` : ''}
                        ${q.chapter ? `<span class="tag">📖 ${q.chapter}</span>` : ''}
                        ${q.section ? `<span class="tag">📑 ${q.section}</span>` : ''}
                        ${q.lesson ? `<span class="tag">📓 ${q.lesson}</span>` : ''}
                        ${q.level ? `<span class="tag" style="border-color:${q.level === 'سهل' ? 'var(--success)' : q.level === 'متوسط' ? 'var(--warning)' : 'var(--danger)'};color:${q.level === 'سهل' ? 'var(--success)' : q.level === 'متوسط' ? 'var(--warning)' : 'var(--danger)'};">${q.level}</span>` : ''}
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إغلاق</button>
                    <button class="btn-submit" onclick="closeModal();editQuestion('${questionId}')">✏️ تعديل</button>
                    <button class="btn-info" onclick="closeModal();duplicateQuestion('${questionId}')">📋 نسخ</button>
                </div>
            `;

            openModal('❓ عرض السؤال', html);
        }

        // ============================================================
        // DUPLICATE QUESTION
        // ============================================================
        function duplicateQuestion(questionId) {
            const q = allQuestions.find(q => q.id === questionId);
            if (!q) { showToast('السؤال غير موجود', 'error'); return; }

            // Create a copy with new ID
            const newQuestion = {
                ...q,
                question: q.question + ' (نسخة)',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            delete newQuestion.id;

            db.ref('questions').push(newQuestion).then(() => {
                showToast('✅ تم نسخ السؤال', 'success');
                loadAllQuestions().then(() => renderQuestions());
            });
        }

        // ============================================================
        // DELETE QUESTION
        // ============================================================
        function deleteQuestion(questionId) {
            if (!confirm('⚠️ هل أنت متأكد من حذف هذا السؤال؟')) return;
            db.ref('questions/' + questionId).remove().then(() => {
                showToast('✅ تم حذف السؤال', 'success');
                loadAllQuestions().then(() => renderQuestions());
            });
        }

        // ============================================================
        // RENDER QUIZZES (enhanced)
        // ============================================================
        function renderQuizzes() {
            const content = document.getElementById('pageContent');

            content.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h4>🧪 الكويزات (${allQuizzes.length})</h4>
                        <div class="actions">
                            <button class="btn-sm primary" onclick="showAddQuizModal()">➕ إضافة كويز</button>
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr><th>#</th><th>الكويز</th><th>الأسئلة</th><th>المدة</th><th>المشاركين</th><th>المتوسط</th><th>إجراءات</th></tr>
                            </thead>
                            <tbody>
                                ${allQuizzes.length === 0 ? `
                                    <tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:1.5rem;">لا توجد كويزات</td></tr>
                                ` : allQuizzes.map((q, i) => {
                                    const results = q.results || {};
                                    const resultKeys = Object.keys(results);
                                    let totalScore = 0;
                                    resultKeys.forEach(k => {
                                        if (results[k].score) totalScore += results[k].score;
                                    });
                                    const avgScore = resultKeys.length > 0 ? Math.round(totalScore / resultKeys.length) : 0;
                                    return `
                                    <tr>
                                        <td>${i+1}</td>
                                        <td><span style="font-weight:600;">${q.title}</span></td>
                                        <td>${q.questions?.length || 0}</td>
                                        <td>${q.duration || 15} دقيقة</td>
                                        <td>${resultKeys.length}</td>
                                        <td><strong style="color:var(--primary);">${avgScore}%</strong></td>
                                        <td>
                                            <button class="btn-sm primary icon-only" onclick="editQuiz('${q.id}')"><i class="fas fa-edit"></i></button>
                                            <button class="btn-sm danger icon-only" onclick="deleteQuiz('${q.id}')"><i class="fas fa-trash"></i></button>
                                        </td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // QUIZ CRUD (existing - kept)
        // ============================================================
        function showAddQuizModal() {
            const html = `
                <div class="form-group">
                    <label>عنوان الكويز *</label>
                    <input type="text" id="quizTitle" placeholder="عنوان الكويز">
                </div>
                <div class="form-group">
                    <label>المدة (دقائق)</label>
                    <input type="number" id="quizDuration" value="15">
                </div>
                <div class="form-group">
                    <label>نقاط الكويز</label>
                    <input type="number" id="quizAtoms" value="5">
                </div>
                <div class="form-group">
                    <label>الأسئلة (كل سؤال في سطر)</label>
                    <textarea id="quizQuestions" placeholder="السؤال|الخيار1|الخيار2|الخيار3|الخيار4|رقم الإجابة" style="min-height:100px;"></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button class="btn-submit" onclick="saveQuiz()">💾 حفظ</button>
                </div>
            `;
            openModal('➕ إضافة كويز جديد', html);
            window._editQuizId = null;
        }

        function editQuiz(quizId) {
            const q = allQuizzes.find(x => x.id === quizId);
            if (!q) return;

            const questionsText = (q.questions || []).map(qq =>
                `${qq.question || ''}|${(qq.options || []).join('|')}|${(qq.correctAnswer || 0) + 1}`
            ).join('\n');

            const html = `
                <div class="form-group">
                    <label>عنوان الكويز *</label>
                    <input type="text" id="quizTitle" value="${q.title || ''}">
                </div>
                <div class="form-group">
                    <label>المدة (دقائق)</label>
                    <input type="number" id="quizDuration" value="${q.duration || 15}">
                </div>
                <div class="form-group">
                    <label>نقاط الكويز</label>
                    <input type="number" id="quizAtoms" value="${q.atomsReward || 5}">
                </div>
                <div class="form-group">
                    <label>الأسئلة</label>
                    <textarea id="quizQuestions" style="min-height:100px;">${questionsText}</textarea>
                </div>
                <div class="form-actions">
                    <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                    <button class="btn-submit" onclick="saveQuiz('${quizId}')">💾 تحديث</button>
                </div>
            `;
            openModal('✏️ تعديل كويز: ' + q.title, html);
            window._editQuizId = quizId;
        }

        function saveQuiz(quizId) {
            const title = document.getElementById('quizTitle').value.trim();
            const duration = parseInt(document.getElementById('quizDuration').value) || 15;
            const atomsReward = parseInt(document.getElementById('quizAtoms').value) || 5;
            const questionsText = document.getElementById('quizQuestions').value;

            if (!title) { showToast('يرجى إدخال عنوان الكويز', 'error'); return; }

            const questions = questionsText.split('\n').filter(line => line.trim()).map(line => {
                const parts = line.split('|').map(s => s.trim());
                if (parts.length >= 6) {
                    const options = parts.slice(1, 5);
                    const correctIndex = parseInt(parts[5]) - 1 || 0;
                    return {
                        id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                        question: parts[0],
                        options: options,
                        correctAnswer: Math.min(Math.max(correctIndex, 0), options.length - 1)
                    };
                }
                return null;
            }).filter(q => q);

            const data = {
                title: title,
                duration: duration,
                atomsReward: atomsReward,
                questions: questions,
                results: {},
                updatedAt: new Date().toISOString()
            };

            if (quizId) {
                db.ref('quizzes/' + quizId).update(data).then(() => {
                    showToast('✅ تم تحديث الكويز', 'success');
                    closeModal();
                    loadAllQuizzes().then(() => renderQuizzes());
                });
            } else {
                db.ref('quizzes').push(data).then(() => {
                    showToast('✅ تم إضافة الكويز', 'success');
                    closeModal();
                    loadAllQuizzes().then(() => renderQuizzes());
                });
            }
        }

        function deleteQuiz(quizId) {
            if (!confirm('⚠️ هل أنت متأكد من حذف هذا الكويز؟')) return;
            db.ref('quizzes/' + quizId).remove().then(() => {
                showToast('✅ تم حذف الكويز', 'success');

        function saveSubscription() {
            const userId = document.getElementById('subUser').value;
            const courseId = document.getElementById('subCourse').value;
            const type = document.getElementById('subType').value;
            const method = document.getElementById('subMethod').value;

            if (!userId || !courseId) { showToast('يرجى اختيار الطالب والكورس', 'error'); return; }

            const user = allUsers.find(u => u.id === userId);
            const course = allCourses.find(c => c.id === courseId);

            db.ref('subscriptions').push({
                userId: userId,
                courseId: courseId,
                status: 'active',
                type: type,
                method: method,
                createdAt: new Date().toISOString(),
                activatedAt: new Date().toISOString(),
                activatedBy: currentUser.uid,
                activatedByName: currentAdmin?.name || 'Admin'
            }).then(() => {
                db.ref('courses/' + courseId + '/subscribers/' + userId).set({
                    type: type,
                    method: method,
                    subscribedAt: new Date().toISOString()
                });
                db.ref('users/' + userId + '/premiumCourses/' + courseId).set(true);
                db.ref('courses/' + courseId + '/completedSubscriptions').transaction((current) => {
                    return (current || 0) + 1;
                });

                db.ref('adminLogs').push({
                    action: 'add_subscription',
                    userId: userId,
                    userName: user?.name || '—',
                    courseId: courseId,
                    courseName: course?.title || '—',
                    method: method,
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    timestamp: new Date().toISOString(),
                    details: `تفعيل اشتراك كورس "${course?.title || '—'}" للطالب ${user?.name || '—'} (طريقة: ${method})`
                });

                showToast('✅ تم تفعيل الاشتراك', 'success');
                closeModal();
                loadAllSubscriptions().then(() => renderSubscriptions());
                loadAllCourses();
            });
        }

        function deleteSubscription(subId, userId, courseId) {
            if (!confirm('⚠️ هل أنت متأكد من إلغاء هذا الاشتراك؟')) return;

            const user = allUsers.find(u => u.id === userId);
            const course = allCourses.find(c => c.id === courseId);

            db.ref('subscriptions/' + subId).remove().then(() => {
                if (userId && courseId) {
                    db.ref('users/' + userId + '/premiumCourses/' + courseId).remove();
                    db.ref('courses/' + courseId + '/subscribers/' + userId).remove();
                }

                db.ref('adminLogs').push({
                    action: 'remove_subscription',
                    userId: userId,
                    userName: user?.name || '—',
                    courseId: courseId,
                    courseName: course?.title || '—',
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    timestamp: new Date().toISOString(),
                    details: `إلغاء اشتراك كورس "${course?.title || '—'}" للطالب ${user?.name || '—'}`
                });

                showToast('✅ تم إلغاء الاشتراك', 'success');
                loadAllSubscriptions().then(() => renderSubscriptions());
                loadAllCourses();
            });
        }

        function generateRandomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 11; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return 'CH' + code;
        }

        function isValidCodeFormat(code) {
            return /^[A-Z0-9]{9,}$/.test(code);
        }

        // ============================================================
        // SAVE CODE - ACTUALLY SAVES TO FIREBASE
        // ============================================================
        function saveCode() {
            let code = document.getElementById('codeInput').value.trim().toUpperCase();
            const courseId = document.getElementById('codeCourse').value;
            const note = document.getElementById('codeNote').value.trim();
            const status = document.getElementById('codeStatus').value;

            if (!courseId) { showToast('يرجى اختيار الكورس', 'error'); return; }

            if (!code) {
                code = generateRandomCode();
            }

            if (!isValidCodeFormat(code)) {
                showToast('⚠️ الكود غير صالح. يجب أن يكون 9 أحرف أو أكثر، إنجليزي فقط (A-Z, 0-9)، بدون مسافات', 'error');
                return;
            }

            if (allActivationCodes.some(c => c.code === code)) {
                showToast('⚠️ هذا الكود موجود بالفعل', 'error');
                return;
            }

            const course = allCourses.find(c => c.id === courseId);
            if (!course) { showToast('الكورس غير موجود', 'error'); return; }

            const codeData = {
                code: code,
                courseId: courseId,
                courseName: course.title,
                note: note || '',
                status: status,
                used: false,
                usedBy: null,
                usedByName: null,
                usedAt: null,
                createdAt: new Date().toISOString(),
                createdBy: currentUser.uid,
                createdByName: currentAdmin?.name || 'Admin',
                attempts: 0,
                lastAttempt: null
            };

            db.ref('activationCodes').push(codeData).then(() => {
                db.ref('adminLogs').push({
                    action: 'create_activation_code',
                    code: code,
                    courseId: courseId,
                    courseName: course.title,
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    timestamp: new Date().toISOString(),

        // ============================================================
        // ACTIVATE CODE - STUDENT SIDE (to be added to student page)
        // ============================================================
        function activateStudentCode(code, userId, userName) {
            return new Promise((resolve, reject) => {
                // Check rate limiting
                const now = Date.now();
                if (codeAttempts[userId] && codeAttempts[userId].count >= MAX_CODE_ATTEMPTS) {
                    const timeSince = now - codeAttempts[userId].firstAttempt;
                    if (timeSince < CODE_ATTEMPT_WINDOW) {
                        reject(new Error('تم تجاوز عدد محاولات التفعيل، حاول لاحقاً'));
                        return;
                    } else {
                        // Reset attempts
                        codeAttempts[userId] = { count: 0, firstAttempt: now };
                    }
                }

                // Use Firebase transaction for atomic operation
                const codeRef = db.ref('activationCodes');
                codeRef.orderByChild('code').equalTo(code).once('value').then(snap => {
                    let codeData = null;
                    let codeId = null;
                    snap.forEach(child => {
                        codeData = child.val();
                        codeId = child.key;
                    });

                    if (!codeData) {
                        // Log failed attempt
                        if (!codeAttempts[userId]) {
                            codeAttempts[userId] = { count: 0, firstAttempt: now };
                        }
                        codeAttempts[userId].count++;
                        reject(new Error('الكود غير صحيح'));
                        return;
                    }

                    if (codeData.status === 'used') {
                        reject(new Error('هذا الكود تم استخدامه بالفعل'));
                        return;
                    }

                    if (codeData.status === 'disabled') {
                        reject(new Error('هذا الكود معطل ولا يمكن استخدامه'));
                        return;
                    }

                    if (codeData.status === 'expired') {
                        reject(new Error('هذا الكود منتهي الصلاحية'));
                        return;
                    }

                    if (codeData.used) {
                        reject(new Error('هذا الكود تم استخدامه بالفعل'));
                        return;
                    }

                    // Atomic update - use transaction to prevent race condition
                    db.ref('activationCodes/' + codeId).transaction((currentData) => {
                        if (currentData === null) return currentData;
                        if (currentData.used || currentData.status === 'used') {
                            return; // Abort transaction
                        }
                        // Update the code
                        currentData.used = true;
                        currentData.status = 'used';
                        currentData.usedBy = userId;
                        currentData.usedByName = userName;
                        currentData.usedAt = new Date().toISOString();
                        return currentData;
                    }).then((result) => {
                        if (result.committed && result.snapshot.exists()) {
                            // Success - now activate subscription for the user
                            const updatedData = result.snapshot.val();
                            const courseId = updatedData.courseId;

                            // Check if course exists
                            if (!courseId) {
                                reject(new Error('الكورس غير موجود في النظام'));
                                return;
                            }

                            // Add subscription for the user
                            const subData = {
                                userId: userId,
                                courseId: courseId,
                                status: 'active',
                                type: 'paid',
                                method: 'activation_code',
                                code: code,
                                createdAt: new Date().toISOString(),
                                activatedAt: new Date().toISOString()
                            };

                            db.ref('subscriptions').push(subData).then(() => {
                                // Update user's premium courses
                                db.ref('users/' + userId + '/premiumCourses/' + courseId).set(true);
                                // Update course subscribers
                                db.ref('courses/' + courseId + '/subscribers/' + userId).set({
                                    type: 'paid',
                                    method: 'activation_code',
                                    code: code,
                                    subscribedAt: new Date().toISOString()
                                });
                                // Update course completion stats
                                db.ref('courses/' + courseId + '/completedSubscriptions').transaction((current) => {
                                    return (current || 0) + 1;
                                });

                                // Log the activation
                                db.ref('adminLogs').push({
                                    action: 'activate_code',
                                    code: code,
                                    userId: userId,
                                    userName: userName,
                                    courseId: courseId,
                                    courseName: updatedData.courseName,
                                    timestamp: new Date().toISOString(),
                                    details: `استخدام كود "${code}" من قبل ${userName} لكورس "${updatedData.courseName}"`
                                });

                                resolve({
                                    success: true,
                                    message: '✅ تم تفعيل الكود بنجاح!',
                                    courseName: updatedData.courseName
                                });
                            }).catch((err) => {
                                // Rollback code status if subscription fails
                                db.ref('activationCodes/' + codeId).update({
                                    used: false,
                                    status: 'available',
                                    usedBy: null,
                                    usedByName: null,
                                    usedAt: null
                                });
                                reject(new Error('حدث خطأ أثناء تفعيل الاشتراك'));
                            });
                        } else {
                            reject(new Error('هذا الكود تم استخدامه بالفعل من قبل مستخدم آخر'));
                        }
                    }).catch((err) => {
                        reject(new Error('حدث خطأ أثناء معالجة الكود'));
                    });
                }).catch((err) => {
                    reject(new Error('حدث خطأ أثناء التحقق من الكود'));
                });
            });
        }

        function sendNotification() {
            const title = document.getElementById('notifTitle').value.trim();
            const body = document.getElementById('notifBody').value.trim();
            const target = document.getElementById('notifTarget').value;

            if (!title || !body) { showToast('يرجى إدخال العنوان والرسالة', 'error'); return; }

            let targetUsers = [];

            if (target === 'all') {
                targetUsers = allUsers;
            } else if (target === 'active') {
                const weekAgo = new Date(Date.now() - 7 * 86400000);
                targetUsers = allUsers.filter(u => u.lastLogin && new Date(u.lastLogin) > weekAgo);
            } else if (target === 'online') {
                const onlineIds = onlineUsers.filter(o => o.online).map(o => o.id);
                targetUsers = allUsers.filter(u => onlineIds.includes(u.id));
            } else if (target === 'course') {
                const courseId = document.getElementById('notifCourse').value;
                if (!courseId) { showToast('يرجى اختيار كورس', 'error'); return; }
                const subs = allSubscriptions.filter(s => s.courseId === courseId && s.status === 'active');
                const userIds = subs.map(s => s.userId);
                targetUsers = allUsers.filter(u => userIds.includes(u.id));
            } else if (target === 'student') {
                const userId = document.getElementById('notifStudent').value;
                if (!userId) { showToast('يرجى اختيار طالب', 'error'); return; }
                const user = allUsers.find(u => u.id === userId);
                if (user) targetUsers = [user];
            }

            if (targetUsers.length === 0) { showToast('لا يوجد مستخدمين مستهدفين', 'warning'); return; }

            const notifData = {
                title: title,
                description: body,
                icon: '📢',
                read: false,
                createdAt: new Date().toISOString(),
                fromAdmin: true,
                adminName: currentAdmin?.name || 'Admin'
            };

            let count = 0;
            const promises = targetUsers.map(u => {
                return db.ref('users/' + u.id + '/notifications').push(notifData).then(() => { count++; });
            });

            Promise.all(promises).then(() => {
                db.ref('adminLogs').push({
                    action: 'send_notification',
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    target: target,
                    targetCount: count,
                    title: title,
                    timestamp: new Date().toISOString(),
                    details: `إرسال إشعار "${title}" إلى ${count} طالب`
                });

                showToast(`✅ تم إرسال الإشعار إلى ${count} طالب`, 'success');
                document.getElementById('notifTitle').value = '';
                document.getElementById('notifBody').value = '';
            });
        }

                                        <span class="label" style="min-width:60px;">${key === 'youtube' ? '📺' : key === 'facebook' ? '📘' : key === 'instagram' ? '📸' : key === 'tiktok' ? '🎵' : key === 'friend' ? '👥' : key === 'teacher' ? '👨‍🏫' : key === 'whatsapp' ? '💬' : key === 'telegram' ? '✈️' : key}</span>
                                        <div class="bar-track">
                                            <div class="bar-fill ${colors[idx % colors.length]}" style="width:${pct}%;"></div>
                                        </div>
                                        <span class="value">${count}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-header">⚛️ توزيع النقاط</div>
                        <div class="chart-bar-container">
                            ${Object.entries(atomRanges).map(([range, count]) => {
                                const max = Math.max(...Object.values(atomRanges), 1);
                                const pct = Math.round((count / max) * 100);
                                const colors = ['primary','info','success','warning','danger','primary'];
                                const idx = Object.keys(atomRanges).indexOf(range) % colors.length;
                                return `
                                    <div class="chart-bar-item">
                                        <span class="label" style="min-width:50px;">${range}</span>
                                        <div class="bar-track">
                                            <div class="bar-fill ${colors[idx % colors.length]}" style="width:${pct}%;"></div>
                                        </div>
                                        <span class="value">${count}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="chart-card">
                        <div class="chart-header">📈 آخر 10 أيام - تسجيلات</div>
                        <div class="chart-bar-container">
                            ${dailyData.map(([date, count]) => {
                                const max = Math.max(...dailyData.map(([_,c]) => c), 1);
                                const pct = Math.round((count / max) * 100);
                                return `
                                    <div class="chart-bar-item">
                                        <span class="label" style="min-width:80px;">${date}</span>
                                        <div class="bar-track">
                                            <div class="bar-fill primary" style="width:${pct}%;"></div>
                                        </div>
                                        <span class="value">${count}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // RENDER SETTINGS (existing - kept)
        // ============================================================
        function renderSettings() {
            const content = document.getElementById('pageContent');

            content.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h4>⚙️ الإعدادات</h4>
                    </div>
                    <div style="display:grid;gap:1rem;">
                        <div style="background:var(--bg-dark);padding:1rem;border-radius:var(--radius-sm);">
                            <h4 style="font-weight:700;margin-bottom:0.5rem;">👥 إدارة المسؤولين</h4>
                            <p style="color:var(--text-muted);font-size:0.85rem;">إضافة أو إزالة مسؤولين من لوحة التحكم</p>
                            <div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;">
                                <input type="text" id="adminUidInput" placeholder="UID المستخدم" style="flex:1;min-width:200px;padding:0.4rem 0.8rem;border-radius:var(--radius-sm);border:1px solid var(--border-color);background:var(--bg-dark);color:var(--text-light);">
                                <button class="btn-sm primary" onclick="addAdmin()">➕ إضافة مسؤول</button>
                            </div>
                            <div id="adminsList" style="margin-top:0.5rem;">
                                <p style="color:var(--text-muted);font-size:0.8rem;">جاري تحميل قائمة المسؤولين...</p>
                            </div>
                        </div>
                        <div style="background:var(--bg-dark);padding:1rem;border-radius:var(--radius-sm);">
                            <h4 style="font-weight:700;margin-bottom:0.5rem;">⚠️ إجراءات خطيرة</h4>
                            <p style="color:var(--text-muted);font-size:0.85rem;">تنظيف البيانات أو إعادة تعيين النظام</p>
                            <div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;">
                                <button class="btn-sm danger" onclick="clearAllData()">🗑️ مسح جميع البيانات</button>
                                <button class="btn-sm warning" onclick="resetAtoms()">🔄 إعادة تعيين النقاط</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            loadAdminsList();
        }

        function loadAdminsList() {
            db.ref('admins').once('value').then(snap => {
                const container = document.getElementById('adminsList');
                if (!container) return;
                const admins = [];
                snap.forEach(child => {
                    if (child.val() === true) {
                        admins.push(child.key);
                    }
                });
                if (admins.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;">لا يوجد مسؤولين</p>';
                    return;
                }
                container.innerHTML = admins.map(uid =>
                    `<div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-card);padding:0.3rem 0.8rem;border-radius:var(--radius-sm);margin-bottom:0.2rem;">
                            <span style="font-size:0.8rem;font-family:monospace;">${uid}</span>
                            ${uid !== currentUser.uid ? `<button class="btn-sm danger icon-only" onclick="removeAdmin('${uid}')" title="إزالة"><i class="fas fa-times"></i></button>` : '<span style="font-size:0.7rem;color:var(--text-muted);">(أنت)</span>'}
                        </div>`
                ).join('');
            });
        }

        function addAdmin() {
            const uid = document.getElementById('adminUidInput').value.trim();
            if (!uid) { showToast('يرجى إدخال UID المستخدم', 'error'); return; }

            db.ref('admins/' + uid).set(true).then(() => {
                showToast('✅ تم إضافة المسؤول', 'success');
                document.getElementById('adminUidInput').value = '';
                loadAdminsList();
            });
        }

        function removeAdmin(uid) {
            if (!confirm(`⚠️ هل أنت متأكد من إزالة هذا المسؤول؟`)) return;
            db.ref('admins/' + uid).remove().then(() => {
                showToast('✅ تم إزالة المسؤول', 'success');
                loadAdminsList();
            });
        }

        function clearAllData() {
            if (!confirm('⚠️ ⚠️ ⚠️ تحذير شديد! هذا الإجراء سيمسح جميع بيانات المنصة. هل أنت متأكد تماماً؟')) return;
            if (!confirm('⚠️ تأكيد نهائي: اكتب "نعم" للمتابعة')) return;

            showToast('⏳ جاري مسح البيانات...', 'info');
            db.ref('users').remove().then(() => {
                db.ref('courses').remove();
                db.ref('lessons').remove();
                db.ref('exams').remove();
                db.ref('questions').remove();
                db.ref('quizzes').remove();
                db.ref('assignments').remove();
                db.ref('subscriptions').remove();
                db.ref('subscriptionRequests').remove();
                db.ref('announcements').remove();
                db.ref('online').remove();
                db.ref('activationCodes').remove();
                showToast('✅ تم مسح جميع البيانات', 'success');
                loadAllData();
            });
        }

        function resetAtoms() {
            if (!confirm('⚠️ هل أنت متأكد من إعادة تعيين جميع النقاط إلى 0؟')) return;

            const updates = {};
            allUsers.forEach(u => {
                updates['users/' + u.id + '/atoms'] = 0;
            });
            db.ref().update(updates).then(() => {
                showToast('✅ تم إعادة تعيين النقاط', 'success');
                loadAllUsers();
            });
        }

        // ============================================================
        // EXPORT USERS CSV (existing - kept)
        // ============================================================
        function exportUsersCSV() {
            if (allUsers.length === 0) { showToast('لا يوجد طلاب للتصدير', 'warning'); return; }

            let csv =
                'الاسم,رقم الهاتف,ولي الأمر,البريد,الكود,النقاط,الترتيب,الحالة,تاريخ التسجيل,مصدر المعرفة,الصف,الشعبة,نوع التعليم,عدد مرات الدخول,آخر نشاط,النوع\n';
            allUsers.forEach(u => {
                csv +=
                    `${u.name},${u.phone||''},${u.parentPhone||''},${u.email||''},${u.code||''},${u.atoms||0},${u.rank||''},${u.banned?'محظور':'نشط'},${u.createdAt?new Date(u.createdAt).toLocaleDateString('ar'):''},${u.howFound||''},${u.grade||''},${u.section||''},${u.studyType||''},${u.loginCount||0},${u.lastLogin?new Date(u.lastLogin).toLocaleDateString('ar'):''},${u.gender||''}\n`;
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `طلاب_يلا_كيمياء_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            showToast('✅ تم تصدير البيانات', 'success');
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Any additional initialization
        });

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        console.log('🚀 Admin Panel v4.0 - يلا كيمياء (Full Real System)');
        console.log('📊 All systems ready');
        console.log('👥 Total users loaded:', allUsers.length);
        console.log('📚 Total courses loaded:', allCourses.length);
        console.log('❓ Total questions loaded:', allQuestions.length);
        console.log('🔑 Total activation codes loaded:', allActivationCodes.length);
        console.log('👨‍💼 Admin UID:', currentUser?.uid);
        console.log('✅ All features are REAL and working with Firebase');
    </script>

</body>
</html>
