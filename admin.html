<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - يلا كيمياء</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --primary: #E52B9C;
            --primary-dark: #c91d84;
            --primary-light: #f05aaf;
            --deep-purple: #1F1235;
            --deep-purple-light: #2d1a4a;
            --bg-dark: #0d0a1a;
            --bg-card: #16102a;
            --bg-card-hover: #1f1640;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.06);
            --success: #22C55E;
            --danger: #EF4444;
            --warning: #F59E0B;
            --info: #3B82F6;
            --radius: 1rem;
            --radius-sm: 0.6rem;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 260px;
            --navbar-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, var(--deep-purple) 0%, var(--bg-dark) 100%);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            transition: var(--transition);
            overflow-y: auto;
            padding: 1rem 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 3px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .sidebar .logo {
            padding: 0.8rem 1.5rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .sidebar .logo img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            margin-bottom: 0.3rem;
        }

        .sidebar .logo h2 {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar .logo .sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
        }

        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.7rem 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            border-right: 3px solid transparent;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .sidebar .nav-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-light);
        }

        .sidebar .nav-item.active {
            color: var(--primary);
            border-right-color: var(--primary);
            background: rgba(229, 43, 156, 0.08);
        }

        .sidebar .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        .sidebar .nav-item .badge {
            margin-right: auto;
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            background: var(--primary);
            color: #fff;
        }

        .sidebar .nav-divider {
            height: 1px;
            background: var(--border-color);
            margin: 0.5rem 1.5rem;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            margin-right: var(--sidebar-width);
            min-height: 100vh;
            padding: 0;
        }

        /* ============================================================
           ADMIN NAVBAR
           ============================================================ */
        .admin-navbar {
            background: rgba(22, 16, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 1.5rem;
            height: var(--navbar-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .admin-navbar .left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .admin-navbar .left .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
        }

        .admin-navbar .left h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .admin-navbar .right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .admin-navbar .right .admin-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .admin-navbar .right .admin-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: #fff;
        }

        .admin-navbar .right .logout-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            padding: 0.3rem 0.8rem;
            border-radius: var(--radius-sm);
        }

        .admin-navbar .right .logout-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        /* ============================================================
           PAGE CONTENT
           ============================================================ */
        .page-content {
            padding: 1.5rem;
        }

        /* ============================================================
           STATS GRID
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1rem 1rem 0.8rem;
            transition: var(--transition);
        }

        .stat-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .stat-card .icon {
            font-size: 1.2rem;
            margin-bottom: 0.1rem;
        }

        .stat-card .number {
            font-size: 1.3rem;
            font-weight: 900;
            display: block;
            font-family: 'Tajawal', sans-serif;
        }

        .stat-card .number.primary {
            color: var(--primary);
        }
        .stat-card .number.success {
            color: var(--success);
        }
        .stat-card .number.warning {
            color: var(--warning);
        }
        .stat-card .number.danger {
            color: var(--danger);
        }
        .stat-card .number.info {
            color: var(--info);
        }

        .stat-card .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stat-card .change {
            font-size: 0.65rem;
            font-weight: 600;
            margin-top: 0.1rem;
        }
        .stat-card .change.up {
            color: var(--success);
        }
        .stat-card .change.down {
            color: var(--danger);
        }

        /* ============================================================
           CHARTS
           ============================================================ */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1rem 1rem 1.2rem;
        }

        .chart-card .chart-header {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--text-light);
        }

        .chart-bar-container {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .chart-bar-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chart-bar-item .label {
            font-size: 0.7rem;
            color: var(--text-muted);
            min-width: 70px;
            text-align: right;
        }

        .chart-bar-item .bar-track {
            flex: 1;
            height: 20px;
            background: var(--bg-dark);
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
        }

        .chart-bar-item .bar-track .bar-fill {
            height: 100%;
            border-radius: var(--radius-sm);
            transition: width 1s ease;
            background: var(--primary);
        }

        .chart-bar-item .bar-track .bar-fill.success {
            background: var(--success);
        }
        .chart-bar-item .bar-track .bar-fill.warning {
            background: var(--warning);
        }
        .chart-bar-item .bar-track .bar-fill.danger {
            background: var(--danger);
        }
        .chart-bar-item .bar-track .bar-fill.info {
            background: var(--info);
        }

        .chart-bar-item .value {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-light);
            min-width: 35px;
            text-align: left;
        }

        /* ============================================================
           CARDS
           ============================================================ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .card .card-header h4 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .card .card-header .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* ============================================================
           TABLE
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 700px;
        }

        table thead th {
            padding: 0.5rem 0.8rem;
            text-align: right;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        table tbody td {
            padding: 0.5rem 0.8rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-light);
            vertical-align: middle;
        }

        table tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        table tbody td .avatar-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.65rem;
            background: var(--primary);
            color: #fff;
            overflow: hidden;
        }

        table tbody td .avatar-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-badge {
            padding: 0.1rem 0.6rem;
            border-radius: 50px;
            font-size: 0.6rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-badge.active {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }
        .status-badge.banned {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }
        .status-badge.pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }
        .status-badge.online {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }
        .status-badge.offline {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-muted);
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-sm {
            padding: 0.25rem 0.8rem;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-sm.primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-sm.primary:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }

        .btn-sm.success {
            background: var(--success);
            color: #fff;
        }
        .btn-sm.success:hover {
            background: #16A34A;
            transform: scale(1.02);
        }

        .btn-sm.danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-sm.danger:hover {
            background: #DC2626;
            transform: scale(1.02);
        }

        .btn-sm.warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-sm.warning:hover {
            background: #D97706;
            transform: scale(1.02);
        }

        .btn-sm.info {
            background: var(--info);
            color: #fff;
        }
        .btn-sm.info:hover {
            background: #2563EB;
            transform: scale(1.02);
        }

        .btn-sm.outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }
        .btn-sm.outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-sm.icon-only {
            padding: 0.25rem 0.4rem;
            min-width: 28px;
            justify-content: center;
        }

        /* ============================================================
           SEARCH / FILTER
           ============================================================ */
        .search-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-bar input,
        .search-bar select {
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-light);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.8rem;
            outline: none;
            transition: var(--transition);
            min-height: 36px;
        }

        .search-bar input:focus,
        .search-bar select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(229, 43, 156, 0.1);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-bar select option {
            background: var(--bg-dark);
            color: var(--text-light);
        }

        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination {
            display: flex;
            gap: 0.3rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.75rem;
            min-width: 32px;
        }

        .pagination button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem 2rem 2rem;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-box .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-box .modal-header .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .modal-box .modal-header .close-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .modal-box .form-group {
            margin-bottom: 0.8rem;
        }

        .modal-box .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .modal-box .form-group input,
        .modal-box .form-group select,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 0.5rem 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
        }

        .modal-box .form-group input:focus,
        .modal-box .form-group select:focus,
        .modal-box .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(229, 43, 156, 0.1);
        }

        .modal-box .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-box .form-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: flex-end;
        }

        .modal-box .form-actions button {
            padding: 0.4rem 1.2rem;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
        }

        .modal-box .form-actions .btn-submit {
            background: var(--primary);
            color: #fff;
        }

        .modal-box .form-actions .btn-submit:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }

        .modal-box .form-actions .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .modal-box .form-actions .btn-cancel:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            width: 90%;
            max-width: 500px;
            pointer-events: none;
        }

        .toast {
            pointer-events: auto;
            padding: 0.7rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            animation: slideUp 0.4s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 0.3rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .toast-success {
            background: var(--success);
            color: #fff;
        }
        .toast-error {
            background: var(--danger);
            color: #fff;
        }
        .toast-info {
            background: var(--primary);
            color: #fff;
        }
        .toast-warning {
            background: var(--warning);
            color: #fff;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ============================================================
           LOADING
           ============================================================ */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {

        ::-webkit-scrollbar-thumb {
            background: var(--primary);

        }

        /* ============================================================
           UTILITY
           ============================================================ */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: var(--text-muted);
        }

            margin-top: 0.5rem;
        }
        .mb-1 {
            margin-bottom: 0.5rem;
        }
        .flex {
            display: flex;
        }
        .flex-wrap {

        }
        .gap-1 {
            gap: 0.5rem;
        }
        .gap-2 {
            gap: 1rem;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .w-full {
            width: 100%;

        .empty-state {

            padding: 2rem 1rem;

        .empty-state .icon {

            margin-bottom: 0.5rem;

        .empty-state h4 {

            font-weight: 700;
            color: var(--text-light);
        }
        .empty-state p {
            font-size: 0.85rem;
        }

        /* Progress bar for tables */
        .progress-bar-mini {
            width: 60px;
            height: 4px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;

        .progress-bar-mini .fill {
            height: 100%;
            border-radius: 4px;
            background: var(--primary);
            transition: width 0.5s;
        }
        .progress-bar-mini .fill.success {
            background: var(--success);
        }
        .progress-bar-mini .fill.warning {
            background: var(--warning);
        }
        .progress-bar-mini .fill.danger {
            background: var(--danger);

        /* Sidebar overlay for mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .sidebar-overlay.open {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar-overlay.open {
                display: block;
            }
        }

        /* Online status indicator */
        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;

        .online-dot.offline {
            background: var(--text-muted);

        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }
    </style>
</head>

    <!-- ===== FIREBASE ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBOBu3wp3GcA-VjwtqIt1PAYYpo_HXFhtU",
            authDomain: "yalla-kimya.firebaseapp.com",
            databaseURL: "https://yalla-kimya-default-rtdb.firebaseio.com",
            projectId: "yalla-kimya",
            storageBucket: "yalla-kimya.firebasestorage.app",
            messagingSenderId: "1052374689829",
            appId: "1:1052374689829:web:fbb815ab42d753e63377cc",
            measurementId: "G-B3SJFF8R1R"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let currentAdmin = null;
        let isAdmin = false;
        let allUsers = [];
        let allCourses = [];
        let allLessons = [];
        let allExams = [];
        let allQuizzes = [];
        let allAssignments = [];
        let allSubscriptions = [];
        let allLogs = [];
        let onlineUsers = [];
        let currentPage = 'dashboard';
        let isLoading = false;
        let usersPage = 1;
        const USERS_PAGE_SIZE = 20;
        let usersFilter = 'all';
        let usersSearch = '';
        let usersSort = 'newest';

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const el = document.createElement('div');
            el.className = 'toast toast-' + type;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 4000);
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(title, bodyHTML) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        // ============================================================
        // SIDEBAR
        // ============================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        // ============================================================
        // CHECK ADMIN - CORRECT VERSION
        // ============================================================
        async function checkAdmin(uid) {
            try {
                // Check in admins collection
                const snap1 = await db.ref('admins/' + uid).once('value');
                if (snap1.exists() && snap1.val() === true) {
                    return true;
                }
                // Check in users collection
                const snap2 = await db.ref('users/' + uid).once('value');
                if (snap2.exists()) {
                    const data = snap2.val();
                    if (data.isAdmin === true || data.role === 'admin' || data.role === true) {
                        return true;
                    }
                }
                return false;
            } catch (e) {
                console.error('Admin check error:', e);
                return false;
            }
        }

        // ============================================================
        // AUTH & ADMIN CHECK
        // ============================================================
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const isAdminUser = await checkAdmin(user.uid);
            if (!isAdminUser) {
                showToast('⛔ غير مصرح لك بالدخول إلى لوحة التحكم', 'error');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                return;
            }

            isAdmin = true;
            currentUser = user;
            document.getElementById('adminName').textContent = user.displayName || 'Admin';
            document.getElementById('adminAvatar').textContent = (user.displayName || 'A')[0];

            // Load admin data
            db.ref('users/' + user.uid).once('value').then(snap => {
                if (snap.exists()) {
                    currentAdmin = snap.val();
                    document.getElementById('adminName').textContent = currentAdmin.name || 'Admin';
                    document.getElementById('adminAvatar').textContent = (currentAdmin.name || 'A')[0];
                }
            });

            // Load all data and render dashboard
            loadAllData().then(() => {
                loadPage('dashboard');
                showToast('👋 مرحباً بك في لوحة التحكم', 'info');
            });

            // Real-time online users
            db.ref('online').on('value', (snap) => {
                onlineUsers = [];
                snap.forEach(child => {
                    const data = child.val();
                    onlineUsers.push({
                        id: child.key,
                        ...data,
                        name: data.name || 'مستخدم',
                        online: data.online !== false
                    });
                });
                document.getElementById('onlineCountBadge').textContent = onlineUsers.filter(u => u.online)
                    .length;
                if (currentPage === 'online') renderOnlineUsers();
            });
        });

        // ============================================================
        // AUTH - LOGOUT
        // ============================================================
        function logout() {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            });
        }

        // ============================================================
        // LOAD DATA
        // ============================================================
        function loadAllUsers() {
            return new Promise((resolve) => {
                db.ref('users').once('value').then(snap => {
                    allUsers = [];
                    snap.forEach(child => {
                        const data = child.val();
                        // Skip admin accounts
                        if (data.isAdmin === true || data.role === 'admin' || data.role === true) {
                            return;
                        }
                        allUsers.push({
                            id: child.key,
                            ...data,
                            atoms: data.atoms || 0,
                            name: data.name || 'مستخدم',
                            phone: data.phone || '',
                            parentPhone: data.parentPhone || '',
                            email: data.email || '',
                            grade: data.grade || 'تالتة ثانوي',
                            section: data.section || '',
                            studyType: data.studyType || 'عام',
                            howFound: data.howFound || 'أخرى',
                            createdAt: data.createdAt || Date.now(),
                            banned: data.banned === true || data.isBanned === true,
                            status: data.banned === true || data.isBanned === true ? 'banned' : 'active',
                            active: data.active !== false,
                            loginCount: data.loginCount || 0,
                            lastLogin: data.lastLogin || null,
                            rank: data.rank || '--',
                            progress: data.progress || {},
                            photoURL: data.photoURL || '',
                            code: data.code || '',
                            premiumCourses: data.premiumCourses || {},
                            howFound: data.howFound || 'أخرى',
                            errorBank: data.errorBank || [],
                            results: data.results || [],
                            subscriptions: data.subscriptions || {}
                        });
                    });
                    document.getElementById('usersCountBadge').textContent = allUsers.length;
                    resolve(allUsers);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllCourses() {
            return new Promise((resolve) => {
                db.ref('courses').once('value').then(snap => {
                    allCourses = [];
                    snap.forEach(child => {
                        const data = child.val();
                        allCourses.push({
                            id: child.key,
                            ...data,
                            isFree: data.isFree !== false,
                            lessonsCount: data.lessonsCount || 0,
                            subscribers: data.subscribers || {},
                            subscriberCount: data.subscribers ? Object.keys(data.subscribers).length : 0
                        });
                    });
                    resolve(allCourses);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllLessons() {
            return new Promise((resolve) => {
                db.ref('lessons').once('value').then(snap => {
                    allLessons = [];
                    snap.forEach(child => {
                        allLessons.push({ id: child.key, ...child.val() });
                    });
                    resolve(allLessons);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllExams() {
            return new Promise((resolve) => {
                db.ref('exams').once('value').then(snap => {
                    allExams = [];
                    snap.forEach(child => {
                        const data = child.val();
                        allExams.push({
                            id: child.key,
                            ...data,
                            questions: data.questions || []
                        });
                    });
                    resolve(allExams);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllQuizzes() {
            return new Promise((resolve) => {
                db.ref('quizzes').once('value').then(snap => {
                    allQuizzes = [];
                    snap.forEach(child => {
                        const data = child.val();
                        allQuizzes.push({
                            id: child.key,
                            ...data,
                            questions: data.questions || []
                        });
                    });
                    resolve(allQuizzes);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllAssignments() {
            return new Promise((resolve) => {
                db.ref('assignments').once('value').then(snap => {
                    allAssignments = [];
                    snap.forEach(child => {
                        allAssignments.push({ id: child.key, ...child.val() });
                    });
                    resolve(allAssignments);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllSubscriptions() {
            return new Promise((resolve) => {
                db.ref('subscriptions').once('value').then(snap => {
                    allSubscriptions = [];
                    snap.forEach(child => {
                        allSubscriptions.push({ id: child.key, ...child.val() });
                    });
                    resolve(allSubscriptions);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllLogs() {
            return new Promise((resolve) => {
                db.ref('adminLogs').orderByChild('timestamp').limitToLast(500).once('value').then(snap => {
                    allLogs = [];
                    snap.forEach(child => {
                        allLogs.push({ id: child.key, ...child.val() });
                    });
                    allLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    resolve(allLogs);
                }).catch(() => { resolve([]); });
            });
        }

        function loadOnlineUsers() {
            return new Promise((resolve) => {
                db.ref('online').once('value').then(snap => {
                    onlineUsers = [];
                    snap.forEach(child => {
                        const data = child.val();
                        onlineUsers.push({
                            id: child.key,
                            ...data,
                            name: data.name || 'مستخدم',
                            online: data.online !== false
                        });
                    });
                    // Also check users with recent activity
                    const now = Date.now();
                    allUsers.forEach(u => {
                        if (u.lastLogin && (now - new Date(u.lastLogin).getTime() < 5 * 60 * 1000)) {
                            if (!onlineUsers.some(o => o.id === u.id)) {
                                onlineUsers.push({
                                    id: u.id,
                                    name: u.name || 'مستخدم',
                                    online: true,
                                    lastSeen: u.lastLogin,
                                    phone: u.phone || ''
                                });
                            }
                        }
                    });
                    document.getElementById('onlineCountBadge').textContent = onlineUsers.filter(u => u
                        .online).length;
                    resolve(onlineUsers);
                }).catch(() => { resolve([]); });
            });
        }

        function loadAllData() {
            return Promise.all([
                loadAllUsers(),
                loadAllCourses(),
                loadAllLessons(),
                loadAllExams(),
                loadAllQuizzes(),
                loadAllAssignments(),
                loadAllSubscriptions(),
                loadAllLogs(),
                loadOnlineUsers()
            ]);
        }

        // ============================================================
        // PAGE LOADER
        // ============================================================
        function loadPage(page) {
            if (isLoading) return;
            isLoading = true;

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add('active');

            const titles = {
                dashboard: 'الرئيسية',
                users: 'الطلاب',
                online: 'المتصلون الآن',
                courses: 'الكورسات',
                lessons: 'الحصص',
                exams: 'الامتحانات',
                quizzes: 'الكويزات',
                assignments: 'الواجبات',
                subscriptions: 'الاشتراكات',
                notifications: 'الإشعارات',
                announcements: 'الإعلانات',
                leaderboard: 'المتصدرين',
                logs: 'سجل العمليات',
                analytics: 'التحليلات',
                settings: 'الإعدادات'
            };
            document.getElementById('pageTitle').textContent = titles[page] || page;

            currentPage = page;

            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('open');
            }

            const content = document.getElementById('pageContent');
            content.innerHTML =
                '<div style="text-align:center;padding:2rem;"><div class="loading-spinner"></div><p style="margin-top:0.5rem;color:var(--text-muted);">جاري التحميل...</p></div>';

            switch (page) {
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'users':
                    renderUsers();
                    break;
                case 'online':
                    renderOnlineUsers();
                    break;
                case 'courses':
                    renderCourses();
                    break;
                case 'lessons':
                    renderLessons();
                    break;
                case 'exams':
                    renderExams();
                    break;
                case 'quizzes':
                    renderQuizzes();
                    break;
                case 'assignments':
                    renderAssignments();
                    break;
                case 'subscriptions':
                    renderSubscriptions();
                    break;
                case 'leaderboard':
                    renderLeaderboard();
                    break;
                case 'notifications':
                    renderNotifications();
                    break;
                case 'announcements':
                    renderAnnouncements();
                    break;
                case 'logs':
                    renderLogs();
                    break;
                case 'analytics':
                    renderAnalytics();
                    break;
                case 'settings':
                    renderSettings();
                    break;
                default:
                    content.innerHTML =
                    '<div class="empty-state"><div class="icon">🚧</div><h4>صفحة قيد التطوير</h4></div>';
            }

            setTimeout(() => { isLoading = false; }, 300);
        }

        // ============================================================
        // RENDER DASHBOARD - 30+ Stats
        // ============================================================
        function renderDashboard() {
            const content = document.getElementById('pageContent');

            const now = Date.now();
            const today = new Date().toDateString();
            const yesterday = new Date(now - 86400000).toDateString();
            const twoDaysAgo = new Date(now - 2 * 86400000).toDateString();
            const weekAgo = new Date(now - 7 * 86400000);
            const monthAgo = new Date(now - 30 * 86400000);
            const threeMonthsAgo = new Date(now - 90 * 86400000);
            const fourMonthsAgo = new Date(now - 120 * 86400000);
            const sixMonthsAgo = new Date(now - 180 * 86400000);

        function renderUsers() {
            const content = document.getElementById('pageContent');

            let filtered = [...allUsers];

            if (usersSearch) {
                const s = usersSearch.toLowerCase();
                filtered = filtered.filter(u =>
                    (u.name || '').toLowerCase().includes(s) ||
                    (u.phone || '').includes(s) ||
                    (u.email || '').toLowerCase().includes(s) ||
                    (u.code || '').toLowerCase().includes(s) ||
                    (u.id || '').toLowerCase().includes(s)
                );
            }

            if (usersFilter === 'banned') filtered = filtered.filter(u => u.banned);
            else if (usersFilter === 'active') filtered = filtered.filter(u => !u.banned);
            else if (usersFilter === 'online') {
                const onlineIds = onlineUsers.filter(o => o.online).map(o => o.id);
                filtered = filtered.filter(u => onlineIds.includes(u.id));
            } else if (usersFilter === 'subscribed') {
                const subUserIds = allSubscriptions.filter(s => s.status === 'active').map(s => s.userId);
                filtered = filtered.filter(u => subUserIds.includes(u.id));
            } else if (usersFilter === 'not_subscribed') {
                const subUserIds = allSubscriptions.filter(s => s.status === 'active').map(s => s.userId);
                filtered = filtered.filter(u => !subUserIds.includes(u.id));
            } else if (usersFilter === 'new_today') {
                const today = new Date().toDateString();
                filtered = filtered.filter(u => new Date(u.createdAt).toDateString() === today);
            } else if (usersFilter === 'old') {
                const monthAgo = new Date(Date.now() - 30 * 86400000);
                filtered = filtered.filter(u => new Date(u.createdAt) < monthAgo);
            }

            if (usersSort === 'newest') filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            else if (usersSort === 'oldest') filtered.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
            else if (usersSort === 'name') filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            else if (usersSort === 'most_atoms') filtered.sort((a, b) => (b.atoms || 0) - (a.atoms || 0));
            else if (usersSort === 'least_atoms') filtered.sort((a, b) => (a.atoms || 0) - (b.atoms || 0));
            else if (usersSort === 'most_active') filtered.sort((a, b) => (b.lastLogin || 0) - (a.lastLogin || 0));

        // ============================================================
        // TOGGLE BAN
        // ============================================================
        function toggleBan(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const newStatus = !user.banned;
            const action = newStatus ? 'حظر' : 'فك الحظر';

            if (newStatus && !confirm(`⚠️ هل أنت متأكد من حظر الطالب "${user.name}"؟`)) return;

            db.ref('users/' + userId + '/banned').set(newStatus);
            db.ref('users/' + userId + '/isBanned').set(newStatus);

            db.ref('adminLogs').push({
                action: newStatus ? 'ban_user' : 'unban_user',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                timestamp: new Date().toISOString(),
                details: `${action} الطالب ${user.name}`
            });

            showToast(`✅ تم ${action} الطالب بنجاح`, 'success');
            loadAllUsers().then(() => renderUsers());
        }

        // ============================================================
        // ADD POINTS
        // ============================================================
        function addPointsModal(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const html = `
                    <div class="form-group">

                        <input type="text" value="${user.name}" disabled style="opacity:0.6;">
                    </div>
                    <div class="form-group">

                    <div class="form-group">
                        <label>عدد النقاط</label>
                        <input type="number" id="pointsAmount" value="10" min="1" style="width:100%;">
                    </div>

                        <label>السبب</label>

        function addPoints(userId) {
            const amount = parseInt(document.getElementById('pointsAmount').value) || 0;
            const reason = document.getElementById('pointsReason').value || 'بدون سبب';

            if (amount <= 0) { showToast('يجب إدخال عدد نقاط صحيح', 'error'); return; }

            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const current = user.atoms || 0;

            db.ref('users/' + userId + '/atoms').set(current + amount);

            db.ref('adminLogs').push({
                action: 'add_points',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                amount: amount,
                reason: reason,
                timestamp: new Date().toISOString(),
                details: `إضافة ${amount} نقطة للطالب ${user.name} (${reason})`
            });

            showToast(`✅ تم إضافة ${amount} نقطة بنجاح`, 'success');
            closeModal();
            loadAllUsers().then(() => renderUsers());
        }

        function removePoints(userId) {
            const amount = parseInt(document.getElementById('removePointsAmount').value) || 0;
            const reason = document.getElementById('removePointsReason').value || 'بدون سبب';

            if (amount <= 0) { showToast('يجب إدخال عدد نقاط صحيح', 'error'); return; }

            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const current = user.atoms || 0;
            const newTotal = Math.max(0, current - amount);

            db.ref('users/' + userId + '/atoms').set(newTotal);

            db.ref('adminLogs').push({
                action: 'remove_points',
                userId: userId,
                userName: user.name,
                adminId: currentUser.uid,
                adminName: currentAdmin?.name || 'Admin',
                amount: amount,
                reason: reason,
                timestamp: new Date().toISOString(),
                details: `حذف ${amount} نقطة من الطالب ${user.name} (${reason})`
            });

            showToast(`✅ تم حذف ${amount} نقطة بنجاح`, 'success');
            closeModal();
            loadAllUsers().then(() => renderUsers());
        }

        // ============================================================
        // MANAGE USER SUBSCRIPTIONS
        // ============================================================
        function manageUserSubscriptions(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const userSubs = allSubscriptions.filter(s => s.userId === userId);

            const courseOptions = allCourses.map(c =>
                `<option value="${c.id}">${c.title} ${c.isFree ? '(مجاني)' : '(مدفوع)'}</option>`
            ).join('');

            const html = `
                    <div style="margin-bottom:1rem;">
                        <h4 style="font-size:0.9rem;font-weight:700;margin-bottom:0.5rem;">📚 اشتراكات ${user.name}</h4>
                        ${userSubs.length === 0 ? '<p style="color:var(--text-muted);font-size:0.8rem;">لا يوجد اشتراكات</p>' : ''}
                        ${userSubs.map(s => {
                            const course = allCourses.find(c => c.id === s.courseId);
                            return `
                                <div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-dark);padding:0.5rem 0.8rem;border-radius:var(--radius-sm);margin-bottom:0.3rem;">

                            <label>اختر الكورس</label>

                        </div>
                        <div class="form-actions">
                            <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                            <button class="btn-submit" onclick="addUserSubscription('${userId}')">💾 تفعيل</button>
                        </div>

            openModal(`📚 إدارة اشتراكات: ${user.name}`, html);
        }

        function addUserSubscription(userId) {
            const courseId = document.getElementById('subCourseSelect').value;
            if (!courseId) { showToast('يرجى اختيار كورس', 'error'); return; }

            const user = allUsers.find(u => u.id === userId);
            if (!user) { showToast('الطالب غير موجود', 'error'); return; }

            const course = allCourses.find(c => c.id === courseId);
            if (!course) { showToast('الكورس غير موجود', 'error'); return; }

            // Check if already subscribed
            const existing = allSubscriptions.find(s => s.userId === userId && s.courseId === courseId && s.status ===
                'active');
            if (existing) {
                showToast('⚠️ هذا الطالب مشترك بالفعل في هذا الكورس', 'warning');
                return;
            }

            db.ref('subscriptions').push({
                userId: userId,
                courseId: courseId,
                status: 'active',
                type: course.isFree ? 'free' : 'paid',
                createdAt: new Date().toISOString(),
                activatedAt: new Date().toISOString(),
                activatedBy: currentUser.uid,
                activatedByName: currentAdmin?.name || 'Admin'
            }).then(() => {
                db.ref('users/' + userId + '/premiumCourses/' + courseId).set(true);

                db.ref('adminLogs').push({
                    action: 'add_subscription',
                    userId: userId,
                    userName: user.name,
                    courseId: courseId,
                    courseName: course.title,
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    timestamp: new Date().toISOString(),
                    details: `تفعيل اشتراك كورس "${course.title}" للطالب ${user.name}`
                });

                showToast(`✅ تم تفعيل الاشتراك في "${course.title}"`, 'success');
                closeModal();
                loadAllSubscriptions().then(() => loadAllUsers());
                showToast('🔄 تم التحديث', 'info');
                // Re-open the user management
                setTimeout(() => manageUserSubscriptions(userId), 500);
            });
        }

        function removeUserSubscription(subId, userId, courseId) {
            if (!confirm('⚠️ هل أنت متأكد من إلغاء هذا الاشتراك؟')) return;

            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            const course = allCourses.find(c => c.id === courseId);

            db.ref('subscriptions/' + subId).remove().then(() => {
                if (userId && courseId) {
                    db.ref('users/' + userId + '/premiumCourses/' + courseId).remove();
                }

                db.ref('adminLogs').push({
                    action: 'remove_subscription',
                    userId: userId,
                    userName: user.name,
                    courseId: courseId,
                    courseName: course ? course.title : '—',
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    timestamp: new Date().toISOString(),
                    details: `إلغاء اشتراك كورس "${course ? course.title : '—'}" للطالب ${user.name}`
                });

                showToast('✅ تم إلغاء الاشتراك', 'success');
                loadAllSubscriptions().then(() => loadAllUsers());
                // Refresh the modal
                closeModal();
                setTimeout(() => manageUserSubscriptions(userId), 500);
            });
        }

        function saveCourse(courseId) {
            const title = document.getElementById('courseTitle').value.trim();
            const description = document.getElementById('courseDesc').value.trim();
            const image = document.getElementById('courseImage').value.trim();
            const type = document.getElementById('courseType').value;
            const price = document.getElementById('coursePrice').value.trim();
            const grade = document.getElementById('courseGrade').value;
            const section = document.getElementById('courseSection').value;
            const lessonsCount = parseInt(document.getElementById('courseLessonsCount').value) || 0;
            const type2 = document.getElementById('courseType2').value;

            if (!title) { showToast('يرجى إدخال اسم الكورس', 'error'); return; }

            const data = {
                title: title,
                description: description || '',
                image: image || '',
                isFree: type === 'مجاني',
                price: price || '0',
                grade: grade,
                section: section,
                lessonsCount: lessonsCount,
                type: type2 || 'مسجل',
                subscribers: {},
                updatedAt: new Date().toISOString()
            };

            if (courseId) {
                db.ref('courses/' + courseId).update(data).then(() => {
                    showToast('✅ تم تحديث الكورس بنجاح', 'success');
                    closeModal();
                    loadAllCourses().then(() => renderCourses());
                });
            } else {
                db.ref('courses').push(data).then(() => {
                    showToast('✅ تم إضافة الكورس بنجاح', 'success');
                    closeModal();
                    loadAllCourses().then(() => renderCourses());
                });
            }
        }

        function deleteCourse(courseId) {
            if (!confirm('⚠️ هل أنت متأكد من حذف هذا الكورس؟ سيتم حذف جميع الحصص المرتبطة به.')) return;

            // Delete associated lessons
            const courseLessons = allLessons.filter(l => l.courseId === courseId);
            courseLessons.forEach(l => {
                db.ref('lessons/' + l.id).remove();
            });

            db.ref('courses/' + courseId).remove().then(() => {
                showToast('✅ تم حذف الكورس', 'success');
                loadAllCourses().then(() => renderCourses());
                loadAllLessons();
            });
        }

        function saveExam(examId) {
            const title = document.getElementById('examTitle').value.trim();
            const duration = parseInt(document.getElementById('examDuration').value) || 30;
            const atomsReward = parseInt(document.getElementById('examAtoms').value) || 10;
            const questionsText = document.getElementById('examQuestions').value;

            if (!title) { showToast('يرجى إدخال عنوان الامتحان', 'error'); return; }

            const questions = questionsText.split('\n').filter(line => line.trim()).map(line => {
                const parts = line.split('|').map(s => s.trim());
                if (parts.length >= 6) {
                    const options = parts.slice(1, 5);
                    const correctIndex = parseInt(parts[5]) - 1 || 0;
                    return {
                        id: 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                        question: parts[0],
                        options: options,
                        correctAnswer: Math.min(Math.max(correctIndex, 0), options.length - 1)
                    };
                }
                return null;
            }).filter(q => q);

            const data = {
                title: title,
                duration: duration,
                atomsReward: atomsReward,
                questions: questions,
                updatedAt: new Date().toISOString()
            };

            if (examId) {
                db.ref('exams/' + examId).update(data).then(() => {
                    showToast('✅ تم تحديث الامتحان', 'success');

                });
            }
        }

            if (!userId || !courseId) { showToast('يرجى اختيار الطالب والكورس', 'error'); return; }

            const user = allUsers.find(u => u.id === userId);
            const course = allCourses.find(c => c.id === courseId);

            db.ref('subscriptions').push({
                userId: userId,
                courseId: courseId,
                status: 'active',
                type: type,
                createdAt: new Date().toISOString(),
                activatedAt: new Date().toISOString(),
                activatedBy: currentUser.uid,
                activatedByName: currentAdmin?.name || 'Admin'
            }).then(() => {
                // Add to course subscribers
                db.ref('courses/' + courseId + '/subscribers/' + userId).set({
                    type: type,
                    subscribedAt: new Date().toISOString()
                });
                db.ref('users/' + userId + '/premiumCourses/' + courseId).set(true);

                db.ref('adminLogs').push({
                    action: 'add_subscription',
                    userId: userId,
                    userName: user?.name || '—',
                    courseId: courseId,
                    courseName: course?.title || '—',

                    adminName: currentAdmin?.name || 'Admin',
                    timestamp: new Date().toISOString(),
                    details: `تفعيل اشتراك كورس "${course?.title || '—'}" للطالب ${user?.name || '—'}`
                });

                showToast('✅ تم تفعيل الاشتراك', 'success');
                closeModal();
                loadAllSubscriptions().then(() => renderSubscriptions());
                loadAllCourses();
            });
        }

        function deleteSubscription(subId, userId, courseId) {
            if (!confirm('⚠️ هل أنت متأكد من إلغاء هذا الاشتراك؟')) return;

            const user = allUsers.find(u => u.id === userId);
            const course = allCourses.find(c => c.id === courseId);

            db.ref('subscriptions/' + subId).remove().then(() => {
                if (userId && courseId) {

                    userId: userId,
                    userName: user?.name || '—',
                    courseId: courseId,
                    courseName: course?.title || '—',

        function sendNotification() {
            const title = document.getElementById('notifTitle').value.trim();
            const body = document.getElementById('notifBody').value.trim();
            const target = document.getElementById('notifTarget').value;

            if (!title || !body) { showToast('يرجى إدخال العنوان والرسالة', 'error'); return; }

            let targetUsers = allUsers;
            if (target === 'active') {
                const weekAgo = new Date(Date.now() - 7 * 86400000);
                targetUsers = allUsers.filter(u => u.lastLogin && new Date(u.lastLogin) > weekAgo);
            } else if (target === 'online') {
                const onlineIds = onlineUsers.filter(o => o.online).map(o => o.id);
                targetUsers = allUsers.filter(u => onlineIds.includes(u.id));
            } else if (target === 'subscribed') {
                const subUserIds = allSubscriptions.filter(s => s.status === 'active').map(s => s.userId);
                targetUsers = allUsers.filter(u => subUserIds.includes(u.id));
            }

            if (targetUsers.length === 0) { showToast('لا يوجد مستخدمين مستهدفين', 'warning'); return; }

            const notifData = {
                title: title,
                description: body,
                icon: '📢',
                read: false,
                createdAt: new Date().toISOString(),
                fromAdmin: true,
                adminName: currentAdmin?.name || 'Admin'
            };

            let count = 0;
            const promises = targetUsers.map(u => {
                return db.ref('users/' + u.id + '/notifications').push(notifData).then(() => { count++; });
            });

            Promise.all(promises).then(() => {
                db.ref('adminLogs').push({
                    action: 'send_notification',
                    adminId: currentUser.uid,
                    adminName: currentAdmin?.name || 'Admin',
                    target: target,
                    targetCount: count,
                    title: title,
                    timestamp: new Date().toISOString(),
                    details: `إرسال إشعار "${title}" إلى ${count} طالب`
                });

                showToast(`✅ تم إرسال الإشعار إلى ${count} طالب`, 'success');
                document.getElementById('notifTitle').value = '';
                document.getElementById('notifBody').value = '';
            });
        }

        // ============================================================
        // RENDER ANALYTICS
        // ============================================================
        function renderAnalytics() {
            const content = document.getElementById('pageContent');

            const now = Date.now();
            const today = new Date().toDateString();
            let todayUsers = 0,
                weekUsers = 0,
                monthUsers = 0,
                threeMonthUsers = 0,
                sixMonthUsers = 0;
            allUsers.forEach(u => {
                const created = new Date(u.createdAt).toDateString();
                if (created === today) todayUsers++;
                if (new Date(u.createdAt) >= new Date(now - 7 * 86400000)) weekUsers++;
                if (new Date(u.createdAt) >= new Date(now - 30 * 86400000)) monthUsers++;
                if (new Date(u.createdAt) >= new Date(now - 90 * 86400000)) threeMonthUsers++;
                if (new Date(u.createdAt) >= new Date(now - 180 * 86400000)) sixMonthUsers++;
            });

            const howFoundStats = {};
            allUsers.forEach(u => {
                const source = u.howFound || 'أخرى';
                howFoundStats[source] = (howFoundStats[source] || 0) + 1;
            });

            // Atoms distribution
            const atomRanges = { '0-10': 0, '11-50': 0, '51-100': 0, '101-500': 0, '501-1000': 0, '1000+': 0 };
            allUsers.forEach(u => {
                const a = u.atoms || 0;
                if (a <= 10) atomRanges['0-10']++;
                else if (a <= 50) atomRanges['11-50']++;
                else if (a <= 100) atomRanges['51-100']++;
                else if (a <= 500) atomRanges['101-500']++;
                else if (a <= 1000) atomRanges['501-1000']++;
                else atomRanges['1000+']++;
            });

            // Daily registrations (last 30 days)
            const dailyRegs = {};
            allUsers.forEach(u => {
                const d = new Date(u.createdAt).toLocaleDateString('ar');
                dailyRegs[d] = (dailyRegs[d] || 0) + 1;
            });
            const dailyData = Object.entries(dailyRegs).slice(-10);

            content.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="icon">📊</div>
                            <span class="number primary">${todayUsers}</span>
                            <div class="label">تسجيلات اليوم</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">📈</div>
                            <span class="number info">${weekUsers}</span>
                            <div class="label">تسجيلات 7 أيام</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">📅</div>
                            <span class="number warning">${monthUsers}</span>
                            <div class="label">تسجيلات 30 يوم</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">📅</div>
                            <span class="number info">${threeMonthUsers}</span>
                            <div class="label">تسجيلات 3 أشهر</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">📅</div>
                            <span class="number info">${sixMonthUsers}</span>
                            <div class="label">تسجيلات 6 أشهر</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">👥</div>
                            <span class="number success">${allUsers.length}</span>
                            <div class="label">إجمالي الطلاب</div>
                        </div>
                    </div>

                    <div class="charts-grid">
                        <div class="chart-card">
                            <div class="chart-header">📊 مصادر معرفة الطلاب</div>
                            <div class="chart-bar-container">
                                ${Object.entries(howFoundStats).sort((a,b) => b[1] - a[1]).slice(0,8).map(([key, count]) => {
                                    const max = Math.max(...Object.values(howFoundStats), 1);
                                    const pct = Math.round((count / max) * 100);
                                    const colors = ['primary','success','warning','info','danger','primary','success','warning'];
                                    const idx = Object.keys(howFoundStats).indexOf(key) % colors.length;
                                    return `
                                        <div class="chart-bar-item">
                                            <span class="label" style="min-width:60px;">${key === 'youtube' ? '📺' : key === 'facebook' ? '📘' : key === 'instagram' ? '📸' : key === 'tiktok' ? '🎵' : key === 'friend' ? '👥' : key === 'teacher' ? '👨‍🏫' : key === 'whatsapp' ? '💬' : key === 'telegram' ? '✈️' : key}</span>
                                            <div class="bar-track">
                                                <div class="bar-fill ${colors[idx % colors.length]}" style="width:${pct}%;"></div>
                                            </div>
                                            <span class="value">${count}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="chart-card">
                            <div class="chart-header">⚛️ توزيع النقاط</div>
                            <div class="chart-bar-container">
                                ${Object.entries(atomRanges).map(([range, count]) => {
                                    const max = Math.max(...Object.values(atomRanges), 1);
                                    const pct = Math.round((count / max) * 100);
                                    const colors = ['primary','info','success','warning','danger','primary'];
                                    const idx = Object.keys(atomRanges).indexOf(range) % colors.length;
                                    return `
                                        <div class="chart-bar-item">
                                            <span class="label" style="min-width:50px;">${range}</span>
                                            <div class="bar-track">
                                                <div class="bar-fill ${colors[idx % colors.length]}" style="width:${pct}%;"></div>
                                            </div>
                                            <span class="value">${count}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="chart-card">
                            <div class="chart-header">📈 آخر 10 أيام - تسجيلات</div>
                            <div class="chart-bar-container">
                                ${dailyData.map(([date, count]) => {
                                    const max = Math.max(...dailyData.map(([_,c]) => c), 1);
                                    const pct = Math.round((count / max) * 100);
                                    return `
                                        <div class="chart-bar-item">
                                            <span class="label" style="min-width:80px;">${date}</span>
                                            <div class="bar-track">
                                                <div class="bar-fill primary" style="width:${pct}%;"></div>
                                            </div>
                                            <span class="value">${count}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
